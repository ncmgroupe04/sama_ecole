        quantity: { type: integer }
        movementDate: { type: string, format: date }
        reason: { type: string }
        counterpartyLabel: { type: string, nullable: true }
        quantityTotalAfter: { type: integer }
        quantityAvailableAfter: { type: integer }

    InventoryItemOpenAssignment:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, example: DEC-2026-A3F1C0 }
        beneficiaryType: { $ref: '#/components/schemas/AssignmentBeneficiaryType' }
        beneficiaryLabel: { type: string }
        quantity: { type: integer }
        returnedQuantity: { type: integer }
        assignedOn: { type: string, format: date }
        dueOn: { type: string, format: date, nullable: true }
        isOverdue: { type: boolean }
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        rowVersion: { type: integer, format: int64 }

    StockMovementCreateRequest:
      type: object
      required: [itemId, type, quantity, reason, rowVersion]
      properties:
        itemId: { type: string, format: uuid }
        type:
          type: string
          description: >-
            Volontairement plus étroit que StockMovementType : `Attribution` et `Restitution` ne sont
            pas saisissables ici.
          enum: [Entree, Sortie, Ajustement, MiseAuRebut]
        quantity:
          type: integer
          description: >-
            Nombre d'unités du mouvement — ou, pour un `Ajustement`, l'effectif COMPTÉ lors de
            l'inventaire physique (le serveur en déduit le sens et l'ampleur de la correction). Zéro
            n'est accepté que pour un ajustement.
        movementDate:
          type: string
          format: date
          nullable: true
          description: Par défaut aujourd'hui. Jamais dans le futur.
        reason:
          type: string
          maxLength: 200
          description: >-
            Obligatoire : c'est le motif qui rend le journal opposable lors d'un contrôle
            (« dotation mairie 2026 », « casse salle 102 »).
        counterpartyLabel:
          type: string
          nullable: true
          maxLength: 150
          description: Fournisseur en entrée, destinataire en sortie. Texte libre.
        rowVersion:
          type: integer
          format: int64
          description: Jeton xmin du BIEN, pas du mouvement.

    StockMovementResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/StockMovementType' }
        quantity: { type: integer }
        movementDate: { type: string, format: date }
        quantityTotalAfter: { type: integer }
        quantityAvailableAfter: { type: integer }
        itemRowVersion:
          type: integer
          format: int64
          description: >-
            NOUVEAU jeton du bien : l'écran enchaîne souvent plusieurs mouvements sur le même bien,
            et sans lui le second partirait en 409 sur un jeton périmé.

    StockMovementListItem:
      allOf:
        - $ref: '#/components/schemas/StockMovementResult'
        - type: object
          properties:
            itemName: { type: string }
            itemCode: { type: string, nullable: true }
            reason: { type: string }
            counterpartyLabel: { type: string, nullable: true }
            assignmentId:
              type: string
              format: uuid
              nullable: true
              description: Renseigné pour les mouvements liés à une fiche de prêt.

    PaginatedStockMovements:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StockMovementListItem' }
        totalCount: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    ItemAssignmentCreateRequest:
      type: object
      required: [itemId, beneficiaryType, beneficiaryId, rowVersion]
      properties:
        itemId: { type: string, format: uuid }
        quantity:
          type: integer
          minimum: 1
          default: 1
          description: Douze manuels remis à un même élève tiennent en UNE fiche, pas douze.
        beneficiaryType: { $ref: '#/components/schemas/AssignmentBeneficiaryType' }
        beneficiaryId:
          type: string
          format: uuid
          description: Identifiant de l'élève, de l'enseignant ou de l'utilisateur, selon `beneficiaryType`.
        assignedOn: { type: string, format: date, nullable: true, description: Par défaut aujourd'hui. Jamais dans le futur. }
        dueOn: { type: string, format: date, nullable: true, description: Retour attendu — typiquement la fin de l'année scolaire. }
        notes: { type: string, nullable: true, maxLength: 500 }
        rowVersion: { type: integer, format: int64, description: Jeton xmin du BIEN. }

    ItemAssignmentResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference:
          type: string
          example: DEC-2026-A3F1C0
          description: >-
            Numéro de la décharge, DÉRIVÉ de l'identifiant de la fiche et non tiré d'un compteur :
            une décharge n'a aucune exigence de numérotation continue, et le numéro doit rester
            identique à chaque réimpression.
        itemId: { type: string, format: uuid }
        itemName: { type: string }
        quantity: { type: integer }
        beneficiaryType: { $ref: '#/components/schemas/AssignmentBeneficiaryType' }
        beneficiaryId: { type: string, format: uuid }
        beneficiaryLabel:
          type: string
          description: Nom FIGÉ au moment de l'affectation, pour qu'une réimpression soit identique au papier signé.
        assignedOn: { type: string, format: date }
        dueOn: { type: string, format: date, nullable: true }
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        rowVersion: { type: integer, format: int64 }
        itemRowVersion: { type: integer, format: int64 }

    ItemAssignmentListItem:
      allOf:
        - $ref: '#/components/schemas/ItemAssignmentResult'
        - type: object
          properties:
            itemCode: { type: string, nullable: true }
            returnedQuantity: { type: integer }
            returnedOn: { type: string, format: date, nullable: true }
            returnCondition: { $ref: '#/components/schemas/ItemCondition' }
            isOverdue: { type: boolean }

    PaginatedItemAssignments:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ItemAssignmentListItem' }
        totalCount: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    ItemReturnRequest:
      type: object
      required: [returnedQuantity, rowVersion]
      properties:
        returnedQuantity:
          type: integer
          minimum: 0
          description: >-
            Unités rendues CE JOUR-LÀ, pas le cumul. Zéro n'est licite qu'avec
            `declareRemainderLost` — sinon il n'y aurait rien à enregistrer.
        returnCondition: { $ref: '#/components/schemas/ItemCondition' }
        returnedOn: { type: string, format: date, nullable: true, description: Par défaut aujourd'hui. }
        declareRemainderLost:
          type: boolean
          default: false
          description: >-
            Déclare PERDU tout ce qui n'est pas rendu : la part manquante sort du patrimoine
            (mouvement `PerteSurPret`) et la fiche est clôturée. Sans ce drapeau, une restitution
            partielle laisse la fiche ouverte, en attente du reste.
        rowVersion: { type: integer, format: int64, description: Jeton xmin de la FICHE. }

    ItemReturnResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        returnedQuantity: { type: integer, description: Cumul des restitutions successives. }
        outstandingQuantity: { type: integer, description: Reste à rendre — zéro dès que la fiche est clôturée. }
        returnedOn: { type: string, format: date }
        quantityAvailableAfter: { type: integer }
        rowVersion: { type: integer, format: int64 }
        itemRowVersion: { type: integer, format: int64 }

    ExamType:
