        école dont le dossier est incomplet.
      properties:
        schoolName: { type: string }
        nationalSchoolCode: { type: string, nullable: true }
        ministryAuthorizationNumber: { type: string, nullable: true }
        schoolDistrictCode: { type: string, nullable: true }
        inspectionAcademie: { type: string, nullable: true }
        inspectionEducationFormation: { type: string, nullable: true }
        gpsCoordinates:
          type: string
          nullable: true
          description: Calculé (« 14.692800, -17.446700 »), jamais stocké. Null si l'une des deux coordonnées manque.
        schoolYearLabel: { type: string }
        observationDate:
          type: string
          format: date
          description: Date d'arrêté des effectifs ET de calcul des âges. Deux tirages à la même date d'observation donnent la même pyramide.
        generatedAt: { type: string, format: date-time }
        totalStudents: { type: integer }
        totalGirls: { type: integer }
        totalBoys: { type: integer }
        totalRepeaters: { type: integer }
        girlsRatio:
          type: number
          nullable: true
          description: Pourcentage 0–100. NULL — et non zéro — quand l'effectif est nul.
        boysRatio: { type: number, nullable: true }
        totalTeachers: { type: integer }
        qualifiedTeachers:
          type: integer
          description: Porteurs d'un diplôme PROFESSIONNEL (CEAP/CAP/CAEM/CAES). Un Master sans titre pédagogique n'est pas qualifié.
        unreportedQualificationTeachers: { type: integer }
        teachersWithoutGender: { type: integer }
        studentsWithoutIen: { type: integer }
        studentsPerTeacher: { type: number, nullable: true }
        studentsPerClassroom: { type: number, nullable: true }
        classroomCount: { type: integer }
        physicalRoomCount: { type: integer }
        buildingCount: { type: integer }
        enrollmentsByLevel:
          type: array
          items: { $ref: '#/components/schemas/StateducLevelEnrollmentRow' }
        agePyramid:
          type: array
          items: { $ref: '#/components/schemas/StateducAgeBracketRow' }
        teacherQualifications:
          type: array
          items: { $ref: '#/components/schemas/StateducTeacherQualificationRow' }
        teacherStatuses:
          type: array
          items: { $ref: '#/components/schemas/StateducTeacherStatusRow' }

    StateducLevelEnrollmentRow:
      type: object
      description: Un NIVEAU réglementaire (CI, CP, 6e…), la maille d'agrégation du ministère — jamais une classe nommée.
      properties:
        level: { type: string }
        cycle: { type: string }
        boys: { type: integer }
        girls: { type: integer }
        total: { type: integer }
        girlsRatio: { type: number, nullable: true }
        repeaters: { type: integer }
        withoutIen: { type: integer }
        classroomCount:
          type: integer
          description: Divisions RÉELLEMENT peuplées, comptées depuis les inscriptions — une classe ouverte sans inscrit ne compte pas.
        averageClassSize: { type: number, nullable: true }

    StateducAgeBracketRow:
      type: object
      description: >
        Une tranche d'âge. `age = null` recueille les élèves à date de naissance invraisemblable
        (postérieure à l'observation, ou plus de 30 ans) : les ranger dans une vraie tranche
        déplacerait un effectif réel vers une case fausse.
      properties:
        age: { type: integer, nullable: true }
        label: { type: string, example: "12 ans" }
        boys: { type: integer }
        girls: { type: integer }
        total: { type: integer }

    StateducTeacherQualificationRow:
      type: object
      description: >
        Croisement diplôme académique × diplôme professionnel, exigé par le formulaire.
        `genderNotReported` est une TROISIÈME colonne, absente du formulaire officiel : les fiches
        sans genre saisi y sont comptées à part plutôt qu'imputées à l'une des deux colonnes
        réglementaires, ce qui serait faux et indétectable.
      properties:
        academicQualification:
          type: string
          enum: [NonRenseigne, Aucun, BFEM, BAC, Licence, Master, Doctorat]
        professionalQualification:
          type: string
          enum: [NonRenseigne, Aucun, CEAP, CAP, CAEM, CAES]
        men: { type: integer }
        women: { type: integer }
        genderNotReported: { type: integer }
        count: { type: integer }

    StateducTeacherStatusRow:
      type: object
      properties:
        status:
          type: string
          enum: [NonRenseigne, Fonctionnaire, Contractuel, Vacataire, Volontaire, Benevole]
        men: { type: integer }
        women: { type: integer }
        genderNotReported: { type: integer }
        count: { type: integer }

    ParentSummons:
      type: object
      description: Ligne de GET /parent-summons.
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        studentFullName: { type: string }
        studentMatricule: { type: string }
        scheduledAt: { type: string, format: date-time }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/ParentSummonsStatus' }
        outcomeNotes: { type: string, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }

    ParentSummonsCreateRequest:
      type: object
      required: [studentId, scheduledAt, reason]
      properties:
        studentId: { type: string, format: uuid }
        scheduledAt: { type: string, format: date-time }
        reason: { type: string, maxLength: 1000 }

    ParentNotice:
      type: object
      description: >-
        Avis de convocation imprimable — même formalisme M.E.N. que le certificat de scolarité et le
        PV de discipline (en-tête République/Ministère/IA/IEF). Ne porte jamais la suite de
        l'entretien : voir la règle sur PATCH /parent-summons/{id}/outcome.
      properties:
        parentSummonsId: { type: string, format: uuid }
        noticeNumber: { type: string, example: "CONV-3F2A9C1B" }
        matricule: { type: string }
        studentFullName: { type: string }
        classroomName: { type: string }
        schoolYearLabel: { type: string, nullable: true }
        scheduledAt: { type: string, format: date-time }
        reason: { type: string }
        issuedAt: { type: string, format: date-time }
        guardianName: { type: string, nullable: true }
        guardianPhone: { type: string, nullable: true }
        schoolName: { type: string }
        schoolAddress: { type: string, nullable: true }
        schoolCity: { type: string, nullable: true }
        inspectionAcademie: { type: string, nullable: true }
        inspectionEducationFormation: { type: string, nullable: true }
        headingPrefix: { type: string, description: "« Lycée » / « Collège » / « École » selon le cycle — voir SchoolHeading." }
        headingName: { type: string, nullable: true }
        schoolLogoUrl: { type: string, nullable: true }

    ParentSummonsStatus:
      type: string
      enum: [Scheduled, Honored, Missed, Postponed]
      description: >-
        Cycle de vie d'une convocation de parent (Volume 1 §18.2). Scheduled est l'état de départ,
        posé à la création ; les trois autres sont les suites possibles de l'entretien et ne se
        consignent qu'une fois.

    ParentSummonsOutcomeRequest:
      type: object
      description: Corps de PATCH /parent-summons/{id}/outcome — l'identifiant vient de la route.
      required: [outcome]
      properties:
        outcome:
          allOf:
            - $ref: '#/components/schemas/ParentSummonsStatus'
          description: >-
            Suite de l'entretien. Scheduled est refusé (422) : c'est l'état de départ, pas une suite,
            et l'accepter laisserait une convocation close sans l'être.
        outcomeNotes:
          type: string
          maxLength: 2000
          nullable: true
          description: >-
            Compte rendu. Requis (422 sinon) pour Missed et Postponed ; facultatif pour Honored, qui
            se suffit à elle-même.

    ParentSummonsOutcomeResult:
      type: object
      description: État de la convocation après consignation de la suite.
      properties:
        summonsId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ParentSummonsStatus' }
        outcomeNotes: { type: string, nullable: true }
        closedAt: { type: string, format: date-time }

    ClassJournalEntry:
      type: object
      description: Ligne du cahier de texte — ticket JGK-P04.
      properties:
        id: { type: string, format: uuid }
        classroomId: { type: string, format: uuid }
        classroomName: { type: string }
        subjectId: { type: string, format: uuid }
        subjectName: { type: string }
        teacherId: { type: string, format: uuid }
        teacherName: { type: string }
        sessionDate: { type: string, format: date }
        topic: { type: string }
        content: { type: string }
        homework: { type: string, nullable: true }
        homeworkDueDate: { type: string, format: date, nullable: true }
        rowVersion: { type: integer }
        canEdit:
          type: boolean
          description: >-
            Calculé serveur (ClassJournalEditWindow.CanCorrect) : vrai pour Directeur/Secrétariat,
            ou pour l'auteur dans les 15 jours suivant sessionDate. Confort d'affichage — la vraie
            garde reste PUT/DELETE /class-journal/{id} (403 sinon).

    ClassJournalEntryCreateRequest:
      type: object
      required: [classroomId, subjectId, sessionDate, topic, content]
      properties:
        classroomId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        sessionDate:
          type: string
          format: date
          description: Doit être aujourd'hui ou une date passée (422 sinon).
        topic: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 4000 }
        homework: { type: string, maxLength: 2000, nullable: true }
        homeworkDueDate:
          type: string
          format: date
          nullable: true
          description: N'a de sens que si `homework` est renseigné ; ne peut précéder `sessionDate`.

    ClassJournalEntryUpdateRequest:
      type: object
      description: Corps de PUT /class-journal/{id} — classe, matière et date de séance ne se corrigent jamais ici.
      required: [topic, content, rowVersion]
      properties:
        topic: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 4000 }
        homework: { type: string, maxLength: 2000, nullable: true }
        homeworkDueDate: { type: string, format: date, nullable: true }
        rowVersion: { type: integer }

    PaginatedClassJournalEntries:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ClassJournalEntry' } }
        totalCount: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    QuranProgress:
      type: object
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        juzNumber: { type: integer, minimum: 1, maximum: 30 }
        hizbNumber: { type: integer, minimum: 1, maximum: 60 }
        surahNumber: { type: integer, minimum: 1, maximum: 114 }
        status: { type: string, enum: [InProcess, Memorized, Revised] }
        evaluationDate: { type: string, format: date, nullable: true }
        notes: { type: string, maxLength: 2000, nullable: true }
        rowVersion: { type: integer }

    QuranProgressCreateRequest:
      type: object
      required: [studentId, juzNumber, hizbNumber, surahNumber, status]
      properties:
        studentId: { type: string, format: uuid }
        juzNumber: { type: integer, minimum: 1, maximum: 30 }
        hizbNumber: { type: integer, minimum: 1, maximum: 60 }
        surahNumber: { type: integer, minimum: 1, maximum: 114 }
        status: { type: string, enum: [InProcess, Memorized, Revised] }
        evaluationDate: { type: string, format: date, nullable: true }
        notes: { type: string, maxLength: 2000, nullable: true }

    QuranProgressUpdateRequest:
      type: object
      description: Corps de PUT /quran/progress/{id} — Juz, Hizb, sourate et élève ne se corrigent jamais ici.
      required: [status, rowVersion]
      properties:
        status: { type: string, enum: [InProcess, Memorized, Revised] }
        evaluationDate: { type: string, format: date, nullable: true }
        notes: { type: string, maxLength: 2000, nullable: true }
        rowVersion: { type: integer }

    ClassQuranProgressRow:
      type: object
      properties:
        studentId: { type: string, format: uuid }
        matricule: { type: string }
        fullName: { type: string }
        entries: { type: array, items: { $ref: '#/components/schemas/QuranProgress' } }

    QuranEvaluation:
      type: object
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        evaluationDate: { type: string, format: date }
        memoryMistakes: { type: integer, minimum: 0 }
        tajwidMistakes: { type: integer, minimum: 0 }
        hesitations: { type: integer, minimum: 0 }
        finalScore: { type: number, minimum: 0 }
        rowVersion: { type: integer }

    QuranEvaluationCreateRequest:
      type: object
      required: [studentId, evaluationDate, memoryMistakes, tajwidMistakes, hesitations, finalScore]
      properties:
        studentId: { type: string, format: uuid }
        evaluationDate: { type: string, format: date, description: Ne peut pas être future. }
        memoryMistakes: { type: integer, minimum: 0 }
        tajwidMistakes: { type: integer, minimum: 0 }
        hesitations: { type: integer, minimum: 0 }
        finalScore: { type: number, minimum: 0, description: Aucun plafond métier — aucun barème n'est spécifié pour l'examen oral. }

    QuranEvaluationUpdateRequest:
      type: object
      description: Corps de PUT /quran/evaluations/{id} — l'élève ne se corrige jamais ici.
      required: [evaluationDate, memoryMistakes, tajwidMistakes, hesitations, finalScore, rowVersion]
      properties:
        evaluationDate: { type: string, format: date }
        memoryMistakes: { type: integer, minimum: 0 }
        tajwidMistakes: { type: integer, minimum: 0 }
        hesitations: { type: integer, minimum: 0 }
        finalScore: { type: number, minimum: 0 }
        rowVersion: { type: integer }

    ClassQuranEvaluationRow:
      type: object
      properties:
        studentId: { type: string, format: uuid }
        matricule: { type: string }
        fullName: { type: string }
        entries: { type: array, items: { $ref: '#/components/schemas/QuranEvaluation' } }
