    StateducReport:
      type: object
      description: >
        Rapport annuel STATEDUC (Volume 1 §23.3). Tous les agrégats sont des COMPTAGES, jamais des
        estimations. Les champs `...WithoutIen`, `unreportedQualificationTeachers` et
        `teachersWithoutGender` mesurent l'état de la SAISIE, pas l'établissement : ils sont publiés
