openapi: 3.0.3
info:
  title: Unikol API
  description: >
    API REST de la plateforme SaaS de gestion scolaire Unikol.
    Toutes les routes (sauf /auth/*) exigent un JWT Bearer valide.
    Le tenant (SchoolId) est dérivé du claim `schoolId` du token, jamais d'un paramètre de requête.
    Référence fonctionnelle complète : docs/Volume_4_API_Design.md
  version: "1.1.0"
servers:
  - url: https://api.sama-ecole.sn/v1
    description: Production
  - url: https://staging-api.sama-ecole.sn/v1
    description: Staging
  - url: http://localhost:5000/v1
    description: Développement local

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Users
  - name: Schools
  - name: SchoolYears
  - name: Classrooms
  - name: Subjects
  - name: Coefficients
  - name: ClassSubjects
  - name: Students
  - name: Teachers
  - name: Attendance
  - name: Enrollments
  - name: Grades
  - name: ReportCards
  - name: Finance
  - name: Subscriptions
  - name: RegistrationRequests
  - name: Payments
  - name: Reports
  - name: Audit
  - name: Platform
  - name: Notifications
  - name: Inventory
  - name: Exams
  - name: VieScolaire
  - name: StateIntegration
  - name: ClassJournal
  - name: Quran

paths:
  /state-integration/planete/export:
    get:
      tags: [StateIntegration]
      summary: Export « Planète Ready » des élèves (CSV ou JSON)
      description: >
        Matrice élèves au format d'échange du SIMEN, pour une année scolaire (Volume 1 §23.2).
        Renvoie un FICHIER en pièce jointe dans les deux formats — y compris `json` : c'est un
        livrable à déposer sur le portail du ministère, pas une réponse d'API à consommer.
        Le périmètre est l'INSCRIPTION non annulée de l'exercice, pas l'élève « actuellement en base ».
        Réservé au Directeur : l'export sort l'état civil de tous les élèves en un fichier. Journalisé.
      parameters:
        - name: schoolYearId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: format
          in: query
          schema: { type: string, enum: [Csv, Json], default: Csv }
        - name: classroomId
          in: query
          description: Restreint l'export à une classe (contrôle avant transmission globale). Omis = tout l'établissement.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Fichier d'export (Content-Disposition&#58; attachment).
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/json:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >
            Le code établissement national (SIMEN) n'est pas renseigné. L'export refuse plutôt que de
            produire un fichier au code vide, que le ministère rejetterait silencieusement des jours
            plus tard. Le message nomme l'écran où corriger.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /state-integration/simen/status:
    get:
      tags: [StateIntegration]
      summary: État du relais API du ministère
      description: >
        Consommé par l'écran AVANT d'afficher l'action « Transmettre au SIMEN ». Aucune donnée
        d'établissement ne transite ici. À ce jour `isConfigured` vaut toujours `false` — aucune API
        publique du SIMEN n'est ouverte.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  isConfigured: { type: boolean }
                  message: { type: string }

  /state-integration/stateduc:
    get:
      tags: [StateIntegration]
      summary: Rapport annuel STATEDUC (agrégats JSON)
      description: >
        Effectifs par niveau, pyramide des âges, qualifications et statuts du personnel (Volume 1 §23.3).
        Les trois représentations (JSON, PDF, Excel) sortent du MÊME calcul.
      parameters:
        - name: schoolYearId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: observationDate
          in: query
          description: >
            Date d'arrêté des effectifs et de calcul des âges. Omise = aujourd'hui. Explicite pour
            qu'une école qui réédite son rapport en décembre retrouve les chiffres déclarés en juin.
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StateducReport' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /state-integration/stateduc/pdf:
    get:
      tags: [StateIntegration]
      summary: Rapport STATEDUC — formulaire officiel (PDF A4 paysage)
      parameters:
        - name: schoolYearId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: observationDate
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: PDF prêt à signer et déposer.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }

  /state-integration/stateduc/excel:
    get:
      tags: [StateIntegration]
      summary: Rapport STATEDUC — classeur .xlsx (consolidation IEF)
      parameters:
        - name: schoolYearId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: observationDate
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Classeur (une feuille par tableau réglementaire). Les effectifs sont des NOMBRES, jamais du texte mis en forme.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }

  /state-integration/students/{studentId}/ien:
    put:
      tags: [StateIntegration]
      summary: Enregistre l'IEN d'un élève, ou génère un numéro provisoire
      description: >
        DEUX MODES. `ienNumber` renseigné = saisie du numéro OFFICIEL reçu du SIMEN (le mode normal).
        `ienNumber` null ou absent = demande de génération d'un numéro PROVISOIRE de secours, sans
        valeur officielle (Volume 1 §23.1). Une chaîne VIDE est refusée en 422 : « champ laissé vide »
        ne doit jamais déclencher une génération non demandée.


        Un IEN officiel écrase un provisoire. L'INVERSE EST REFUSÉ (409) — aucun numéro fabriqué ne
        remplace un IEN délivré par le ministère.
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ienNumber:
                  type: string
                  nullable: true
                  maxLength: 24
                  description: Numéro officiel. Null ou absent = générer un provisoire.
      responses:
        '200':
          description: OK. `isProvisional` doit être affiché immédiatement par l'écran.
          content:
            application/json:
              schema:
                type: object
                properties:
                  studentId: { type: string, format: uuid }
                  ienNumber: { type: string }
                  isProvisional: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: IEN déjà porté par un autre élève de l'école, ou tentative d'écraser un IEN officiel par un provisoire.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: >
            Forme d'IEN invalide. ATTENTION — le contrôle porte sur la FORME uniquement : aucune
            vérification d'authenticité auprès du SIMEN n'est possible à ce jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /state-integration/students/{studentId}/mutation-certificate:
    post:
      tags: [StateIntegration]
      summary: Délivre le certificat de mutation (PDF avec QR de vérification)
      description: >
        POST bien qu'il renvoie un PDF&#58; il ÉCRIT (numéro officiel séquentiel, ligne en base, code de
        vérification), et deux appels produisent deux certificats distincts (Volume 1 §23.5).


        Un solde impayé N'EMPÊCHE JAMAIS la délivrance — refuser un certificat à un élève débiteur
        reviendrait à le retenir de force dans l'établissement. Le PDF porte une MENTION de situation
        financière, jamais un montant.
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schoolYearId, reason]
              properties:
                schoolYearId: { type: string, format: uuid }
                reason:
                  type: string
                  enum: [Demenagement, ChangementEtablissement, RaisonFamiliale, RaisonMedicale, Autre]
                reasonDetails:
                  type: string
                  maxLength: 300
                  description: Obligatoire lorsque `reason = Autre`.
                destinationSchoolName: { type: string, maxLength: 150, nullable: true }
                destinationCity: { type: string, maxLength: 100, nullable: true }
      responses:
        '200':
          description: Le certificat en PDF.
          headers:
            X-Certificate-Number:
              description: Numéro officiel délivré (ex. MUT-2026-0007).
              schema: { type: string }
            X-Financially-Clear:
              description: L'élève était-il à jour au jour de la délivrance. Ne bloque jamais.
              schema: { type: string, enum: ['true', 'false'] }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Élève, année scolaire, ou inscription active sur cette année, introuvable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /state-integration/certificates:
    get:
      tags: [StateIntegration]
      summary: Registre des certificats de mutation délivrés
      description: >
        Du plus récent au plus ancien. Les certificats RÉVOQUÉS restent dans la liste, marqués — une
        pièce révoquée doit rester traçable. `studentId` restreint à un élève (fiche élève).
      parameters:
        - name: studentId
          in: query
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/PageNumber' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Page du registre.
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCount: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        certificateNumber: { type: string }
                        studentId: { type: string, format: uuid }
                        studentFullName: { type: string }
                        studentMatricule: { type: string }
                        schoolYearLabel: { type: string }
                        classroomNameSnapshot: { type: string }
                        reason:
                          type: string
                          enum: [Demenagement, ChangementEtablissement, RaisonFamiliale, RaisonMedicale, Autre]
                        destinationSchoolName: { type: string, nullable: true }
                        destinationCity: { type: string, nullable: true }
                        wasFinanciallyClear: { type: boolean }
                        issuedOn: { type: string, format: date }
                        revokedAt: { type: string, format: date-time, nullable: true }
                        revocationReason: { type: string, nullable: true }
                        isRevoked: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }

  /state-integration/certificates/{id}/revoke:
    post:
      tags: [StateIntegration]
      summary: Révoquer un certificat de mutation
      description: >
        La révocation est le SEUL moyen de corriger une pièce délivrée : un certificat n'est jamais
        modifié (Volume 1 §23.5). Effet immédiat sur le point de vérification publique. Motif
        obligatoire. La ligne reste en base — aucune suppression physique (règle #6).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        '204': { description: Certificat révoqué. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Le certificat est déjà révoqué.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /state-integration/certificates/verify/{token}:
    get:
      tags: [StateIntegration]
      summary: Vérification PUBLIQUE d'un certificat de mutation (scan du QR)
      description: >
        ANONYME (`security: []`) — c'est l'école d'accueil, extérieure à la plateforme, qui scanne le
        QR imprimé sur le certificat (Volume 1 §23.5).


        La réponse ne porte AUCUNE donnée de l'élève : seulement de quoi rapprocher le PAPIER présenté
        (statut, numéro, date, établissement émetteur). Un `token` inconnu répond `unknown` avec un
        HTTP 200 — jamais un 404 : distinguer les deux permettrait de sonder les numéros voisins.


        Rate-limité par IP (même politique que l'annuaire public).
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: Le code de vérification encodé dans le QR (32 caractères hexadécimaux d'aléa).
          schema: { type: string }
      responses:
        '200':
          description: >
            Résultat de la vérification. `status` vaut `valid`, `revoked` ou `unknown`. Pour `unknown`,
            tous les autres champs sont nuls.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [valid, revoked, unknown] }
                  certificateNumber: { type: string, nullable: true }
                  issuedOn: { type: string, format: date, nullable: true }
                  issuingSchoolName: { type: string, nullable: true }
                  revokedAt: { type: string, format: date-time, nullable: true }
        '429': { $ref: '#/components/responses/RateLimited' }

  /state-integration/students/{studentId}/skills-booklet:
    get:
      tags: [StateIntegration]
      summary: Livret de compétences de l'élève (PDF APC, multi-pages)
      description: >
        Document APC pluri-trimestres remis avec le certificat lors d'une mutation (Volume 1 §23.6).
        La grille vient de la même configuration d'école que le bulletin APC. Une case vide signifie
        « compétence non évaluée sur cette période », jamais « non acquis ».
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: schoolYearId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Le livret en PDF (peut compter plusieurs pages).
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Le niveau de la classe n'a pas de grille de compétences configurée : le livret ne
            s'applique qu'à l'approche par compétences. Utilisez le bulletin de notes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Authentification par email/mot de passe
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Connexion réussie
          headers:
            Set-Cookie:
              description: >-
                Refresh token, `HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth`.
                Seul canal par lequel ce jeton est délivré.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renouvellement du token d'accès
      description: >-
        Sans corps de requête : le refresh token est lu dans le cookie `sama_ecole_refresh_token`,
        que le navigateur joint automatiquement. Le jeton présenté est révoqué et remplacé
        (rotation) ; un jeton déjà consommé qui serait rejoué révoque TOUTE la famille de jetons de
        l'utilisateur. Le client doit donc sérialiser ses renouvellements concurrents.
      security: []
      responses:
        '200':
          description: Nouveaux jetons — le cookie de refresh est remplacé
          headers:
            Set-Cookie:
              description: Nouveau refresh token (l'ancien est révoqué).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401':
          description: Cookie absent, expiré, révoqué ou rejoué — le cookie est purgé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Révocation des refresh tokens de l'utilisateur courant
      description: >-
        Révoque TOUS les refresh tokens actifs de l'utilisateur (identifié par son JWT) et purge le
        cookie. L'access token déjà émis reste valide jusqu'à son expiration : l'API est sans état.
      responses:
        '204': { description: Déconnecté — le cookie de refresh est purgé }

  /users:
    get:
      tags: [Users]
      summary: Lister les utilisateurs de l'établissement courant (Directeur uniquement)
      description: >-
        Liste PLATE, non paginée : le personnel d'un établissement se compte en dizaines, pas en
        milliers (à la différence de /students). L'école vient du JWT, jamais d'un paramètre.
      responses:
        '200':
          description: Comptes de l'établissement courant
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }
    post:
      tags: [Users]
      summary: Créer un compte Secrétariat/Finance/Enseignant/Surveillant (Directeur uniquement)
      description: >-
        Quatre rôles assignables, alignés sur CreateUserCommandValidator.AssignableRoles :
        Secretariat, Finance, Enseignant et Surveillant. Ce dernier manquait à ce résumé alors que le
        serveur l'accepte et que l'écran Utilisateurs le propose — tout le module Surveillance
        (appel en classe, billets d'entrée, discipline, convocations) repose pourtant sur lui.
        SuperAdmin et Directeur sont volontairement exclus : SuperAdmin est un rôle plateforme hors
        du contrôle d'une école, Directeur ne se crée que via POST /schools (JGK-B01). Le mot de
        passe est saisi DIRECTEMENT par le Directeur, jamais généré ni envoyé par e-mail
        (l'adaptateur SMTP réel relève de JGK-G03, hors périmètre MVP).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '201': { description: Créé, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '403': { description: Rôle appelant non autorisé, ou rôle demandé non assignable }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{userId}/password:
    patch:
      tags: [Users]
      summary: Réinitialiser le mot de passe d'un compte (Directeur uniquement)
      description: >-
        Toutes les sessions actives du compte sont révoquées (même raisonnement que le blocage,
        JGK-A05) : un mot de passe qu'on vient de changer ne doit pas laisser une session ouverte
        utilisable sous l'ancien. Un Directeur ne peut pas réinitialiser son propre mot de passe par
        cette voie.
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword: { type: string, format: password }
      responses:
        '200': { description: Mot de passe réinitialisé, sessions révoquées }
        '403': { description: Rôle appelant non autorisé, ou cible = l'acteur lui-même }
        '404': { description: Utilisateur introuvable dans l'établissement courant }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{userId}/status:
    patch:
      tags: [Users]
      summary: Suspendre / bloquer / réactiver un utilisateur
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { type: string, enum: [Active, Suspended, Blocked] }
                reason: { type: string }
      responses:
        '200': { description: Statut mis à jour }

  /audit-logs:
    get:
      tags: [AuditLogs]
      summary: Journal d'audit de l'établissement courant (Directeur uniquement)
      description: >-
        Ticket JGK-H01. Lecture seule, paginée : les entrées sont écrites automatiquement par
        AuditLoggingBehavior (paiements, changements de statut/mot de passe/création de compte
        utilisateur, impressions de reçus), jamais par un appel client direct — append-only imposé
        jusqu'au niveau des GRANT PostgreSQL (SELECT, INSERT uniquement).

        Scope actuel : ne couvre pas encore la connexion (JGK-A04) ni les actions Super Admin (ex.
        création d'établissement) — l'acteur n'a alors aucun SchoolId propre, ce qui exigerait sa
        propre fonction SECURITY DEFINER (comme provision_school_director, JGK-B01).
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: module
          in: query
          description: Filtre sur le domaine fonctionnel (ex. "Finance", "Users").
          schema: { type: string }
        - name: success
          in: query
          description: true = succès uniquement, false = échecs uniquement, absent = tous.
          schema: { type: boolean }
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedAuditLogs' }
        '403': { description: Rôle appelant non autorisé (réservé au Directeur) }

  /admin/platform/dashboard:
    get:
      tags: [Platform]
      summary: Agrégats plateforme, toutes écoles confondues (Super Admin uniquement)
      description: >-
        Le Super Admin n'a aucun SchoolId propre : une requête EF Core normale sur les tables tenant
        (schools/users/subscriptions/subscription_payments) ne renverrait donc rien (RLS, AGENTS.md
        règle #2). Lit la vue PostgreSQL `v_platform_dashboard_stats` (migration
        AddPlatformAdminViews), qui contourne l'isolation via `security_invoker = false` +
        OWNER sama_ecole — jamais en affaiblissant les policies existantes.
      responses:
        '200':
          description: Agrégats plateforme
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformDashboardStats' }
        '403': { description: Rôle appelant non autorisé (réservé au Super Admin) }

  /admin/platform/activity:
    get:
      tags: [Platform]
      summary: Journal d'audit de toutes les écoles, paginé (Super Admin uniquement)
      description: >-
        Même principe que /admin/platform/dashboard, mais pour `audit_logs` : appelle la fonction
        PostgreSQL SECURITY DEFINER `get_global_audit_logs(limit, offset)` (migration
        AddPlatformAdminViews), qui contourne la RLS pour ce seul rôle de façon auditée et volontaire.
        `audit_logs` reste par ailleurs une table tenant normale (RLS + Global Query Filter) pour
        tous les autres appelants.
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedGlobalAuditLogs' }
        '403': { description: Rôle appelant non autorisé (réservé au Super Admin) }

  /admin/platform/subscriptions:
    get:
      tags: [Platform]
      summary: Abonnements de toutes les écoles, avec dernier paiement confirmé (Super Admin uniquement)
      description: >-
        Même principe que /admin/platform/dashboard : lit la vue PostgreSQL `v_platform_subscriptions`
        (migration AddPlatformSubscriptionsAndImpersonation), qui contourne la RLS de
        `subscriptions`/`subscription_payments` via `security_invoker = false` + OWNER sama_ecole.
        Liste complète, non paginée (nombre d'écoles modeste), filtrage/recherche côté client comme
        GET /schools.
      responses:
        '200':
          description: Liste des abonnements
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PlatformSubscription' } }
        '403': { description: Rôle appelant non autorisé (réservé au Super Admin) }

  /admin/platform/revenue-projection:
    get:
      tags: [Platform]
      summary: Projection de revenu sur 12 mois, basée sur les échéances réelles (Super Admin uniquement)
      description: >-
        Alimente le graphique de projection de l'Executive Dashboard. Pour chaque école à
        l'abonnement Active, projette ses échéances de renouvellement futures (ExpiresAt, puis +N
        fois la période de facturation de son dernier paiement confirmé) sur les 12 prochains mois et
        cumule le montant attendu par mois. Contrairement au MRR (équivalent mensuel lissé), reflète
        le cash réellement attendu mois par mois — un abonnement Yearly n'apparaît qu'au(x) mois de
        son échéance. Aucune hypothèse de croissance (nouvelles écoles) : voir le Simulateur de
        Croissance, purement côté client (ARPU × nombre d'écoles cible), pour ce scénario.
      responses:
        '200':
          description: 12 points mensuels, du mois courant inclus aux 11 mois suivants
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MonthlyRevenueProjection' } }
        '403': { description: Rôle appelant non autorisé (réservé au Super Admin) }

  /admin/platform/subscriptions/{schoolId}/remind:
    post:
      tags: [Platform]
      summary: Envoyer un rappel de paiement au Directeur de l'établissement (Super Admin uniquement)
      description: >-
        Bouton « Relancer » de l'écran Abonnements & Facturation. N'écrit AUCUN paiement ni statut
        d'abonnement (AGENTS.md règle #11) : envoie un e-mail de rappel au Directeur actif de
        l'établissement, retrouvé via la fonction SECURITY DEFINER
        `auth_find_active_director_by_school`. Écrit une entrée d'audit sur l'école ciblée.
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Rappel envoyé }
        '403': { description: Rôle appelant non autorisé (réservé au Super Admin) }
        '404': { description: Établissement introuvable }
        '409': { description: Aucun compte Directeur actif pour cet établissement }

  /admin/platform/schools/{schoolId}/impersonate:
    post:
      tags: [Platform]
      summary: Ouvrir une session Directeur pour l'établissement ciblé (Super Admin uniquement)
      description: >-
        Bouton « Infiltrer » de l'écran Établissements. Émet un jeton de MÊME format qu'un jeton
        normal (sub/schoolId/role, AGENTS.md règle #10), portant l'identité du Directeur actif de
        l'établissement ciblé, avec un claim `impersonatedBy` supplémentaire traçant l'acteur réel.
        AUCUN refresh token n'accompagne ce jeton : la session expire pour de bon avec l'access token
        (~15 min) et ne se renouvelle jamais — sortir plus tôt échange le cookie de refresh du Super
        Admin (resté intact) contre ses propres jetons. Écrit une entrée d'audit OBLIGATOIRE sur
        l'école ciblée avant de renvoyer le jeton.
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Jeton d'impersonation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImpersonateSchoolResult' }
        '403': { description: Rôle appelant non autorisé (réservé au Super Admin) }
        '404': { description: Établissement introuvable }
        '409': { description: Aucun compte Directeur actif pour cet établissement }

  /admin/platform/schools/{schoolId}/complimentary-access:
    post:
      tags: [Platform]
      summary: Offrir un accès gratuit/complémentaire à un établissement (Super Admin uniquement)
      description: >-
        Aucun paiement : AGENTS.md règle #11 ne s'applique pas ici, ce n'est pas une confirmation
        d'encaissement. Écrit directement l'abonnement via la fonction SECURITY DEFINER
        `grant_complimentary_subscription` (le Super Admin n'a pas de SchoolId propre pour une écriture
        EF normale sur une table RLS). `durationMonths` entre 1 et 60.
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantComplimentaryAccessRequest' }
      responses:
        '204': { description: Accès complémentaire accordé }
        '403': { description: Rôle appelant non autorisé (réservé au Super Admin) }
        '404': { description: Aucun abonnement associé à cet établissement }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/platform/schools/{schoolId}/sms-credits:
    post:
      tags: [Platform]
      summary: Créditer le solde SMS d'un établissement (Super Admin uniquement)
      description: >-
        Incrément atomique de `SchoolSettings.SmsCreditBalance` (en segments), hors RLS via
        `IgnoreQueryFilters` — le Super Admin n'a pas de tenant. `segments` entre 1 et 1 000 000.
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TopUpSmsCreditsRequest' }
      responses:
        '200':
          description: Nouveau solde
          content:
            application/json:
              schema:
                type: object
                properties:
                  creditBalance: { type: integer }
        '403': { description: Rôle appelant non autorisé (réservé au Super Admin) }
        '404': { description: Aucun paramétrage trouvé pour cet établissement }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/platform/users/{userId}/schools:
    post:
      tags: [Platform]
      summary: Rattacher un utilisateur à un établissement supplémentaire (Super Admin uniquement)
      description: Idempotent — rattacher un établissement déjà associé répond 204 sans rien modifier.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachSchoolRequest' }
      responses:
        '204': { description: Établissement rattaché }
        '403': { description: Rôle appelant non autorisé (réservé au Super Admin) }
        '404': { description: Utilisateur ou établissement introuvable }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/promo-codes:
    get:
      tags: [Platform]
      summary: Lister les codes promo (Super Admin uniquement)
      responses:
        '200':
          description: Liste des codes promo
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PromoCode' } }
        '403': { description: Rôle appelant non autorisé (réservé au Super Admin) }
    post:
      tags: [Platform]
      summary: Créer un code promo (Super Admin uniquement)
      description: >-
        `code` est normalisé en MAJUSCULES et doit être unique (409 sinon, contrainte base). Selon
        `discountType` : Percentage (0,01-100 %) ou FixedAmount (> 0) réduisent le montant à payer ;
        FreeTrialMonths ou FullDiscount activent l'abonnement SANS AUCUN paiement — `durationMonths`
        devient alors obligatoire.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromoCodeCreateRequest' }
      responses:
        '201':
          description: Code promo créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromoCodeCreateResult' }
        '403': { description: Rôle appelant non autorisé (réservé au Super Admin) }
        '409': { description: Ce code existe déjà }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/promo-codes/{id}/deactivate:
    post:
      tags: [Platform]
      summary: Désactiver un code promo (Super Admin uniquement)
      description: >-
        Bascule `isActive` à faux (AGENTS.md règle #6 — jamais de suppression physique).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Code promo désactivé }
        '403': { description: Rôle appelant non autorisé (réservé au Super Admin) }
        '404': { description: Code promo introuvable }

  /schools:
    get:
      tags: [Schools]
      summary: Lister les établissements (Super Admin uniquement)
      responses:
        '200': { description: Liste des établissements }
    post:
      tags: [Schools]
      summary: Créer un nouvel établissement (Super Admin uniquement)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchoolCreateRequest' }
      responses:
        '201': { description: Établissement créé }

  /schools/{schoolId}/status:
    patch:
      tags: [Schools]
      summary: Suspendre / bloquer / réactiver un établissement (Super Admin uniquement)
      description: >-
        Toute valeur autre qu'Active révoque IMMÉDIATEMENT les refresh tokens de tous les
        utilisateurs de l'établissement (fonction SECURITY DEFINER `revoke_refresh_tokens_by_school`) ;
        réactiver n'en révoque aucun. `reason` obligatoire (5 à 500 caractères), historisé (entrée
        d'audit `Schools`/`ChangeStatus:{ancien}->{nouveau} ({reason})`, attribuée à l'établissement
        ciblé). Une transition vers le statut déjà en cours répond 422 (pas d'effet de bord silencieux).
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeSchoolStatusRequest' }
      responses:
        '200':
          description: Statut mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeSchoolStatusResult' }
        '403': { description: Rôle appelant non autorisé (réservé au Super Admin) }
        '404': { description: Établissement introuvable }
        '422': { $ref: '#/components/responses/ValidationError' }

  /schools/current:
    get:
      tags: [Schools]
      summary: Identité de l'établissement courant (nom, coordonnées, logo)
      description: >-
        L'établissement est déduit du JWT (jamais un paramètre). Lecture ouverte à tous les rôles —
        le nom et les coordonnées figurent sur le reçu et les écrans. À distinguer de POST /schools
        (création par le Super Admin).
      responses:
        '200':
          description: Fiche de l'établissement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolProfile' }
    put:
      tags: [Schools]
      summary: Mettre à jour l'identité de l'établissement (Directeur uniquement)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchoolProfile' }
      responses:
        '200':
          description: Fiche mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolProfile' }
        '403': { description: Rôle non autorisé (écriture réservée au Directeur) }
        '422': { description: Données invalides (nom manquant, URL de logo invalide…) }

  /schools/current/reset-data:
    post:
      tags: [Schools]
      summary: Réinitialiser les données de l'établissement (Directeur uniquement)
      description: >-
        « Zone de danger » de l'écran Paramètres — remet l'établissement à neuf après une phase
        d'essai. Efface DÉFINITIVEMENT (seule exception du produit à la suppression logique) les
        élèves, inscriptions, notes, appréciations de bulletin, appels, sanctions, convocations, SMS,
        paiements, sessions de caisse, décaissements et compteurs de matricules de l'établissement
        déduit du JWT — jamais d'un identifiant fourni par l'appelant. Sont CONSERVÉS les comptes
        utilisateurs, la fiche et les réglages de l'école, les années scolaires et trimestres, les
        classes, matières, mentions, enseignants, le barème des frais et le journal d'audit.
        `confirmation` doit valoir exactement `PURGER` (casse comprise) ou le nom de l'établissement
        (casse indifférente) ; toute autre valeur est refusée en 422 sans rien effacer.
        Indisponible en **mode réel** (voir `POST /schools/current/go-live`) — refusé en 409
        `RESET_UNAVAILABLE_LIVE_MODE`, mais un retour en mode test (`POST
        /schools/current/revert-to-test`) la rouvre. Indisponible DE FAÇON DÉFINITIVE si
        l'établissement a été verrouillé (`POST /schools/current/lock-production`) — refusé en 409
        `RESET_UNAVAILABLE_PRODUCTION_LOCKED`, quel que soit le mode. Les deux gardes sont vérifiées
        avant même de regarder `confirmation`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  description: "`PURGER` ou le nom exact de l'établissement."
                  example: PURGER
      responses:
        '200':
          description: Établissement réinitialisé — compte rendu de ce qui a été effacé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolDataResetSummary' }
        '403': { description: Réservé au Directeur }
        '409':
          description: >-
            Réinitialisation indisponible — code `RESET_UNAVAILABLE_LIVE_MODE` (mode réel, réversible)
            ou `RESET_UNAVAILABLE_PRODUCTION_LOCKED` (verrouillage définitif, irréversible)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /schools/current/mode:
    get:
      tags: [Schools]
      summary: État « bac à sable / mode réel » de l'établissement courant
      description: >-
        Lecture LÉGÈRE, ouverte à tout rôle de l'école. Alimente la pastille « Mode test » de la
        barre supérieure et les régimes de la « Zone de danger » de l'écran Paramètres. Mode
        (isLive/wentLiveAt) et verrouillage définitif (isProductionLocked/productionLockedAt) sont
        deux dimensions INDÉPENDANTES depuis le 19/09/2026.
      responses:
        '200':
          description: État courant
          content:
            application/json:
              schema:
                type: object
                required: [isLive, isProductionLocked]
                properties:
                  isLive: { type: boolean }
                  wentLiveAt: { type: string, format: date-time, nullable: true }
                  isProductionLocked:
                    type: boolean
                    description: >-
                      Verrou PERMANENT, posé UNIQUEMENT par `POST /schools/current/lock-production`
                      (jamais par le passage en mode réel). L'écran s'en sert pour ne jamais proposer
                      « Réinitialiser l'école » dans ce cas — la purge serait de toute façon refusée
                      (409 RESET_UNAVAILABLE_PRODUCTION_LOCKED).
                  productionLockedAt: { type: string, format: date-time, nullable: true }

  /schools/current/go-live:
    post:
      tags: [Schools]
      summary: Passer l'établissement en mode réel (Directeur uniquement)
      description: >-
        Bascule DÉLIBÉRÉE et PLEINEMENT RÉVERSIBLE du mode test (bac à sable) vers le mode réel
        (exploitation). Jamais un effet de bord d'une autre opération, et depuis le 19/09/2026 elle ne
        pose plus aucun verrou permanent. Conséquence, UNIQUEMENT le temps du mode réel : `POST
        /schools/current/reset-data` devient indisponible (409 `RESET_UNAVAILABLE_LIVE_MODE`) — un
        retour en mode test (`POST /schools/current/revert-to-test`, disponible à tout moment) la
        rouvre, sauf verrouillage définitif (`POST /schools/current/lock-production`). Non rejouable
        tel quel : un second appel renvoie 409 `ALREADY_LIVE`. `confirmation` doit valoir exactement
        `CONFIRMER` (casse comprise) ou le nom de l'établissement (casse indifférente).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  description: "`CONFIRMER` ou le nom exact de l'établissement."
                  example: CONFIRMER
      responses:
        '200':
          description: Établissement passé en mode réel
          content:
            application/json:
              schema:
                type: object
                required: [wentLiveAt]
                properties:
                  wentLiveAt: { type: string, format: date-time }
        '403': { description: Réservé au Directeur }
        '409':
          description: Déjà en mode réel — code `ALREADY_LIVE`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /schools/current/revert-to-test:
    post:
      tags: [Schools]
      summary: Repasser l'établissement en mode test (Directeur uniquement)
      description: >-
        Bascule DÉLIBÉRÉE du mode réel vers le mode test, disponible À TOUT MOMENT (aucun drapeau
        d'environnement) pour que le Directeur garde le contrôle de son environnement. Rouvre `POST
        /schools/current/reset-data`, sauf verrouillage définitif : ne touche JAMAIS à
        `School.IsProductionLocked` (posé uniquement par `POST /schools/current/lock-production`).
        Seul `wentLiveAt` (l'horodatage COURANT) est effacé, ce qui permet de rejouer `POST
        /schools/current/go-live`. `confirmation` doit valoir exactement `TEST` (casse comprise) ou
        le nom de l'établissement (casse indifférente).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  description: "`TEST` ou le nom exact de l'établissement."
                  example: TEST
      responses:
        '200':
          description: Établissement repassé en mode test
          content:
            application/json:
              schema:
                type: object
                required: [wasLive]
                properties:
                  wasLive:
                    type: boolean
                    description: Vrai si l'établissement était effectivement en mode réel avant l'appel.
        '403': { description: Réservé au Directeur }
        '422': { $ref: '#/components/responses/ValidationError' }

  /schools/current/lock-production:
    post:
      tags: [Schools]
      summary: Verrouiller définitivement la purge de l'établissement (Directeur uniquement)
      description: >-
        Action EXPLICITE et distincte de `POST /schools/current/go-live` : verrouille DE FAÇON
        DÉFINITIVE `POST /schools/current/reset-data` (`School.IsProductionLocked`), quel que soit le
        régime test/réel ultérieur. Non rejouable en sens inverse : aucune route ne remet ce verrou à
        faux. `confirmation` doit valoir exactement `VERROUILLER` (casse comprise) ou le nom de
        l'établissement (casse indifférente).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  description: "`VERROUILLER` ou le nom exact de l'établissement."
                  example: VERROUILLER
      responses:
        '200':
          description: Établissement verrouillé définitivement
          content:
            application/json:
              schema:
                type: object
                required: [lockedAt]
                properties:
                  lockedAt: { type: string, format: date-time }
        '403': { description: Réservé au Directeur }
        '409':
          description: Déjà verrouillé — code `ALREADY_LOCKED`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /schools/current/settings:
    get:
      tags: [Schools]
      summary: Paramètres de l'établissement courant
      responses:
        '200':
          description: Paramètres
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolSettings' }
    put:
      tags: [Schools]
      summary: Mettre à jour les paramètres (Directeur uniquement)
      description: >-
        `smsCreditBalance` est en lecture seule (absent du corps envoyé) : il ne se crédite que via
        POST /admin/platform/schools/{schoolId}/sms-credits (Super Admin). Les champs `*SignatureUrl`/
        `officialStampUrl` (dont `surveillantSignatureUrl`) sont de simples URL — le fichier transite
        par les endpoints de téléversement dédiés (POST .../director-signature, etc.).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchoolSettings' }
      responses:
        '200':
          description: Paramètres mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolSettings' }
        '403': { description: Réservé au Directeur }
        '422': { $ref: '#/components/responses/ValidationError' }

  /schools/current/settings/director-signature:
    post:
      tags: [Schools]
      summary: Téléverser la signature du Directeur (Directeur uniquement)
      description: >-
        multipart/form-data, champ `file` — image/png, image/jpeg ou image/webp, 2 Mio maximum.
        Renvoie l'URL relative à reporter ensuite dans `directorSignatureUrl` via
        PUT /schools/current/settings (flux en deux temps : téléverser, puis enregistrer l'URL). Même
        contrat pour secretary-signature, cashier-signature, surveillant-signature et official-stamp
        (préfixe de fichier différent seulement).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Fichier enregistré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignatureUploadResult' }
        '400':
          description: "Fichier manquant, trop volumineux (> 2 Mio) ou format non supporté"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, enum: [FILE_MISSING, FILE_TOO_LARGE, INVALID_FILE_FORMAT] }
                  message: { type: string }
        '403': { description: Réservé au Directeur }

  /schools/current/settings/secretary-signature:
    post:
      tags: [Schools]
      summary: Téléverser la signature du Secrétariat (Directeur uniquement)
      description: Même contrat que POST /schools/current/settings/director-signature.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Fichier enregistré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignatureUploadResult' }
        '400': { description: "Fichier manquant, trop volumineux (> 2 Mio) ou format non supporté" }
        '403': { description: Réservé au Directeur }

  /schools/current/settings/cashier-signature:
    post:
      tags: [Schools]
      summary: Téléverser la signature de la Caisse (Directeur uniquement)
      description: Même contrat que POST /schools/current/settings/director-signature.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Fichier enregistré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignatureUploadResult' }
        '400': { description: "Fichier manquant, trop volumineux (> 2 Mio) ou format non supporté" }
        '403': { description: Réservé au Directeur }

  /schools/current/settings/surveillant-signature:
    post:
      tags: [Schools]
      summary: Téléverser la signature du Surveillant Général (Directeur uniquement)
      description: >-
        Même contrat que POST /schools/current/settings/director-signature. L'URL renvoyée alimente
        `surveillantSignatureUrl`, injectée sur les billets d'entrée/sortie et les fiches de discipline
        (Vie Scolaire).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Fichier enregistré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignatureUploadResult' }
        '400': { description: "Fichier manquant, trop volumineux (> 2 Mio) ou format non supporté" }
        '403': { description: Réservé au Directeur }

  /schools/current/settings/official-stamp:
    post:
      tags: [Schools]
      summary: Téléverser le cachet officiel de l'établissement (Directeur uniquement)
      description: Même contrat que POST /schools/current/settings/director-signature.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Fichier enregistré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignatureUploadResult' }
        '400': { description: "Fichier manquant, trop volumineux (> 2 Mio) ou format non supporté" }
        '403': { description: Réservé au Directeur }

  /school-years:
    get:
      tags: [SchoolYears]
      summary: Lister les années scolaires de l'établissement courant
      description: >-
        L'établissement est déduit du JWT : il n'est jamais un paramètre. Lecture ouverte à tous les
        rôles — l'année active est le contexte de travail de tous les écrans. `isClosed` est calculé
        à la lecture : une année terminée est en lecture seule.
      responses:
        '200':
          description: Liste des années scolaires, la plus récente d'abord
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SchoolYear' }
    post:
      tags: [SchoolYears]
      summary: Créer une nouvelle année scolaire (Directeur)
      description: >-
        Créer une année ne fait PAS basculer l'établissement dessus : elle est créée inactive, et le
        basculement passe par `/school-years/{id}/activate`. Seule exception, la première année d'une
        école devient active d'office — sans année active, rien n'est inscriptible. Une année déjà
        terminée n'est jamais activée automatiquement.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchoolYearCreateRequest' }
      responses:
        '201':
          description: Année scolaire créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolYear' }
        '403': { description: Réservé au Directeur }
        '409':
          description: Une année de ce libellé existe déjà dans cet établissement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /school-years/{id}:
    delete:
      tags: [SchoolYears]
      summary: Supprimer une année scolaire (Directeur, libellé exact à recopier)
      description: >-
        DEUX RÉGIMES, selon le mode de l'établissement.

        MODE TEST (bac à sable) : l'année et TOUT ce qu'elle porte — inscriptions, paiements, notes,
        appréciations, appels, affectations, examens, certificats de mutation, trimestres — sont
        effacés définitivement, lignes en suppression logique comprises. Les ÉLÈVES survivent : ils
        appartiennent à l'établissement, pas à un exercice.

        MODE RÉEL : l'année n'est retirée que si elle ne porte AUCUNE donnée (cas réel : une année
        créée par erreur ou préparée puis abandonnée) ; elle est alors ARCHIVÉE, en suppression
        logique, avec ses trimestres et ses affectations. Dès qu'une inscription, une note ou une
        fiche d'appel y est rattachée, la suppression est refusée en 409 `SCHOOL_YEAR_HAS_DATA` :
        ces écritures sont la contrepartie de reçus déjà remis aux familles (AGENTS.md règle #6).
        L'export ZIP (`GET /school-years/{id}/export`) reste la voie d'archivage hors plateforme.

        Le corps porte le LIBELLÉ EXACT de l'année (« 2025-2026 »), et non un mot-clé générique :
        recopier le libellé oblige à regarder la ligne qu'on supprime. Si l'année supprimée était
        l'année ACTIVE, l'établissement rebascule sur l'année ouverte la plus proche (la précédente
        d'abord, la suivante à défaut) ; jamais sur une année terminée. Quand il n'en reste aucune,
        `requiresActiveYearSelection` vaut true et le Directeur doit en activer ou en créer une.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  maxLength: 20
                  description: Libellé exact de l'année à supprimer, ex. « 2025-2026 ».
                  example: '2025-2026'
      responses:
        '200':
          description: Année supprimée (mode test) ou archivée (mode réel)
          content:
            application/json:
              schema:
                type: object
                properties:
                  label: { type: string, example: '2025-2026' }
                  wasActive:
                    type: boolean
                    description: L'établissement travaillait sur cette année.
                  wasPurged:
                    type: boolean
                    description: true en mode test (effacement définitif), false en mode réel (archivage).
                  newActiveYear:
                    allOf: [{ $ref: '#/components/schemas/SchoolYear' }]
                    nullable: true
                    description: Année sur laquelle l'établissement a rebasculé, le cas échéant.
                  requiresActiveYearSelection:
                    type: boolean
                    description: >-
                      true quand l'établissement se retrouve sans année active : aucune année ouverte
                      ne restait. Aucune inscription ni note ne peut être saisie tant qu'il en manque une.
                  summary:
                    type: object
                    nullable: true
                    description: Détail de ce qui a été effacé (mode test uniquement).
                    properties:
                      totalRowsDeleted: { type: integer, example: 143 }
                      entries:
                        type: array
                        items:
                          type: object
                          properties:
                            label: { type: string, example: Inscriptions }
                            rowsDeleted: { type: integer, example: 42 }
        '403': { description: Réservé au Directeur }
        '404': { description: Année scolaire introuvable dans cet établissement }
        '409':
          description: >-
            `SCHOOL_YEAR_HAS_DATA` — en mode réel, l'année porte des données et ne peut pas être
            supprimée. Le message énumère ce qui bloque.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Confirmation absente ou différente du libellé exact de l'année.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /school-years/{id}/activate:
    post:
      tags: [SchoolYears]
      summary: Faire de cette année l'année active (Directeur, double confirmation)
      description: >-
        Une seule année est active à la fois : l'année active précédente est désactivée dans la même
        transaction, et l'unicité est garantie par un index PostgreSQL, pas seulement par
        l'application. Une année TERMINÉE ne peut pas être activée (les années passées sont en
        lecture seule) ; une année à venir, si. Le mot de passe du Directeur est redemandé
        (Volume_7_Security §16 — « changement de l'année scolaire active »).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  description: Mot de passe du Directeur connecté — confirmation de l'opération.
      responses:
        '200':
          description: Année scolaire activée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolYear' }
        '403': { description: Réservé au Directeur }
        '404': { description: Année scolaire introuvable dans cet établissement }
        '422':
          description: >-
            Mot de passe de confirmation incorrect, ou année terminée (lecture seule).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /school-years/{id}/apply-evaluation-periods:
    post:
      tags: [SchoolYears]
      summary: Rejouer sur cette année le découpage en périodes choisi dans les réglages (Directeur)
      description: >-
        Remplace les périodes de l'année par celles du réglage courant `evaluationPeriodType` (voir
        SchoolSettings) : trimestres, semestres ou périodes personnalisées. Les anciennes périodes sont
        archivées (suppression logique), jamais effacées. Refusé (422) dès qu'UNE note ou UNE appréciation
        de bulletin est rattachée à l'une des périodes de l'année — blocage strict — et sur une année
        terminée. Idempotent : un découpage déjà conforme ne change rien.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Les périodes de l'année après application, dans l'ordre
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Term' }
        '403': { description: Réservé au Directeur }
        '404': { description: Année scolaire introuvable dans cet établissement }
        '422':
          description: >-
            Année terminée (lecture seule), ou notes / appréciations de bulletin déjà saisies sur l'année.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /school-years/{id}/export:
    get:
      tags: [SchoolYears]
      summary: Exporter les données d'une année scolaire en archive ZIP (Directeur)
      description: >-
        Archive ZIP contenant trois CSV — `eleves.csv`, `paiements.csv`, `classes.csv` — construits à
        partir des inscriptions NON annulées de cette année scolaire précise (une inscription annulée
        n'a jamais existé pour l'archive). Réservé au Directeur : l'export croise des données
        personnelles (élèves) et financières (paiements) sur l'ensemble de l'établissement, un
        périmètre plus large que celui d'un seul rôle métier. Disponible pour toute année, pas
        seulement les années terminées. Chaque export est journalisé dans les journaux d'audit.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Archive ZIP (Content-Type application/zip)
          content:
            application/zip:
              schema: { type: string, format: binary }
        '403': { description: Réservé au Directeur }
        '404': { description: Année scolaire introuvable dans cet établissement }

  /school-years/{id}/terms:
    get:
      tags: [SchoolYears]
      summary: Lister les périodes d'évaluation d'une année scolaire (générées automatiquement)
      description: >-
        Les périodes sont générées automatiquement à la création de l'année scolaire selon le réglage
        `evaluationPeriodType` de l'école — trois trimestres par défaut, deux semestres, ou 2 à 6 périodes
        personnalisées —, leurs dates divisant la période en tranches consécutives à parts égales.
        Aucun endpoint ne les crée directement (voir `POST /school-years/{id}/apply-evaluation-periods`
        pour rejouer un découpage). Lecture ouverte à tous les rôles : l'écran de saisie de notes en a besoin.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Les trimestres de cette année, dans l'ordre
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Term' }

  /classrooms:
    get:
      tags: [Classrooms]
      summary: Lister les classes de l'établissement courant
      description: >-
        L'établissement est déduit du JWT : il n'est jamais un paramètre. `studentCount` est
        calculé côté base.
      responses:
        '200':
          description: Liste des classes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Classroom' }
    post:
      tags: [Classrooms]
      summary: Créer une classe (nomenclature libre, sans liste figée)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassroomCreateRequest' }
      responses:
        '201':
          description: Classe créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Classroom' }
        '409':
          description: Une classe de ce nom existe déjà dans cet établissement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /classrooms/{id}:
    put:
      tags: [Classrooms]
      summary: Corriger le libellé/niveau/capacité d'une classe déjà créée
      description: 'Réservé au Directeur et au Secrétariat. Verrou optimiste (rowVersion) — voir /grades/{id} pour le même contrat.'
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassroomUpdateRequest' }
      responses:
        '200':
          description: Classe mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Classroom' }
        '403': { description: Réservé au Directeur et au Secrétariat }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Jeton de concurrence périmé, ou libellé déjà pris }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Classrooms]
      summary: Archiver (soft delete) une classe créée par erreur
      description: >-
        Réservé au Directeur et au Secrétariat. Refusée en 409 si des élèves sont encore rattachés à
        cette classe (AGENTS.md règle #6 : jamais de suppression physique).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: rowVersion
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Classe archivée }
        '403': { description: Réservé au Directeur et au Secrétariat }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Jeton de concurrence périmé, ou des élèves sont rattachés à cette classe' }

  /subjects:
    get:
      tags: [Subjects]
      summary: Lister les matières de l'établissement courant
      description: >-
        L'établissement est déduit du JWT : il n'est jamais un paramètre. Lecture ouverte à tous les
        rôles — l'enseignant a besoin des coefficients, le secrétariat pour composer les bulletins.
        Triées par niveau puis par nom.
      responses:
        '200':
          description: Liste des matières
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Subject' }
    post:
      tags: [Subjects]
      summary: Créer une matière avec coefficient (Directeur)
      description: >-
        Le coefficient relève de la notation : réservé au Directeur (Volume 7 §15). Une même matière
        peut exister à plusieurs niveaux avec des coefficients différents — l'unicité porte sur
        (niveau, DOMAINE PARENT, nom), pas sur le nom seul : « Ressources » existe légitimement sous
        « Français » ET sous « Maths » dans la même grille, mais deux matières de premier niveau de
        même nom au même niveau restent refusées en 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubjectCreateRequest' }
      responses:
        '201':
          description: Matière créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subject' }
        '403': { description: Réservé au Directeur }
        '409':
          description: Une matière de ce nom existe déjà à ce niveau dans cet établissement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /subjects/{id}:
    put:
      tags: [Subjects]
      summary: Corriger le libellé/niveau/coefficient/structure d'une matière déjà créée
      description: >-
        Même permission que la création (délégation Secrétariat via SchoolSettings, ticket JGK-G02).

        REMPLACEMENT COMPLET : omettre un champ de structure le remet à sa valeur par défaut —
        `parentSubjectId` absent détache l'activité de son domaine, `maxScore` absent lui rend le
        barème du cycle. Renvoyez la matière entière, y compris les champs que vous ne modifiez pas.

        Déplacer un DOMAINE vers un autre `level` emmène ses activités avec lui.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubjectUpdateRequest' }
      responses:
        '200':
          description: Matière mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subject' }
        '403': { description: Réservé au Directeur (ou au Secrétariat si la délégation est activée) }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Jeton de concurrence périmé, ou (niveau, domaine, nom) déjà pris }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Subjects]
      summary: Archiver (soft delete) une matière créée par erreur
      description: >-
        Refusée en 409 si des notes existent déjà pour cette matière, ou s'il s'agit d'un domaine qui
        porte encore des activités d'évaluation (elles seraient orphelines, donc absentes du bulletin
        sans le moindre message) : supprimez-les ou rattachez-les à un autre domaine d'abord.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: rowVersion
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Matière archivée }
        '403': { description: Réservé au Directeur (ou au Secrétariat si la délégation est activée) }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Jeton de concurrence périmé, notes déjà saisies, ou domaine portant encore des activités' }

  /coefficients/catalog:
    get:
      tags: [Coefficients]
      summary: Catalogue fermé des séries de lycée (Évolution N°4)
      description: >-
        Directeur et Secrétariat. Servi par l'API plutôt que recopié côté client : une seule source de vérité.
      responses:
        '200':
          description: Les séries, dans l'ordre d'affichage
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SeriesItem' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /coefficients:
    get:
      tags: [Coefficients]
      summary: Grille des coefficients d'une série OU d'une classe pour une année
      description: >-
        Une ligne par matière hors primaire/maternelle (le niveau d'une matière étant un texte libre, on écarte
        ce que le calcul neutralise à 1). `effectiveCoefficient` est calculé par le serveur — classe, puis
        série, puis coefficient de la matière — et `source` dit d'où il vient. Directeur et Secrétariat.
        Exactement UNE portée : `series` OU `classroomId`, sinon 422. Une classe de primaire/maternelle est
        refusée en 422.
      parameters:
        - { name: series, in: query, schema: { type: string, enum: [L1A, L1B, "L'1", L2, S1, S2, S3, S4, S5, STEG, T1, T2, STIDD, LA, S1A, S2A, L1, TECH] } }
        - { name: classroomId, in: query, schema: { type: string, format: uuid } }
        - name: schoolYearId
          in: query
          schema: { type: string, format: uuid }
          description: Défaut — l'année scolaire ACTIVE.
      responses:
        '200':
          description: La grille
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoefficientGrid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    put:
      tags: [Coefficients]
      summary: Poser ou corriger une surcharge de coefficient (Directeur seul)
      description: >-
        Portée `series` OU `classroomId`, sur l'année ACTIVE résolue serveur. Création : sans `rowVersion`.
        Correction : `rowVersion` obligatoire (verrou optimiste xmin) — une correction sans jeton, ou un jeton
        périmé, répond 409 et n'écrase rien. Le coefficient suit les bornes d'une matière (> 0, ≤ 20). Chaque
        écriture est journalisée : elle recalcule des moyennes et des bulletins de l'année.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertCoefficientOverrideRequest' }
      responses:
        '200':
          description: La surcharge enregistrée, avec son nouveau jeton
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoefficientOverrideResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: La ligne a changé entre-temps (jeton périmé ou manquant) }
        '422': { $ref: '#/components/responses/ValidationError' }

  /coefficients/{id}:
    delete:
      tags: [Coefficients]
      summary: « Rétablir » — supprimer (logiquement) une surcharge (Directeur seul)
      description: >-
        La matière retrouve la valeur de la portée supérieure (série, puis matière). Suppression LOGIQUE : la clé
        redevient libre. `rowVersion` en query string, comme `DELETE /subjects/{id}`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: rowVersion, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Surcharge rétablie }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Surcharge introuvable dans l'établissement }
        '409': { description: Jeton périmé }

  /coefficients/apply-template:
    post:
      tags: [Coefficients]
      summary: « Appliquer le modèle » national d'une série (Directeur seul)
      description: >-
        Crée, pour l'année active, une surcharge de SÉRIE par matière reconnue dans le modèle (correspondance
        par nom : casse, accents et ponctuation ignorés). Ne modifie jamais le coefficient des matières ni les
        surcharges de classe. Sans `overwrite`, une surcharge de série déjà posée est conservée. Idempotent.
        Une série sans modèle (`TECH` aujourd'hui) répond 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplySeriesTemplateRequest' }
      responses:
        '200':
          description: Rapport d'application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyTemplateResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /coefficients/carry-over:
    post:
      tags: [Coefficients]
      summary: « Reprendre l'année précédente » (Directeur seul)
      description: >-
        Une nouvelle année démarre SANS surcharge : cette action explicite recopie celles de `fromSchoolYearId`
        vers l'année ACTIVE, sans rien écraser. Une ligne dont la matière ou la classe est archivée n'est pas
        recopiée. 422 si l'année source est l'année active ou introuvable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromSchoolYearId]
              properties:
                fromSchoolYearId: { type: string, format: uuid }
      responses:
        '200':
          description: Nombre de lignes recopiées / ignorées
          content:
            application/json:
              schema:
                type: object
                properties:
                  copied: { type: integer }
                  skipped: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }


  /class-subjects:
    get:
      tags: [ClassSubjects]
      summary: Programme d'une classe — matières, coefficients, options (Évolution N°6)
      description: >-
        Directeur et Secrétariat. Coefficient EFFECTIF de l'année active (classe, puis série, puis matière),
        valeur officielle du modèle de la série, groupe d'options et nombre d'élèves par option.
      parameters:
        - { name: classroomId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Le programme
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassSubjects' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [ClassSubjects]
      summary: Ajouter une matière propre à l'établissement au programme d'une classe (Directeur seul)
      description: >-
        Exactement UN de `subjectId` (matière existante) ou `newSubjectName` (créée au niveau de la classe).
        `coefficient` facultatif : s'il diffère du coefficient hérité, il devient la surcharge de classe de
        l'année active. 422 au primaire/maternelle ou si la matière figure déjà au programme.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classroomId]
              properties:
                classroomId: { type: string, format: uuid }
                subjectId: { type: string, format: uuid, nullable: true }
                newSubjectName: { type: string, maxLength: 80, nullable: true }
                coefficient: { type: number, minimum: 0, exclusiveMinimum: true, maximum: 20, nullable: true }
                optionGroup: { type: string, maxLength: 40, nullable: true }
      responses:
        '201': { description: "Matière ajoutée — corps `{ id }`" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Matière ajoutée entre-temps par un autre utilisateur (index unique) }
        '422': { $ref: '#/components/responses/ValidationError' }

  /class-subjects/{id}:
    put:
      tags: [ClassSubjects]
      summary: Activer/désactiver une matière de classe et régler son groupe d'options (Directeur seul)
      description: >-
        Le coefficient se règle par PUT /coefficients (portée classe). Une matière désactivée sort des grilles
        de saisie et des bulletins de la classe, sans effacer ses notes. 409 si `rowVersion` est périmé.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive, rowVersion]
              properties:
                isActive: { type: boolean }
                optionGroup: { type: string, maxLength: 40, nullable: true, description: Vide ou null — matière suivie par toute la classe }
                rowVersion: { type: integer, format: int64 }
      responses:
        '200': { description: '`{ id, rowVersion }`' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Jeton de concurrence périmé — rechargez la ligne }

  /class-subjects/reset:
    post:
      tags: [ClassSubjects]
      summary: « Réinitialiser aux coefficients officiels du Sénégal » (Directeur seul)
      description: >-
        Le programme et les coefficients de CLASSE redeviennent ceux du modèle national de la série, pour
        l'année active. Les matières ajoutées par l'établissement restent ; une matière d'un ancien modèle est
        désactivée. Ne modifie ni le coefficient d'une matière ni une surcharge de série. 422 sans série ou
        pour une série sans modèle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classroomId]
              properties:
                classroomId: { type: string, format: uuid }
      responses:
        '200':
          description: Rapport de réinitialisation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassTemplateReport' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /class-subjects/assign-default-options:
    post:
      tags: [ClassSubjects]
      summary: Donner l'option par défaut aux élèves sans choix (Directeur, Secrétariat)
      description: Année active. Ne modifie jamais un choix existant ; idempotente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classroomId]
              properties:
                classroomId: { type: string, format: uuid }
      responses:
        '200':
          description: Élèves complétés et options attribuées
          content:
            application/json:
              schema:
                type: object
                properties:
                  studentsUpdated: { type: integer }
                  optionsAssigned: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /class-subjects/options:
    get:
      tags: [ClassSubjects]
      summary: Groupes d'options d'une classe, ou de la classe d'un élève avec ses choix (Directeur, Secrétariat)
      description: Exactement UN de `classroomId` (formulaire d'inscription) ou `studentId` (fiche élève), sinon 422.
      parameters:
        - { name: classroomId, in: query, schema: { type: string, format: uuid } }
        - { name: studentId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Les groupes (liste vide si la classe n'en a aucun)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubjectOptions' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /class-subjects/students/{studentId}/options:
    put:
      tags: [ClassSubjects]
      summary: Enregistrer les options d'un élève pour l'année active (Directeur, Secrétariat)
      description: >-
        `classSubjectIds` est la liste COMPLÈTE des options retenues (au plus une par groupe) ; un groupe absent
        reste sans option. L'ancien choix est archivé (suppression logique). 422 pour une option hors de la classe
        de l'élève ou deux options d'un même groupe.
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classSubjectIds]
              properties:
                classSubjectIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Les options retenues
          content:
            application/json:
              schema:
                type: array
                items: { type: string, format: uuid }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /students:
    get:
      tags: [Students]
      summary: Lister/rechercher les élèves
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: classroomId
          in: query
          schema: { type: string, format: uuid }
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Liste paginée d'élèves
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedStudents' }
    post:
      tags: [Students]
      summary: Inscrire un élève (le matricule est généré à l'enregistrement, jamais avant)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentCreateRequest' }
      responses:
        '201': { description: Élève créé, matricule généré, content: { application/json: { schema: { $ref: '#/components/schemas/Student' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /students/{studentId}:
    get:
      tags: [Students]
      summary: Fiche complète d'un élève
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Fiche élève
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentProfile' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Students]
      summary: Corriger la fiche d'un élève (état civil, classe, tuteur) — matricule non modifiable
      description: 'Réservé au Directeur et au Secrétariat.'
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentUpdateRequest' }
      responses:
        '200': { description: Fiche mise à jour, content: { application/json: { schema: { $ref: '#/components/schemas/Student' } } } }
        '403': { description: Réservé au Directeur et au Secrétariat }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Jeton de concurrence périmé }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Students]
      summary: Archiver (soft delete) une fiche élève créée par pure erreur de saisie
      description: 'Refusée en 409 dès qu''une inscription ou une note existe déjà pour cet élève.'
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - name: rowVersion
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Fiche archivée }
        '403': { description: Réservé au Directeur et au Secrétariat }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Jeton de concurrence périmé, ou une inscription/note existe déjà' }

  /teachers:
    get:
      tags: [Teachers]
      summary: Lister les enseignants (pagination, recherche)
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Liste paginée des enseignants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedTeachers' }
        '403': { description: Rôle non autorisé (Volume_7_Security.md « Enseignants ») }
    post:
      tags: [Teachers]
      summary: Créer un enseignant (matricule généré à l'enregistrement, ticket JGK-D03)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeacherCreateRequest' }
      responses:
        '201':
          description: Enseignant créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherResult' }
        '403': { description: Réservé au Directeur et au Secrétariat }
        '422': { $ref: '#/components/responses/ValidationError' }

  /teachers/export/pdf:
    get:
      tags: [Teachers]
      summary: « LISTE DES ENSEIGNANTS » en PDF (A4 paysage, sans pagination)
      description: >
        Pendant de GET /students/export/pdf pour le corps professoral. Mêmes rôles que la
        consultation de la liste (Volume_7_Security.md « Enseignants » : Super Admin, Directeur,
        Secrétariat) — un export n'ouvre aucune donnée que le rôle ne puisse déjà lire à l'écran ;
        le rôle Finance en est donc exclu, contrairement à l'export des élèves. Opération journalisée
        dans les journaux d'audit (Volume_7_Security.md §7).
      parameters:
        - name: status
          in: query
          description: Filtre optionnel sur le statut. Omis = tous les statuts.
          schema:
            type: string
            enum: [Active, Suspended, Blocked]
      responses:
        '200':
          description: La liste des enseignants au format PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403': { description: Rôle non autorisé (Volume_7_Security.md « Enseignants ») }

  /teachers/{id}:
    get:
      tags: [Teachers]
      summary: Fiche enseignant complète (ticket JGK-D04)
      description: >-
        Matières qualifiées, attributions classe/matière groupées par année scolaire — cette
        dernière liste EST l'historique, une attribution n'étant jamais réécrite d'une année sur l'autre.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Fiche enseignant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherProfile' }
        '403': { description: Rôle non autorisé (Volume_7_Security.md « Enseignants ») }
        '404': { description: Enseignant introuvable dans l'établissement courant }
    put:
      tags: [Teachers]
      summary: Corriger la fiche d'un enseignant (état civil, contact, matières qualifiées)
      description: >-
        Réservé au Directeur et au Secrétariat. Matricule et rattachement d'un compte de connexion
        (userId) non modifiables ici (voir TeacherUpdateRequest).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeacherUpdateRequest' }
      responses:
        '200': { description: Fiche mise à jour, content: { application/json: { schema: { $ref: '#/components/schemas/Teacher' } } } }
        '403': { description: Réservé au Directeur et au Secrétariat }
        '404': { description: Enseignant introuvable dans l'établissement courant }
        '409': { description: Jeton de concurrence périmé }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Teachers]
      summary: Archiver (soft delete) une fiche enseignant créée par pure erreur de saisie
      description: 'Refusée en 409 dès qu''une attribution classe/matière/année existe déjà.'
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: rowVersion
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Fiche archivée }
        '403': { description: Réservé au Directeur et au Secrétariat }
        '404': { description: Enseignant introuvable dans l'établissement courant }
        '409': { description: 'Jeton de concurrence périmé, ou une attribution existe déjà' }

  /teachers/{id}/assignments:
    post:
      tags: [Teachers]
      summary: Attribuer une classe/matière à l'enseignant sur l'année scolaire active (ticket JGK-D04)
      description: >-
        Aucune année scolaire dans le corps de la requête : l'année ACTIVE est résolue serveur, jamais
        choisie par le client (même règle que POST /enrollments).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeacherAssignmentCreateRequest' }
      responses:
        '201':
          description: Attribution créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherAssignmentResult' }
        '403': { description: Réservé au Directeur et au Secrétariat }
        '404': { description: Enseignant introuvable dans l'établissement courant }
        '409': { description: Cette attribution (enseignant, classe, matière, année) existe déjà }
        '422': { $ref: '#/components/responses/ValidationError' }

  /attendance/roster:
    get:
      tags: [Attendance]
      summary: Grille d'appel d'une classe pour une date/matière/créneau (ticket JGK-D06)
      description: >-
        Génère la liste des élèves de la classe pour la saisie de l'appel. L'Enseignant n'y a accès que
        pour ses classes/matières assignées (403 sinon) ; Directeur et Secrétariat sans restriction. Si
        une fiche existe déjà pour cette clé, les statuts déjà saisis sont renvoyés (alreadySubmitted=true).
        Une `date` tombant un jour de repos de l'établissement (`SchoolSettings.workingDays`) est refusée (422).

        **Appel par créneau (Évolution N°5).** Avec `scheduleSlotId`, l'appel porte sur un cours de l'emploi du
        temps : la période est DÉRIVÉE du cours (« 08:00-10:00 ») et le paramètre `period` est ignoré. Le cours doit
        appartenir à la classe et à la matière demandées et tomber le bon jour de semaine (422 sinon) ; un Enseignant
        n'y accède que s'il en est le titulaire (403 sinon). Sans `scheduleSlotId`, `period` reste obligatoire :
        c'est l'appel libre d'avant. Un billet d'entrée actif visant ce cours présélectionne l'élève en `Late` et
        renseigne `entryTicketId`, `entryTicketNumber` et `entryTicketStatus` sur sa ligne.
      parameters:
        - name: classroomId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: subjectId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: period
          in: query
          required: false
          description: Obligatoire sans `scheduleSlotId` ; ignoré (dérivé du cours) avec.
          schema: { type: string }
        - name: scheduleSlotId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Grille d'appel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRoster' }
        '403': { description: Enseignant non assigné à cette classe/matière }
        '422': { $ref: '#/components/responses/ValidationError' }

  /attendance/slots:
    get:
      tags: [Attendance]
      summary: Cours d'une classe pour une date — de quoi choisir le créneau de l'appel (Évolution N°5)
      description: >-
        Les créneaux de l'emploi du temps de la classe le jour de semaine de `date`, triés par heure, avec le
        libellé de période dérivé (`label`, « 08:00-10:00 ») et, si l'appel a déjà été fait pour ce cours ce
        jour-là, l'identifiant de la fiche (`sheetId`). Un Enseignant ne reçoit que SES cours. Un jour de repos de
        l'établissement renvoie une liste vide. Mêmes rôles que `/attendance/roster`.
      parameters:
        - name: classroomId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Cours de la journée
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AttendanceSlot' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /absences/today-slots:
    get:
      tags: [Attendance]
      summary: Cours du jour de la classe d'un élève — sélecteur du cours visé par un billet d'entrée (Évolution N°5)
      description: >-
        Les cours de la classe de l'élève à `date` (aujourd'hui par défaut). Le cours en cours (`isCurrent`), à
        défaut le prochain (`isNext`), est signalé ; ces deux indicateurs ne valent que pour la date du jour, sur
        l'heure UTC du serveur. `ticketStatus` indique un billet actif déjà émis pour cet élève et ce cours. Un jour
        de repos renvoie une liste vide. Réservé au SuperAdmin, au Directeur et à la Vie Scolaire.
      parameters:
        - name: studentId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: Cours de la journée
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StudentSlot' }
        '403': { description: Rôle non autorisé }
        '422': { $ref: '#/components/responses/ValidationError' }

  /absences/late-arrivals:
    post:
      tags: [Attendance]
      summary: Enregistrer un retard — et, avec `targetScheduleSlotId`, émettre un billet d'entrée visant un cours (Évolution N°5)
      description: >-
        Sans `targetScheduleSlotId`, le comportement d'avant : un retard sans cours visé, sans statut de billet.
        Avec `targetScheduleSlotId`, le billet naît `Issued` et vise ce cours : le cours doit appartenir à la classe
        de l'élève et tomber le jour de `date` (422 sinon), `minutes` est plafonné à 240, le jour ne doit pas être un
        jour de repos, et un seul billet actif (`Issued` ou `Accepted`) est admis par élève, cours et jour (409 sinon).
        Si la fiche d'appel de ce cours existe déjà, la ligne de l'élève passe en `Late` dans la MÊME transaction
        (son statut d'avant est conservé pour une éventuelle annulation) ; une absence rectifiée en retard publie
        l'événement d'assiduité. Le retard de la liste (`GET /absences/late-arrivals`) porte `targetScheduleSlotId` et
        `status` (null pour tout l'historique sans cours visé). Réservé au SuperAdmin, au Directeur et à la Vie Scolaire.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LateArrivalCreateRequest' }
      responses:
        '200':
          description: Identifiant du retard / billet
          content:
            application/json:
              schema: { type: string, format: uuid }
        '403': { description: Rôle non autorisé }
        '409': { description: Un billet actif existe déjà pour cet élève, ce cours et ce jour }
        '422': { $ref: '#/components/responses/ValidationError' }

  /billets/{id}/accept:
    post:
      tags: [Attendance]
      summary: Accepter l'élève en classe — billet d'entrée (Évolution N°5)
      description: >-
        L'ENSEIGNANT du cours visé (titulaire du créneau) ou le Directeur constate que l'élève est entré en classe :
        le billet passe `Accepted`. Idempotent (un second appel renvoie le même résultat, sans nouvel effet). Refus :
        403 pour un Enseignant qui n'est pas le titulaire du cours ; 404 billet introuvable dans l'établissement ;
        422 si le billet est annulé ou ne vise aucun cours.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Billet accepté
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryTicketActionResult' }
        '403': { description: Enseignant non titulaire du cours, ou rôle non autorisé }
        '404': { description: Billet introuvable dans l'établissement courant }
        '422': { $ref: '#/components/responses/ValidationError' }

  /billets/{id}/cancel:
    post:
      tags: [Attendance]
      summary: Annuler un billet d'entrée non accepté (Évolution N°5)
      description: >-
        Réservé à la Vie Scolaire (Surveillant) et au Directeur — l'enseignant accepte, il n'annule pas. Le billet
        passe `Cancelled` et, si la fiche d'appel du cours existe, la ligne de l'élève retrouve son statut d'avant
        (le billet n'est jamais supprimé : soft delete, jamais physique). Idempotent sur un billet déjà annulé.
        422 si le billet a déjà été accepté par l'enseignant.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Billet annulé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryTicketActionResult' }
        '403': { description: Rôle non autorisé }
        '404': { description: Billet introuvable dans l'établissement courant }
        '422': { $ref: '#/components/responses/ValidationError' }

  /attendance:
    post:
      tags: [Attendance]
      summary: Enregistrer l'appel complet — fiche + statut de chaque élève (ticket JGK-D06)
      description: >-
        Ni schoolId ni schoolYearId dans le corps : l'année ACTIVE est résolue serveur (même règle que
        POST /enrollments). Une seconde saisie de la même clé (classe, matière, date, créneau) est refusée en 409.
        Avec `scheduleSlotId` (Évolution N°5), la clé reste (classe, matière, date, période) — la période étant dérivée du cours, `period`
        est ignoré ; les billets d'entrée actifs visant ce cours sont rattachés aux
        lignes des élèves concernés.
        Une `date` tombant un jour de repos de l'établissement (`SchoolSettings.workingDays`) est refusée (422).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceSubmitRequest' }
      responses:
        '201':
          description: Appel enregistré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceSubmitResult' }
        '403': { description: Enseignant non assigné à cette classe/matière }
        '409': { description: Un appel existe déjà pour cette classe, matière, date et créneau }
        '422': { $ref: '#/components/responses/ValidationError' }

  /attendance/{id}:
    get:
      tags: [Attendance]
      summary: Relire une fiche d'appel enregistrée (ticket JGK-D06 — consultation)
      description: 'Réservé au Directeur, au Secrétariat et au Super Admin. Le rôle Finance est exclu.'
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Fiche d'appel avec le statut de chaque élève
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceSheet' }
        '403': { description: Rôle non autorisé (Finance exclu de la consultation) }
        '404': { description: Fiche d'appel introuvable dans l'établissement courant }

  /enrollments:
    post:
      tags: [Enrollments]
      summary: Créer une inscription/réinscription (déclenche automatiquement le calcul Finance)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentCreateRequest' }
      responses:
        '201':
          description: Inscription créée, frais calculés automatiquement (renvoie le reçu)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentReceipt' }
        '403': { description: Rôle non autorisé (le service Finance ne compose pas de montant dû) }
        '409': { description: Élève déjà inscrit pour l'année active }
        '422': { description: Aucune année active, ou données invalides }

  /enrollments/{id}:
    delete:
      tags: [Enrollments]
      summary: Annuler une inscription saisie par erreur (jamais de suppression physique)
      description: >-
        Réservé au Directeur et au Secrétariat. Refusée en 409 si un paiement a déjà été encaissé —
        utiliser POST /enrollments/{id}/status pour un abandon ou un transfert à la place.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: rowVersion
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Inscription annulée (statut Cancelled) }
        '403': { description: Réservé au Directeur et au Secrétariat }
        '404': { description: Inscription introuvable dans l'établissement courant }
        '409': { description: 'Jeton de concurrence périmé, déjà annulée, ou un paiement existe déjà' }

  /enrollments/{id}/status:
    post:
      tags: [Enrollments]
      summary: Déclarer un abandon ou un transfert en cours d'année
      description: >-
        Réservé au Directeur et au Secrétariat. L'inscription n'est PAS annulée : elle change de
        statut. L'élève sort des futures listes de présence actives ; ses notes et paiements déjà
        enregistrés restent intacts.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeEnrollmentStatusRequest' }
      responses:
        '204': { description: Statut mis à jour }
        '403': { description: Réservé au Directeur et au Secrétariat }
        '404': { description: Inscription introuvable dans l'établissement courant }
        '409': { description: 'Jeton de concurrence périmé, ou l''inscription est déjà dans un statut terminal' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /enrollments/{id}/receipt:
    get:
      tags: [Enrollments]
      summary: Reçu d'inscription (ticket JGK-E01 — JSON ; le PDF pixel-fidèle est JGK-E02)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Reçu (détail des frais figé à l'inscription)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentReceipt' }
        '404': { description: Inscription introuvable dans l'établissement courant }

  /enrollments/{id}/receipt/pdf:
    get:
      tags: [Enrollments]
      summary: Reçu d'inscription officiel en PDF (ticket JGK-E02 — reproduit docs/design-references/receipt-reference.png)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Le reçu au format PDF (téléchargement)
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { description: Inscription introuvable dans l'établissement courant }

  /grades:
    get:
      tags: [Grades]
      summary: Grille de saisie d'une classe/matière/trimestre (Directeur, Secrétariat, Enseignant)
      description: >-
        Les élèves de la classe avec leurs notes déjà saisies (Devoir 1, Devoir 2, Composition).
        Chaque note porte `canEdit` : l'appelant peut-il la corriger ? Calculé côté serveur par la même
        règle que PUT /grades/{id} (fenêtre de correction de l'école, auteur ou affectation pour
        l'Enseignant ; toujours vrai pour le Directeur et le Secrétariat). L'écran grise la cellule sur
        cette base — confort d'affichage, la vraie garde reste le PUT (403).
      parameters:
        - name: classroomId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: subjectId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: termId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Une ligne par élève
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/StudentGradeRow' } }
        '403': { description: Réservé au Directeur, au Secrétariat et à l'Enseignant }
        '404': { description: Classe, matière ou trimestre introuvable dans l'établissement courant }
    post:
      tags: [Grades]
      summary: Saisir une nouvelle note (Directeur, Secrétariat, Enseignant)
      description: >-
        docs/Volume_7_Security.md « Notes » : Saisir est ouvert au Directeur, au Secrétariat (toutes
        classes) et à l'Enseignant. L'auteur est consigné (`CreatedBy`) : c'est lui que la règle de
        correction autorise. Aucune note ne doit déjà exister pour la clé
        élève/matière/trimestre/type d'évaluation : une création concurrente sur la même clé est
        refusée en 409, jamais un doublon silencieux.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GradeCreateRequest' }
      responses:
        '201':
          description: Note créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GradeSaved' }
        '403': { description: Réservé au Directeur, au Secrétariat et à l'Enseignant }
        '409':
          description: Une note existe déjà pour cette clé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /grades/sheet/export:
    get:
      tags: [Grades]
      summary: Télécharger la feuille de notes Excel d'une classe/matière/trimestre
      description: >-
        Feuille Excel (Matricule, Nom & Prénom, Devoir 1, Devoir 2, Composition) pré-remplie avec les
        notes déjà saisies — colonnes Matricule et Nom & Prénom verrouillées. Bouton « Télécharger la
        feuille » de la modale d'import : l'enseignant la complète puis la réimporte via
        POST /grades/sheet/import.
      parameters:
        - name: classroomId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: subjectId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: termId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Feuille de notes au format Excel (téléchargement)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { description: Réservé au Directeur, au Secrétariat et à l'Enseignant }
        '404': { description: Classe, matière ou trimestre introuvable dans l'établissement courant }

  /grades/sheet/print:
    get:
      tags: [Grades]
      summary: Fiche de saisie papier (PDF vierge) d'une classe/matière/trimestre/évaluation
      description: >-
        Grille à imprimer et remplir au stylo dans la salle, avant de reporter les notes à l'écran : en-tête
        (établissement, classe, matière, évaluation, trimestre, année, barème « sur N »), puis les élèves
        de la classe par ordre alphabétique (français : « Élodie » avant « Emma »), avec des cases Note et
        Appréciation VIDES et une ligne de signature. Le barème est celui de la matière (grilles APC : /40,
        /60…) et, à défaut, celui du cycle de la classe. Distincte de GET /grades/sheet/export, dont la
        feuille Excel est pré-remplie et sert à réimporter. `evaluationType` est obligatoire : un oubli
        n'imprime jamais silencieusement une fiche « Devoir 1 ». Un domaine d'évaluation APC, qui ne porte
        jamais de note, est refusé en 422.
      parameters:
        - name: classroomId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: subjectId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: termId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: evaluationType
          in: query
          required: true
          schema: { type: string, enum: [Devoir1, Devoir2, Composition] }
      responses:
        '200':
          description: Fiche de saisie au format PDF (A4)
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403': { description: Réservé au Directeur, au Secrétariat et à l'Enseignant }
        '404': { description: Classe, matière ou trimestre introuvable dans l'établissement courant }
        '422': { $ref: '#/components/responses/ValidationError' }

  /grades/sheet/import:
    post:
      tags: [Grades]
      summary: Importer les trois épreuves d'une classe/matière/trimestre depuis un fichier Excel (Directeur, Secrétariat, Enseignant)
      description: >-
        Mode de saisie alternatif à POST /grades, mêmes rôles. L'import MODIFIE aussi des notes existantes :
        il applique la même règle de correction que PUT /grades/{id} (fenêtre de l'Enseignant, auteur ou
        affectation) — un Enseignant hors fenêtre qui réécrit une note existante est refusé en 403 sur le
        fichier entier, aperçu compris ; les créations et les valeurs inchangées restent libres. Format
        LARGE : une ligne par élève, une colonne par épreuve (Matricule, Devoir 1, Devoir 2,
        Composition), colonnes reconnues par le NOM de leur en-tête — jamais par leur position — pour
        exclure toute inversion. `dryRun=true` valide tout le fichier sans rien écrire (aperçu) ;
        `dryRun=false` re-valide puis, si tout est valide, upsert chaque note dans une seule
        transaction. Une seule ligne invalide (matricule inconnu ou hors de la classe visée, doublon
        dans le fichier, note hors barème) rejette l'import entier en 422 avec le détail ligne par
        ligne (`details`, clé « Ligne N ») — jamais un import partiel.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [classroomId, subjectId, termId, dryRun, file]
              properties:
                classroomId: { type: string, format: uuid }
                subjectId: { type: string, format: uuid }
                termId: { type: string, format: uuid }
                dryRun:
                  type: boolean
                  description: true = aperçu (rien n'est écrit) ; false = confirmation (écrit si tout est valide).
                file:
                  type: string
                  format: binary
                  description: >-
                    Fichier .xlsx/.xls, colonnes Matricule, Devoir 1, Devoir 2, Composition (ordre
                    libre). La ligne d'en-tête est obligatoire.
      responses:
        '200':
          description: Import (ou aperçu) appliqué — décompte des lignes créées/corrigées/inchangées
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GradeImportResult' }
        '403': { description: Rôle non autorisé, ou (Enseignant) correction d'une note existante hors fenêtre / hors propriété }
        '422':
          description: >-
            Fichier illisible/vide/mal formé (en-tête absent, colonnes ambiguës), ou au moins une ligne
            invalide — `details` liste chaque ligne fautive (« Ligne N »), rien n'est enregistré.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /grades/{id}:
    put:
      tags: [Grades]
      summary: Corriger une note déjà saisie (Directeur, Secrétariat, Enseignant sous conditions) — verrouillage optimiste
      description: >-
        docs/Volume_7_Security.md « Notes ». Directeur et Secrétariat corrigent sans limite de délai.
        L'Enseignant ne corrige que dans la fenêtre `gradeEditWindowDays` de l'école (7 jours par défaut)
        depuis la saisie, ET s'il est l'auteur de la note ou affecté à sa classe et à sa matière : 403
        sinon, avec un message qui distingue le délai dépassé de la propriété. La correction est
        historisée (journal d'audit). `rowVersion` est le jeton xmin lu à la dernière consultation — un
        jeton périmé (la note a changé entre-temps) est refusé en 409, jamais un écrasement silencieux.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GradeUpdateRequest' }
      responses:
        '200':
          description: Note corrigée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GradeSaved' }
        '403': { description: Rôle non autorisé, ou (Enseignant) délai de correction dépassé / note ni saisie par lui ni de sa matière et sa classe }
        '404': { description: Note introuvable dans l'établissement courant }
        '409':
          description: Conflit de concurrence — la note a été modifiée entre-temps
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /grades/calculate:
    get:
      tags: [Grades]
      summary: Calculer les moyennes et la mention d'un élève pour un trimestre
      description: >-
        Ticket JGK-G02 — moyenne de chaque matière notée, moyenne générale pondérée par les
        coefficients (Volume 1 §8.3) et mention qui en découle (§8.4). Recalculé à la demande, jamais
        persisté : la version figée du bulletin relève de JGK-G03. Lecture ouverte au Directeur et à
        l'Enseignant, comme la consultation des notes.
      parameters:
        - name: studentId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: termId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Synthèse des moyennes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GradeSummary' }
        '403': { description: Réservé au Directeur et à l'Enseignant }
        '404': { description: Élève ou trimestre introuvable dans l'établissement courant }

  /grades/mentions:
    get:
      tags: [Grades]
      summary: Lister les mentions (personnalisées, ou par défaut tant qu'aucune n'a été créée)
      description: >-
        Ticket JGK-G02 (Volume 1 §8.4). Les seuils par défaut sont des fractions du barème de l'école
        (SchoolSettings.GradingScale) : ils s'adaptent qu'une école note sur 10 ou sur 20.
      responses:
        '200':
          description: Mentions actives, la plus forte d'abord
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Mention' }
    post:
      tags: [Grades]
      summary: Créer une mention personnalisée (Directeur)
      description: >-
        docs/Volume_7_Security.md « Paramètres de l'école » : notation, mentions — Directeur
        uniquement. Dès la première mention créée, l'école cesse de recevoir les valeurs par défaut.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MentionCreateRequest' }
      responses:
        '201':
          description: Mention créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mention' }
        '403': { description: Réservé au Directeur }
        '409':
          description: Une mention de ce libellé existe déjà
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /report-cards/generate:
    post:
      tags: [ReportCards]
      summary: Générer le bulletin PDF (A5) d'un élève pour un trimestre — Directeur, Enseignant
      description: >-
        Ticket JGK-G03. Reproduit docs/design-references/bulletin-reference.png (AGENTS.md règle #12) :
        tableau des notes (Devoir/Composition/Moyenne/Coefficient/Moyenne×Coefficient/Rang), moyenne
        générale pondérée et mention (réutilise JGK-G02), récapitulatif des moyennes de chaque trimestre
        de l'année + moyenne annuelle + rang annuel. Recalculé à la demande à partir des notes
        actuelles — rien n'est persisté, régénérer donne toujours le bulletin à jour.

        Certaines cases de la référence visuelle restent volontairement VIDES, faute de suivi dans le
        système à ce jour : T.H, Absences, Retards, mentions disciplinaires (Blâme, Avertissement,
        Tableau d'honneur, Encouragements, Félicitations), Décision du Conseil, Appréciation par
        matière, lieu de naissance, Classe redoublée.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, termId]
              properties:
                studentId: { type: string, format: uuid }
                termId: { type: string, format: uuid }
      responses:
        '200':
          description: Bulletin PDF (format A5 portrait)
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403': { description: Réservé au Directeur et à l'Enseignant }
        '404': { description: Élève ou trimestre introuvable dans l'établissement courant }


  /report-cards/class-deliberation/annual/pdf:
    get:
      tags: [ReportCards]
      summary: PV ANNUEL du conseil de classe (Évolution N°7) — Directeur, Enseignant, Secrétariat
      description: >-
        Moyenne et rang annuels de chaque élève (ordre de mérite), tableau récapitulatif Filles / Garçons / Total
        (effectif, présents, classés, moyenne ≥ moitié du barème, taux de réussite), décompte des décisions, et la
        décision de fin d'année — saisie par le conseil, à défaut PROPOSÉE (« Proposé : … ») d'après les seuils de
        l'école. Bâti sur la dernière période de l'année. 409 pour une classe sans élève ou une année sans période.
      parameters:
        - { name: classroomId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: schoolYearId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: PV annuel (A4 portrait)
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Classe sans élève, ou année sans période }

  /report-cards/council-decisions/apply-proposals:
    post:
      tags: [ReportCards]
      summary: Enregistrer les décisions de fin d'année proposées (Directeur, Secrétariat)
      description: >-
        Pour chaque élève de la classe SANS décision sur la période, enregistre la décision proposée d'après sa
        moyenne annuelle (Admis en classe supérieure, Autorisé à redoubler, Exclu). Ne remplace jamais une
        décision déjà prise ; un élève sans moyenne annuelle reste sans décision. Idempotente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classroomId, termId]
              properties:
                classroomId: { type: string, format: uuid }
                termId: { type: string, format: uuid }
      responses:
        '200':
          description: Bilan
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { type: integer }
                  alreadyDecided: { type: integer }
                  withoutAverage: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /report-cards/council-rules:
    get:
      tags: [ReportCards]
      summary: Seuils du conseil de classe de l'école (défauts MEN à défaut de réglage)
      responses:
        '200':
          description: Les seuils, sur /20
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouncilRules' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [ReportCards]
      summary: Régler les seuils du conseil de classe (Directeur seul)
      description: >-
        Tous sur /20. 422 si un seuil sort de [0 ; 20], si les Félicitations exigent moins que le Tableau d'honneur
        ou les Encouragements, ou si le seuil de redoublement dépasse celui de passage. Recalcule les PROPOSITIONS
        (distinctions du bulletin, décisions du PV annuel), jamais une décision déjà prise. Journalisé.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouncilRules' }
      responses:
        '200':
          description: Les seuils enregistrés
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouncilRules' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /finance/fee-categories:
    get:
      tags: [Finance]
      summary: Lister les catégories de frais de l'établissement courant
      description: >-
        Liste paramétrable (inscription, mensualité, cantine…). Lecture ouverte à tous les rôles.
      responses:
        '200':
          description: Liste des catégories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FeeCategory' }
    post:
      tags: [Finance]
      summary: Créer une catégorie de frais (Directeur)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeeCategoryCreateRequest' }
      responses:
        '201':
          description: Catégorie créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeeCategory' }
        '403': { description: Réservé au Directeur }
        '409':
          description: Une catégorie de ce nom existe déjà
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /finance/fee-categories/{id}:
    delete:
      tags: [Finance]
      summary: Supprimer une catégorie de frais et tout son barème (Directeur, ou Finance déléguée)
      description: >-
        Soft delete en cascade (AGENTS.md règle #6) : la catégorie ET toutes ses lignes de barème
        (ClassFee) associées disparaissent de l'interface dans la même transaction, sans jamais
        d'écriture SQL DELETE réelle. Directeur toujours autorisé ; Finance uniquement si
        SchoolSettings.allowFinanceToDeleteFees est activé pour cet établissement (matrice
        d'autorisation "Photoshop").
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Catégorie et barème associé supprimés }
        '403': { description: Réservé au Directeur, ou à la Finance si la délégation est activée }
        '404': { description: Catégorie introuvable dans cet établissement }

  /finance/fees:
    get:
      tags: [Finance]
      summary: Lister le barème de l'établissement courant (une ligne par catégorie × classe)
      description: >-
        Le montant de chaque (catégorie, classe) déjà défini. Les couples encore vierges
        n'apparaissent pas : l'interface, connaissant catégories et classes, y affiche « non défini ».
        `rowVersion` (xmin) est le jeton de concurrence optimiste à renvoyer lors d'une modification.
      responses:
        '200':
          description: Barème
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClassFee' }

  /finance/fees/apply-standard:
    post:
      tags: [Finance]
      summary: Option 1 — appliquer un montant standard à une catégorie, sur toute l'école ou un seul niveau (Directeur)
      description: >-
        Applique un montant à plusieurs classes en un geste (Volume 1 §7.4). `level` délimite le
        périmètre : absent ou vide, toutes les classes ; renseigné, seules celles de ce niveau — les
        autres cycles ne sont pas touchés. `overwriteExisting` à false (défaut) ne remplit que les
        classes encore vierges du périmètre et PRÉSERVE les exceptions déjà ajustées ; à true,
        réaligne aussi les classes existantes du périmètre sur le montant standard. Chaque changement
        est historisé.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyStandardFeeRequest' }
      responses:
        '200':
          description: Compte-rendu (créées, réalignées, laissées telles quelles)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyStandardFeeResult' }
        '403': { description: Réservé au Directeur }
        '422': { $ref: '#/components/responses/ValidationError' }

  /finance/fees/{id}:
    put:
      tags: [Finance]
      summary: Option 2 — ajuster le montant d'une classe (exception), verrouillage optimiste (Directeur, ou Finance déléguée)
      description: >-
        Modifie une ligne de barème. `rowVersion` (xmin lu à l'affichage) protège contre l'écrasement
        concurrent : si un autre utilisateur a modifié la ligne entre-temps, la réponse est 409
        (AGENTS.md règle #5). Le changement est historisé. Directeur toujours autorisé ; Finance
        uniquement si SchoolSettings.allowFinanceToModifyFees est activé pour cet établissement
        (matrice d'autorisation "Photoshop").
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, rowVersion]
              properties:
                amount: { type: number, minimum: 0 }
                rowVersion:
                  type: integer
                  format: int64
                  description: Jeton de concurrence (xmin) renvoyé par le dernier GET /finance/fees.
      responses:
        '200':
          description: Montant mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateFeeResult' }
        '403': { description: Réservé au Directeur, ou à la Finance si la délégation est activée }
        '404': { description: Ligne de barème introuvable dans cet établissement }
        '409':
          description: La ligne a été modifiée par un autre utilisateur entre-temps
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Finance]
      summary: Supprimer une ligne de barème (Directeur, ou Finance déléguée)
      description: >-
        Soft delete (AGENTS.md règle #6), jamais un DELETE SQL réel — la ligne disparaît de
        l'interface (Global Query Filter), l'historique comptable reste intact (EnrollmentFeeLine
        fige un instantané du montant à l'inscription, indépendant de cette ligne de barème). Même
        verrouillage optimiste que la modification. Directeur toujours autorisé ; Finance uniquement
        si SchoolSettings.allowFinanceToDeleteFees est activé pour cet établissement.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: rowVersion
          in: query
          required: true
          schema: { type: integer, format: int64 }
          description: Jeton de concurrence (xmin) renvoyé par le dernier GET /finance/fees.
      responses:
        '204': { description: Ligne de barème supprimée }
        '403': { description: Réservé au Directeur, ou à la Finance si la délégation est activée }
        '404': { description: Ligne de barème introuvable dans cet établissement }
        '409':
          description: La ligne a été modifiée par un autre utilisateur entre-temps
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /finance/fees/{id}/history:
    get:
      tags: [Finance]
      summary: Historique des modifications d'une ligne de barème
      description: Ancien montant, nouveau montant, auteur, date — du plus récent au plus ancien (Volume 1 §7.4).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Historique
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FeeHistoryEntry' }

  /finance/students/{studentId}/balance:
    get:
      tags: [Finance]
      summary: Solde à encaisser pour un élève (année scolaire active) — point d'entrée de la caisse
      description: >-
        Retrouve l'inscription de l'élève sur l'année scolaire ACTIVE et son solde. Lecture ouverte à
        tout rôle de l'école (composer/afficher un solde n'est pas un acte d'encaissement, règle #4).
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Solde de l'inscription active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentBalance' }
        '404': { description: Élève introuvable, ou aucune inscription sur l'année active }

  /finance/payments:
    post:
      tags: [Finance]
      summary: Encaisser un paiement (Directeur + Finance) — ticket JGK-F02
      description: >-
        Impute un versement sur le solde d'une inscription. Le montant dû (TotalDue) n'est jamais fourni
        ni modifié par le client (règles #4/#10) ; l'école vient du JWT. Verrou optimiste : deux
        encaissements concurrents sur le même solde ne peuvent pas s'écraser — le second reçoit 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentCreateRequest' }
      responses:
        '201':
          description: Paiement encaissé, numéro de reçu attribué
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResult' }
        '403': { description: Rôle non autorisé (écriture réservée à Directeur + Finance) }
        '404': { description: Inscription introuvable dans cet établissement }
        '409': { description: Encaissement concurrent — recharger le solde et réessayer }
        '422': { description: "Montant invalide, solde dépassé, inscription déjà soldée/annulée, ou aucune session de caisse ouverte pour l'utilisateur courant (voir /finance/sessions/open)" }

  /finance/sessions/current:
    get:
      tags: [Finance]
      summary: Session de caisse ouverte de l'utilisateur courant (Directeur + Finance)
      description: >-
        Renvoie null si l'utilisateur courant n'a aucune session ouverte. C'est ce que l'écran /caisse
        interroge avant toute tentative d'encaissement — POST /finance/payments refuse (422) tout
        versement hors d'une session ouverte (Volume 1 §15.1).
      responses:
        '200':
          description: Session ouverte, ou corps vide
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentCashierSession' }
        '403': { description: Rôle non autorisé (réservé à Directeur + Finance) }

  /finance/sessions/open:
    post:
      tags: [Finance]
      summary: Ouvrir une session de caisse (Directeur + Finance) — Volume 1 §15.1
      description: >-
        Un utilisateur ne peut avoir qu'une seule session ouverte à la fois (422 sinon). Le fonds de
        caisse initial déclaré ici sert de base au solde de fermeture théorique calculé à la clôture.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openingBalance]
              properties:
                openingBalance: { type: number, format: decimal, minimum: 0 }
      responses:
        '200':
          description: Identifiant de la session ouverte
          content:
            application/json:
              schema: { type: string, format: uuid }
        '403': { description: Rôle non autorisé }
        '422': { description: Cet utilisateur a déjà une session de caisse ouverte }

  /finance/sessions/{id}/close:
    post:
      tags: [Finance]
      summary: Clôturer une session de caisse (Directeur + Finance) — Volume 1 §15.2, JGK-F09
      description: >-
        Fige le solde de fermeture théorique (fonds initial + encaissements non annulés de la session,
        toutes méthodes) ET compare actualCashAmount aux ESPÈCES attendues (fonds initial + encaissements
        EN ESPÈCES uniquement — un virement, un chèque ou un mobile money ne transite jamais par le
        tiroir-caisse). Un écart non nul (manquant ou surplus) exige discrepancyReason, sinon 422 : la
        session reste ouverte tant qu'il n'est pas fourni. Une session close ne peut jamais être
        re-clôturée ni rouverte.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actualCashAmount]
              properties:
                actualCashAmount: { type: number, format: decimal, minimum: 0, description: "Espèces réellement comptées dans le tiroir-caisse." }
                discrepancyReason: { type: string, maxLength: 500, nullable: true, description: "Requis (422 sinon) dès que actualCashAmount diffère des espèces attendues." }
      responses:
        '200':
          description: Récapitulatif de clôture
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashierSessionClosingResult' }
        '403': { description: Rôle non autorisé }
        '404': { description: Session introuvable dans cet établissement }
        '422': { description: "Cette session est déjà fermée ou vérifiée, ou un écart de caisse a été constaté sans discrepancyReason" }

  /finance/sessions/{id}/closing-report:
    get:
      tags: [Finance]
      summary: Rapport de clôture de caisse en PDF (Directeur + Finance) — Volume 1 §15.2
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Rapport PDF (fonds initial, total encaissé, ventilation par mode et catégorie, détail des transactions)
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403': { description: Rôle non autorisé }
        '404': { description: Session introuvable dans cet établissement }

  /finance/payments/{id}/receipt:
    get:
      tags: [Finance]
      summary: Reçu de paiement (JSON) — lecture ouverte à tout rôle de l'école
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Données du reçu de paiement (montants figés à l'encaissement)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentReceipt' }
        '404': { description: Paiement introuvable dans cet établissement }

  /finance/payments/{id}/receipt/pdf:
    get:
      tags: [Finance]
      summary: Reçu de paiement officiel en PDF (JGK-F02)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Reçu PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { description: Paiement introuvable dans cet établissement }

  /finance/expenses:
    get:
      tags: [Finance]
      summary: Lister les dépenses
      responses:
        '200': { description: Liste des dépenses }
    post:
      tags: [Finance]
      summary: Enregistrer une dépense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCreateRequest' }
      responses:
        '201': { description: Dépense enregistrée }

  /finance/dashboard:
    get:
      tags: [Finance]
      summary: Indicateurs financiers (encaissé, solde dû, taux de recouvrement)
      responses:
        '200':
          description: Tableau de bord financier
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceDashboard' }

  /finance/employee-contracts:
    get:
      tags: [Finance]
      summary: Lister les contrats du personnel (Directeur, ou Finance) — Volume 1 §14.1
      description: >-
        Liste complète de l'établissement, actifs et clôturés confondus (`endDate` distingue les
        deux) — pas de pagination ni de filtre à ce jour.
      responses:
        '200':
          description: Liste des contrats
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EmployeeContract' } }
        '403': { description: Réservé au Directeur et à la Finance }
    post:
      tags: [Finance]
      summary: Créer un contrat (embauche) — Directeur, ou Finance
      description: >-
        Lié à un enseignant (`teacherId`) OU à un utilisateur non-enseignant (`userId`), jamais les
        deux ni aucun. Un contrat Permanent exige `baseSalary` > 0, un contrat Vacataire exige
        `hourlyRate` > 0. Une personne ne peut avoir qu'un seul contrat ACTIF à la fois (index
        partiel PostgreSQL, `endDate IS NULL`) — une tentative en double répond 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeContractCreateRequest' }
      responses:
        '201':
          description: Contrat créé (identifiant)
          content:
            application/json:
              schema: { type: string, format: uuid }
        '403': { description: Réservé au Directeur et à la Finance }
        '404': { description: Enseignant ou utilisateur introuvable }
        '409': { description: Cette personne a déjà un contrat actif }
        '422': { $ref: '#/components/responses/ValidationError' }

  /finance/employee-contracts/{id}:
    patch:
      tags: [Finance]
      summary: Avenant — réviser le salaire/taux/prime d'un contrat ACTIF, verrouillage optimiste
      description: >-
        Seule voie de modification des termes d'un contrat actif (le type de contrat n'est PAS
        modifiable ici : un changement de type est un nouveau contrat, pas un avenant). `reason`
        obligatoire (5 à 500 caractères), historisé dans EmployeeContractHistory
        (ChangeType=Amended). `rowVersion` (xmin) : 409 si le contrat a été modifié entre-temps —
        409 également si le contrat est déjà clôturé.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEmployeeContractRequest' }
      responses:
        '200':
          description: Contrat mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateEmployeeContractResult' }
        '403': { description: Réservé au Directeur et à la Finance }
        '404': { description: Contrat introuvable dans cet établissement }
        '409':
          description: Contrat déjà clôturé, ou modifié par un autre utilisateur entre-temps
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /finance/employee-contracts/{contractId}/suggested-hours:
    get:
      tags: [Finance]
      summary: Suggestion d'heures pour la paie du vacataire (ticket JGK-K01)
      description: >-
        Agrège hour-records du mois et le rapproche de l'emploi du temps planifié (ScheduleSlot).
        PUREMENT CONSULTATIF — n'écrit rien, ne modifie en rien POST /finance/payroll : la Direction
        pré-remplit hoursWorked avec suggestedHours côté client, l'ajuste si besoin, puis soumet la
        commande existante inchangée (Volume 1 §14.3 amendé).
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: month
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
        - name: year
          in: query
          required: true
          schema: { type: integer, minimum: 2000 }
      responses:
        '200':
          description: Suggestion et écarts éventuels
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuggestedPayrollHours' }
        '403': { description: Réservé au Directeur et à la Finance }
        '404': { description: Contrat introuvable dans cet établissement }

  /finance/employee-contracts/{id}/close:
    post:
      tags: [Finance]
      summary: Clôturer définitivement un contrat — Directeur, ou Finance
      description: >-
        Irréversible par conception (pas de « rouvrir » : une reprise crée un nouveau contrat).
        Historisé (ChangeType=Closed). Générer une nouvelle fiche de paie sur un contrat clôturé est
        ensuite refusé (409, garde-fou de paie) — la dernière fiche due doit être générée AVANT la
        clôture. `rowVersion` (xmin) : 409 si le contrat a été modifié entre-temps.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseEmployeeContractRequest' }
      responses:
        '200':
          description: Contrat clôturé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloseEmployeeContractResult' }
        '403': { description: Réservé au Directeur et à la Finance }
        '404': { description: Contrat introuvable dans cet établissement }
        '409':
          description: Contrat déjà clôturé, ou modifié par un autre utilisateur entre-temps
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reports/dashboard:
    get:
      tags: [Reports]
      summary: Tableau de bord analytique du Directeur (ticket JGK-R01)
      description: >-
        Agrège plusieurs modules : effectifs de l'année active (ventilés par genre), enseignants
        actifs, taux de présence du mois en cours ((Présents + Retards) / total des appels), et résumé
        de l'abonnement. Réservé au Directeur et au Super Admin. Les agrégats métier passent sous la
        policy RLS PostgreSQL — jamais de mélange entre deux écoles.
      responses:
        '200':
          description: Indicateurs du tableau de bord Directeur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorDashboard' }
        '403': { description: Réservé au Directeur et au Super Admin }

  /reports/attendance:
    get:
      tags: [Reports]
      summary: Rapport d'assiduité détaillé par classe et par élève (ticket JGK-R02)
      description: >-
        Agrège les fiches d'appel sur une période : taux moyen (global ou pour une classe) et, par
        élève, ses absences justifiées/non justifiées, ses retards, son cumul de minutes de retard et
        son taux de présence individuel ((Présents + Retards) / total de ses appels). Réservé au
        Directeur, au Secrétariat et au Super Admin. Le classId éventuel est validé comme appartenant à
        l'école courante (422 sinon). Les agrégats passent sous la policy RLS.
      parameters:
        - name: startDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: endDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: classId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Rapport d'assiduité paginé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceReport' }
        '403': { description: Réservé au Directeur, au Secrétariat et au Super Admin }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reports/attendance/by-subject:
    get:
      tags: [Reports]
      summary: Rapport d'assiduité par matière (Évolution N°5)
      description: >-
        Pour la période, une ligne par matière appelée : séances appelées (`sessions`), lignes d'appel, répartition
        des statuts et taux de présence ((Présents + Retards) / lignes — la formule du rapport par élève, inchangée).
        Mêmes filtres, mêmes rôles (Directeur, Secrétariat, Super Admin) et même garde de classe (422 si `classId`
        n'appartient pas à l'école courante) que `/reports/attendance`. Les agrégats passent sous la policy RLS.
      parameters:
        - name: startDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: endDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: classId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Une ligne par matière
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SubjectAttendanceReportRow' }
        '403': { description: Réservé au Directeur, au Secrétariat et au Super Admin }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reports/attendance/export:
    get:
      tags: [Reports]
      summary: Exporter le rapport d'assiduité en PDF ou CSV (ticket JGK-R03)
      description: >-
        Mêmes filtres et validation que /reports/attendance, plus un paramètre `format` (pdf ou csv).
        Renvoie un flux de fichier nommé dynamiquement, avec le type MIME adéquat. Réservé au Directeur,
        au Secrétariat et au Super Admin. Le classId éventuel est validé (⊂ tenant) ; les données
        transitent sous la policy RLS de l'école.
      parameters:
        - name: startDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: endDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: classId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [pdf, csv] }
      responses:
        '200':
          description: Fichier exporté (téléchargement)
          content:
            application/pdf:
              schema: { type: string, format: binary }
            text/csv:
              schema: { type: string, format: binary }
        '403': { description: Réservé au Directeur, au Secrétariat et au Super Admin }
        '422': { $ref: '#/components/responses/ValidationError' }

  /registration-requests:
    post:
      tags: [RegistrationRequests]
      summary: Soumettre une demande d'inscription self-service (formulaire public, Volume 1 §11.5)
      description: >-
        Anonyme. Anti-spam obligatoire (Volume 7 §Paiements) : limitation de débit par IP (429 au-delà)
        et honeypot (champ `website`, à laisser vide). Le mot de passe est haché immédiatement côté
        serveur et n'est jamais journalisé ni renvoyé. Répond 200 (et non 201) : la réponse est
        volontairement identique à celle d'une soumission piégée par le honeypot, pour ne donner aucun
        signal exploitable ; le suivi se fait ensuite par la référence retournée.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationRequestCreate' }
      responses:
        '200':
          description: Demande reçue, référence de suivi communiquée par email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationRequestCreated' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /registration-requests/{trackingReference}/status:
    get:
      tags: [RegistrationRequests]
      summary: Consulter l'état d'une demande sans authentification
      description: >-
        Anonyme. La référence de suivi fait office de secret d'accès de fait (aucune autre
        authentification n'existe encore pour cette demande) : la réponse ne renvoie donc que le strict
        minimum — jamais l'e-mail, le téléphone, l'adresse, l'effectif ou le plan déclarés. Limitation de
        débit par IP (429 au-delà), plus généreuse que la soumission : consulter son propre dossier peut
        légitimement se faire plusieurs fois.
      security: []
      parameters:
        - name: trackingReference
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Statut de la demande
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationRequestStatus' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /public/schools:
    get:
      tags: [PublicDirectory]
      summary: Annuaire public des établissements (B2C)
      description: >-
        Anonyme et en LECTURE SEULE. Ne liste que les établissements dont le Directeur a explicitement
        activé `isPubliclyListed` (faux par défaut) et dont le statut est actif : ni l'inscription, ni
        l'approbation, ni l'activation d'abonnement ne publient un établissement.
        Étanchéité garantie par la BASE, pas par ce contrôleur : (1) la RLS échoue en fermeture — une
        requête anonyme n'a pas de tenant, les policies des tables élèves/notes/paiements comparent leur
        SchoolId à NULL et ne renvoient aucune ligne ; (2) la vue `public_school_directory` fige les
        colonnes servies (ni NINEA, ni RCCM, ni statut, ni champs d'audit) et la condition de
        consentement ; (3) l'API Data Supabase est fermée, cet annuaire n'est joignable que par cette
        route. Limitation de débit par IP (429 au-delà).
      security: []
      parameters:
        - name: search
          in: query
          description: Recherche sur le nom de l'établissement (insensible à la casse)
          schema: { type: string, maxLength: 100 }
        - name: city
          in: query
          description: Filtre exact sur la ville
          schema: { type: string, maxLength: 120 }
        - name: region
          in: query
          description: Filtre exact sur la région
          schema: { type: string, maxLength: 120 }
        - name: cycle
          in: query
          description: >-
            Cycle proposé, en valeur brute de l'énumération (jamais le libellé accentué). Un cycle
            inconnu est rejeté en 422 plutôt que de produire un annuaire faussement vide.
          schema:
            type: string
            enum: [Primaire, College, Lycee, Maternelle]
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          description: Plafonné à 48 — cet endpoint est anonyme, la taille de page ne peut pas être dictée par l'appelant.
          schema: { type: integer, minimum: 1, maximum: 48, default: 12 }
      responses:
        '200':
          description: Page d'établissements consentants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedPublicSchools' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /public/schools/{schoolId}:
    get:
      tags: [PublicDirectory]
      summary: Fiche publique d'un établissement
      description: >-
        Anonyme. Un identifiant valide dont l'établissement n'a pas consenti (ou est suspendu/archivé)
        renvoie le MÊME 404 qu'un identifiant inexistant : un 403 confirmerait l'existence d'un
        établissement ayant précisément refusé sa publication.
      security: []
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Fiche de l'établissement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicSchool' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/registration-requests:
    get:
      tags: [RegistrationRequests]
      summary: Lister les demandes d'inscription (Super Admin)
      description: >-
        Réservé au Super Admin. Renvoie tout ce qui est utile à la revue (établissement, coordonnées du
        Directeur, plan souhaité) mais JAMAIS le hash du mot de passe.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [Pending, Approved, Rejected] }
      responses:
        '200':
          description: Liste des demandes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RegistrationRequestListItem' }
        '403': { description: Réservé au Super Admin }

  /admin/registration-requests/{id}/approve:
    post:
      tags: [RegistrationRequests]
      summary: Approuver — crée établissement + compte Directeur + abonnement AwaitingPayment (Super Admin)
      description: >-
        Réservé au Super Admin. Crée établissement (Active) + compte Directeur (Active, mot de passe déjà
        choisi à la soumission) + abonnement (AwaitingPayment) dans UNE transaction atomique : si l'un des
        trois échoue, aucun n'est créé et la demande reste Pending.
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Établissement créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationApprovalResult' }
        '403': { description: Réservé au Super Admin }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/registration-requests/{id}/reject:
    post:
      tags: [RegistrationRequests]
      summary: Rejeter une demande (Super Admin)
      description: Réservé au Super Admin. Le motif est obligatoire — il est communiqué au Directeur via le suivi public.
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        '204': { description: Demande rejetée }
        '403': { description: Réservé au Super Admin }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /subscriptions/{schoolId}/payments:
    get:
      tags: [Payments]
      summary: Historique des paiements d'abonnement de l'établissement (Directeur)
      description: >-
        Ticket JGK-I07. Le statut/plan/échéance de l'abonnement voyagent dans la même réponse que
        l'historique paginé — l'écran "Facturation & Historique" n'a besoin que d'un seul appel.
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Statut de l'abonnement et historique paginé des paiements
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedSubscriptionPayments' }
        '403': { description: Réservé au Directeur, ou établissement de l'URL différent de celui de la session }
        '404': { description: Aucun abonnement associé à cet établissement }
    post:
      tags: [Payments]
      summary: Initier un paiement d'abonnement (Mobile Money, virement, carte)
      description: >-
        Ticket JGK-I05, réservé au Directeur. Le montant est calculé serveur (plan × période choisie),
        jamais fourni par le client. Réponse 200 (et non 201) : la ligne SubscriptionPayment créée est
        consultable via GET /subscriptions/{schoolId}/payments (JGK-I07) — même choix que l'approbation
        d'inscription (JGK-I03), qui crée pourtant un établissement entier et répond 200 aussi. Route
        explicitement exemptée du mode restreint AwaitingPayment (JGK-I04) : c'est la seule voie de sortie.
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionPaymentInitiateRequest' }
      responses:
        '200':
          description: Session de paiement créée — URL de redirection agrégateur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionPaymentInitiateResult' }
        '403': { description: Réservé au Directeur, ou établissement de l'URL différent de celui de la session }
        '404': { description: Aucun abonnement associé à cet établissement }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502': { description: L'agrégateur de paiement a refusé la demande ou est injoignable }

  /subscriptions/validate-promo:
    post:
      tags: [Subscriptions]
      summary: Prévisualiser un code promo sur l'abonnement courant (Directeur)
      description: >-
        Aperçu seul : un code invalide/expiré/épuisé répond 200 avec `isValid: false` et un message,
        pas une erreur — c'est une saisie en cours de frappe, pas une transaction. Le même calcul
        (PromoCodeDiscountCalculator) est réappliqué, indépendamment, au moment réel du paiement
        (POST /subscriptions/{schoolId}/payments) : cette route ne réserve ni ne consomme l'usage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidatePromoCodeRequest' }
      responses:
        '200':
          description: Résultat de la prévisualisation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidatePromoCodeResult' }
        '403': { description: Réservé au Directeur }
        '404': { description: Aucun abonnement associé à votre établissement }

  /webhooks/payments/{provider}:
    post:
      tags: [Payments]
      summary: Callback de l'agrégateur de paiement (PayDunya/CinetPay) — signature vérifiée obligatoirement, voir docs/Volume_7_Security.md §12bis
      description: >-
        Ticket JGK-I06. Double vérification avant toute écriture : (1) signature du corps du webhook,
        rejetée en 401 si absente/invalide ; (2) appel IPN serveur à serveur vers l'agrégateur (avec nos
        propres clés) pour connaître le statut RÉEL et le montant RÉELLEMENT payé — le corps du webhook
        lui-même n'est jamais la source de vérité (AGENTS.md règle #11). Idempotent : un second appel
        pour une référence déjà traitée répond 200 sans rien ré-écrire. Le corps peut être en
        `application/x-www-form-urlencoded` (format par défaut des IPN PayDunya) ou JSON.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [paydunya, cinetpay] }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, description: "Payload brut spécifique à l'agrégateur, stocké tel quel (aplati en JSON) dans WebhookPayloadRaw" }
          application/json:
            schema: { type: object, description: "Payload brut spécifique à l'agrégateur, stocké tel quel dans WebhookPayloadRaw" }
      responses:
        '200': { description: "Webhook traité (ou déjà traité — réponse identique, idempotence)" }
        '401': { description: Signature invalide — webhook rejeté et journalisé }
        '404': { description: "Agrégateur non pris en charge, ou référence de paiement inconnue" }
        '502': { description: "L'agrégateur n'a pas pu être contacté pour la vérification IPN" }

  /subscriptions/{schoolId}:
    get:
      tags: [Subscriptions]
      summary: Consulter l'abonnement d'un établissement (Super Admin)
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200': { description: Détail de l'abonnement }
    patch:
      tags: [Subscriptions]
      summary: Modifier le plan ou la date d'expiration (Super Admin)
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionUpdateRequest' }
      responses:
        '200': { description: Abonnement mis à jour }

  /sms/history:
    get:
      tags: [Notifications]
      summary: Historique des SMS envoyés (Directeur, ou Finance) — formule Premium
      description: >-
        Réservé aux établissements avec Feature.SmsNotifications (formule Premium, AGENTS.md). Inclut
        le solde de crédits restant et le nombre de messages encore en file (`pendingCount`) — les
        envois sont mis en file d'attente (SmsQueueHostedService), jamais synchrones.
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Historique paginé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedSmsHistory' }
        '403': { description: "Réservé au Directeur et à la Finance, ou formule sans SMS" }

  /sms/dues-reminders:
    post:
      tags: [Notifications]
      summary: Envoyer une relance SMS de solde impayé (Directeur, ou Finance) — formule Premium
      description: >-
        Met en file un SMS par élève débiteur (établissement entier si `classroomId` omis). Chaque
        message débite immédiatement le crédit SMS de l'établissement ; un solde insuffisant fait
        compter l'élève dans `skippedCount` plutôt que d'échouer toute la relance.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendDuesRemindersRequest' }
      responses:
        '200':
          description: Relance mise en file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuesReminderSmsResult' }
        '403': { description: "Réservé au Directeur et à la Finance, ou formule sans SMS" }

  /webhooks/sms/{provider}:
    post:
      tags: [Notifications]
      summary: Accusé de livraison SMS de l'agrégateur (Infobip) — signature HMAC-SHA256 obligatoire
      description: >-
        Même principe que /webhooks/payments/{provider} : AllowAnonymous, sécurité entièrement dans la
        vérification de signature du corps brut (en-tête `X-Signature`, HMAC-SHA256 avec
        `SmsOptions.WebhookSecret`, comparaison à temps constant). Idempotent — un accusé déjà appliqué
        n'est pas retraité.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, example: Infobip }
        - name: X-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "Payload brut de l'agrégateur (format DLR Infobip)" }
      responses:
        '200':
          description: Accusé traité (ou déjà traité — idempotence)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmsDeliveryReceiptResult' }
        '401': { description: Signature absente ou invalide }

  # ---------------------------------------------------------------- Module Inventaire
  # Patrimoine, journal de stock et prêts de matériel. Voir docs/Volume_4_API_Design.md §21.
  #
  # Deux invariants portés par TOUS les endpoints ci-dessous :
  #   * aucune quantité ne se modifie hors d'un mouvement journalisé — PUT /inventory/items ne les
  #     expose même pas ;
  #   * le journal (/inventory/movements) est append-only : ni PUT, ni DELETE, par construction.

  /inventory/categories:
    get:
      tags: [Inventory]
      summary: Lister les familles de biens de l'établissement
      description: >-
        Ouvert à tout utilisateur authentifié. L'établissement est déduit du JWT : il n'est jamais un
        paramètre. Pas de pagination — une école n'a pas assez de familles de biens pour la justifier.
      responses:
        '200':
          description: Liste des catégories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InventoryCategory' }
    post:
      tags: [Inventory]
      summary: Créer une famille de biens (nomenclature libre, sans liste figée)
      description: 'Réservé au Directeur et au Secrétariat.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryCategoryCreateRequest' }
      responses:
        '201':
          description: Catégorie créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryCategory' }
        '403': { description: Réservé au Directeur et au Secrétariat }
        '409': { description: Une catégorie de ce nom existe déjà dans cet établissement }
        '422': { $ref: '#/components/responses/ValidationError' }

  /inventory/categories/{id}:
    put:
      tags: [Inventory]
      summary: Corriger le libellé ou la description d'une catégorie
      description: 'Réservé au Directeur et au Secrétariat. Verrou optimiste (rowVersion).'
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryCategoryUpdateRequest' }
      responses:
        '200':
          description: Catégorie mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryCategory' }
        '403': { description: Réservé au Directeur et au Secrétariat }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Jeton de concurrence périmé, ou libellé déjà pris' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Inventory]
      summary: Archiver (soft delete) une catégorie créée par erreur
      description: >-
        Réservé au Directeur et au Secrétariat. Refusée en 409 si des biens y sont encore rattachés
        (AGENTS.md règle #6 : jamais de suppression physique).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: rowVersion
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Catégorie archivée }
        '403': { description: Réservé au Directeur et au Secrétariat }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Jeton de concurrence périmé, ou des biens sont rattachés à cette catégorie' }

  /inventory/items:
    get:
      tags: [Inventory]
      summary: Lister le patrimoine (lots de biens), filtrable et paginé
      description: >-
        Ouvert à tout utilisateur authentifié. Un « bien » est un LOT : le suivi à l'unité se fait avec
        un lot de quantité 1 (un PC avec son numéro de série), le suivi en masse avec un lot de
        quantité 200 (des tables-bancs). `onLoanQuantity` est calculé (total − disponible).
      parameters:
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: roomId
          in: query
          description: Salle d'entreposage (module Infrastructures)
          schema: { type: string, format: uuid }
        - name: condition
          in: query
          schema: { $ref: '#/components/schemas/ItemCondition' }
        - name: search
          in: query
          description: Recherche insensible à la casse sur la désignation ET le code d'inventaire
          schema: { type: string }
        - name: outOfStockOnly
          in: query
          description: >-
            Ne garder que les lots dont il ne reste RIEN de disponible. Nommé sans ambiguïté : le
            modèle ne porte aucun seuil de réapprovisionnement, un filtre « stock bas » laisserait
            croire le contraire.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page de biens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedInventoryItems' }
    post:
      tags: [Inventory]
      summary: Créer un lot de biens
      description: >-
        Réservé au Directeur et au Secrétariat. `initialQuantity` est la SEULE occasion de fixer une
        quantité directement, et elle ne contourne pas le journal : le serveur la traduit en un
        mouvement d'entrée dans la même transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryItemCreateRequest' }
      responses:
        '201':
          description: Bien créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryItemResult' }
        '403': { description: Réservé au Directeur et au Secrétariat }
        '409': { description: Ce code d'inventaire est déjà utilisé dans cet établissement }
        '422': { $ref: '#/components/responses/ValidationError' }

  /inventory/items/{id}:
    get:
      tags: [Inventory]
      summary: Fiche d'un bien, ses 20 derniers mouvements et ses prêts en cours
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Fiche détaillée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryItemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Inventory]
      summary: Corriger la fiche d'un bien (jamais ses quantités)
      description: >-
        Réservé au Directeur et au Secrétariat. Verrou optimiste (rowVersion). Aucune quantité n'est
        modifiable ici : elles ne varient que par un mouvement journalisé ou par une fiche de prêt.
        Basculer un bien en consommable est refusé en 409 tant que des prêts sont en cours.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryItemUpdateRequest' }
      responses:
        '200':
          description: Bien mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryItemResult' }
        '403': { description: Réservé au Directeur et au Secrétariat }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Jeton périmé, code déjà pris, ou prêts en cours sur un bien passé en consommable' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Inventory]
      summary: Archiver (soft delete) un bien
      description: >-
        Réservé au Directeur et au Secrétariat. Refusé en 409 si des prêts sont encore en cours : la
        décharge signée par le bénéficiaire n'aurait plus de bien en face. Le journal de stock du lot,
        lui, n'est jamais effacé.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: rowVersion
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Bien archivé }
        '403': { description: Réservé au Directeur et au Secrétariat }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Jeton de concurrence périmé, ou des prêts de ce bien sont en cours' }

  /inventory/movements:
    get:
      tags: [Inventory]
      summary: Journal de stock de l'établissement, filtrable et paginé
      description: >-
        Ouvert à tout utilisateur authentifié. Journal APPEND-ONLY : il n'existe volontairement ni PUT
        ni DELETE sur un mouvement. Le rôle applicatif PostgreSQL n'a d'ailleurs que SELECT et INSERT
        sur cette table — la base refuse physiquement la rature.
      parameters:
        - name: itemId
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/StockMovementType' }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page du journal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedStockMovements' }
    post:
      tags: [Inventory]
      summary: Enregistrer une entrée, une sortie, un ajustement ou une mise au rebut
      description: >-
        Réservé au Directeur, au Secrétariat et au Surveillant. `rowVersion` est le jeton du BIEN, pas
        du mouvement : c'est lui dont les compteurs changent. Une sortie supérieure au disponible est
        refusée en 422 ; une lecture périmée du bien en 409 (AGENTS.md règle #5).


        Les mouvements d'attribution et de restitution ne sont PAS saisissables ici : ils sont produits
        exclusivement par les endpoints de prêt, pour qu'aucun appel direct ne puisse faire varier le
        disponible sans la fiche de décharge qui l'explique.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockMovementCreateRequest' }
      responses:
        '201':
          description: Mouvement enregistré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockMovementResult' }
        '403': { description: Réservé au Directeur, au Secrétariat et au Surveillant }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Jeton de concurrence du bien périmé }
        '422': { description: 'Quantité insuffisante, date future, ou ajustement sans écart' }

  /inventory/assignments:
    get:
      tags: [Inventory]
      summary: Lister les prêts et attributions de matériel
      description: >-
        Ouvert à tout utilisateur authentifié — c'est l'écran « qui détient quoi ». `overdueOnly`
        répond à la seule question urgente en fin d'année : quels manuels ne sont pas revenus.
      parameters:
        - name: itemId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AssignmentStatus' }
        - name: studentId
          in: query
          schema: { type: string, format: uuid }
        - name: teacherId
          in: query
          schema: { type: string, format: uuid }
        - name: overdueOnly
          in: query
          description: Prêts encore ouverts dont la date de retour prévue est dépassée
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page de fiches de prêt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedItemAssignments' }
    post:
      tags: [Inventory]
      summary: Prêter ou attribuer des unités d'un bien à un élève, un enseignant ou un agent
      description: >-
        Réservé au Directeur, au Secrétariat et au Surveillant. Crée la fiche de décharge ET le
        mouvement d'attribution dans la même transaction. Un consommable est refusé en 422 : il se
        distribue par une sortie de stock, il ne se prête pas. `rowVersion` est le jeton du BIEN.


        L'API expose UN couple (beneficiaryType, beneficiaryId) là où la base porte trois clés
        étrangères distinctes : le client n'a pas à savoir dans quelle table vit son bénéficiaire.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemAssignmentCreateRequest' }
      responses:
        '201':
          description: Fiche de prêt créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemAssignmentResult' }
        '403': { description: Réservé au Directeur, au Secrétariat et au Surveillant }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Jeton de concurrence du bien périmé }
        '422': { description: 'Quantité insuffisante, bénéficiaire inconnu, consommable, ou dates incohérentes' }

  /inventory/assignments/{id}/return:
    post:
      tags: [Inventory]
      summary: Enregistrer une restitution, totale ou partielle
      description: >-
        Réservé au Directeur, au Secrétariat et au Surveillant. Appelable plusieurs fois sur la même
        fiche tant qu'elle n'est pas clôturée : `returnedQuantity` est ce qui est rendu CE JOUR-LÀ, le
        serveur cumule.


        Un retour en `HorsService` réforme la part rendue au lieu de la remettre en circulation (deux
        lignes au journal : la restitution, puis la mise au rebut). `declareRemainderLost` sort du
        patrimoine ce qui n'est pas revenu et clôture la fiche.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemReturnRequest' }
      responses:
        '200':
          description: Restitution enregistrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemReturnResult' }
        '403': { description: Réservé au Directeur, au Secrétariat et au Surveillant }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Fiche déjà clôturée, ou jeton de concurrence périmé' }
        '422': { description: 'Plus d''unités rendues qu''il n''en restait, ou dates incohérentes' }

  /inventory/assignments/{id}:
    delete:
      tags: [Inventory]
      summary: Annuler une fiche de prêt saisie par erreur
      description: >-
        Réservé au Directeur, au Secrétariat et au Surveillant. Rend au disponible les unités que la
        fiche avait retirées, par un mouvement de contre-passation dont le motif dit « annulation » —
        et non un faux retour, qui laisserait croire à la lecture du journal qu'un bien est passé entre
        les mains d'un élève. Refusée en 409 dès qu'une restitution a été enregistrée.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: rowVersion
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Fiche annulée }
        '403': { description: Réservé au Directeur, au Secrétariat et au Surveillant }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Jeton périmé, ou fiche déjà restituée/perdue' }

  /inventory/assignments/{id}/pdf:
    get:
      tags: [Inventory]
      summary: Fiche de décharge / prêt de matériel (PDF A5 paysage)
      description: >-
        Le papier que le bénéficiaire signe en recevant des manuels ou du matériel, ou sa
        réimpression. Ouvert à tout utilisateur authentifié. Même charte que le reçu de caisse et
        l'attestation d'inscription (deux volets par feuille A4), avec QR code de vérification.
        Le nom du bénéficiaire est figé à l'affectation : une décharge réimprimée est identique à
        celle qui a été signée.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: PDF de la décharge (Content-Disposition inline)
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /inventory/reports/global/pdf:
    get:
      tags: [Inventory]
      summary: Fiche d'inventaire global de l'établissement (PDF A4 paysage)
      description: >-
        Réservé au Directeur et au Secrétariat. Le document qu'une école présente à la mairie ou à
        l'IEF : les lots groupés par catégorie, avec sous-totaux, disponibles, prêtés et valorisation.
        La colonne de valorisation ne s'imprime que si au moins un prix indicatif a été saisi — sinon
        elle annoncerait un patrimoine à 0 FCFA, ce qui serait faux. Opération journalisée à l'audit.
      parameters:
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: roomId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: PDF de la fiche d'inventaire (Content-Disposition inline)
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403': { description: Réservé au Directeur et au Secrétariat }

  # Dossiers d'examens officiels (CFEE/BFEM/BAC) — Volume_4_API_Design.md §22 :
  #   * le numéro de table n'est écrit que par POST .../assign-center, jamais à la création du dossier ;
  #   * un dossier Incomplet ne peut ni être transmis, ni entrer dans un export ou un lot d'impression ;
  #   * classroomId est figé à l'ouverture du dossier, non modifiable par PUT.
  /exams/sessions:
    get:
      tags: [Exams]
      summary: Sessions d'examen de l'école
      parameters:
        - name: schoolYearId
          in: query
          schema: { type: string, format: uuid }
        - name: examType
          in: query
          schema: { $ref: '#/components/schemas/ExamType' }
      responses:
        '200':
          description: Liste des sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExamSession' }
    post:
      tags: [Exams]
      summary: Créer une session d'examen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamSessionCreateRequest' }
      responses:
        '201':
          description: Session créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamSession' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /exams/sessions/{id}:
    put:
      tags: [Exams]
      summary: Corriger le centre par défaut ou le statut d'une session
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamSessionUpdateRequest' }
      responses:
        '200':
          description: Session mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamSession' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Verrou optimiste expiré (rowVersion périmé) }

  /exams/sessions/{id}/dispatch-convocations:
    post:
      tags: [Exams]
      summary: Dispatch en lot des convocations par SMS/WhatsApp
      description: >-
        Réutilise le canal de notification existant (Feature.SmsNotifications, Volume 1 §13) —
        aucun nouveau canal. Refusé tant qu'un dossier du lot n'a pas de centre/numéro de table.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Dispatch accepté, traitement asynchrone
        '409': { description: Un ou plusieurs dossiers du lot sans centre/numéro de table attribués }
        '403': { description: Formule d'abonnement sans Feature.SmsNotifications }

  /exams/dossiers:
    get:
      tags: [Exams]
      summary: Dossiers de candidature, paginés
      description: >-
        Ouvert au Directeur, au Secrétariat, et — depuis JGK-J08 — à l'Enseignant, dont la liste est
        alors restreinte aux dossiers des classes où il a une affectation active (TeacherAssignments,
        année scolaire active). Un classroomId explicite hors de cette portée est refusé (403).
      parameters:
        - name: examSessionId
          in: query
          schema: { type: string, format: uuid }
        - name: classroomId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ExamDossierStatus' }
        - name: search
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page de dossiers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedExamDossiers' }
        '403': { description: "Enseignant demandant un classroomId hors de ses classes assignées (JGK-J08)" }
    post:
      tags: [Exams]
      summary: Ouvrir un dossier de candidature
      description: >-
        classroomId est figé à la création : un transfert de classe ultérieur de l'élève
        ne modifie jamais un dossier déjà ouvert (Volume 1 §22.1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamDossierCreateRequest' }
      responses:
        '201':
          description: Dossier créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamDossierResult' }
        '409': { description: Un dossier existe déjà pour cet élève sur cette session }
        '422': { $ref: '#/components/responses/ValidationError' }

  /exams/dossiers/audit:
    get:
      tags: [Exams]
      summary: Dossiers incomplets d'une session, avec le détail de ce qui manque
      parameters:
        - name: examSessionId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Liste d'audit
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExamDossierAuditEntry' }

  /exams/dossiers/candidate-forms/pdf:
    post:
      tags: [Exams]
      summary: Impression par lot des fiches de candidature (PDF)
      description: >-
        Le lot ne contient que des dossiers Complet ou Transmis — un dossier Incomplet
        est silencieusement exclu, jamais imprimé par erreur (Volume 1 §22.5).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamCandidateFormBatchRequest' }
      responses:
        '200':
          description: PDF multi-page (une fiche par dossier retenu)
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /exams/dossiers/{id}:
    get:
      tags: [Exams]
      summary: Fiche complète d'un dossier
      description: >-
        Ouvert au Directeur, au Secrétariat, et — depuis JGK-J08 — à l'Enseignant pour un dossier
        d'une classe où il a une affectation active. Une URL tapée directement sur un dossier hors de
        cette portée renvoie 403, jamais 404 : un dossier porte des données d'état civil sensibles,
        pas un simple silence sur son existence.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Dossier
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamDossierDetail' }
        '403': { description: "Enseignant sans affectation active sur la classe du dossier (JGK-J08)" }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Exams]
      summary: Corriger l'état civil ou le centre déclaré
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamDossierUpdateRequest' }
      responses:
        '200':
          description: Dossier mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamDossierResult' }
        '409': { description: Verrou optimiste expiré (rowVersion périmé) }

  /exams/dossiers/{id}/assign-center:
    post:
      tags: [Exams]
      summary: Attribuer centre d'examen et numéro de table
      description: >-
        Le numéro de table est généré dans CETTE transaction, jamais à l'ouverture du
        dossier — même contrat que le matricule (AGENTS.md règle #3).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignExamCenterRequest' }
      responses:
        '200':
          description: Centre et numéro de table attribués
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamDossierResult' }
        '409': { description: Verrou optimiste expiré, ou numéro de table déjà pris par un autre dossier de la session }

  /exams/dossiers/{id}/transmit:
    post:
      tags: [Exams]
      summary: Marquer un dossier comme transmis à l'IEF/l'IA
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Dossier transmis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamDossierResult' }
        '409':
          description: Dossier Incomplet — conflit avec l'état actuel, voir GET /exams/dossiers/audit pour le détail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /exams/dossiers/{id}/result:
    put:
      tags: [Exams]
      summary: Saisir le résultat et la mention à la délibération
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamResultRequest' }
      responses:
        '200':
          description: Résultat enregistré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamResult' }

  /exams/dossiers/{id}/candidate-form/pdf:
    get:
      tags: [Exams]
      summary: Fiche de candidature individuelle (PDF)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: PDF de la fiche de candidature (Content-Disposition inline)
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /exams/dossiers/{id}/convocation/pdf:
    get:
      tags: [Exams]
      summary: Carte de convocation individuelle (PDF)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: PDF de la convocation (Content-Disposition inline)
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Centre ou numéro de table non encore attribués }

  /exams/statistics:
    get:
      tags: [Exams]
      summary: Taux de réussite par série/classe, comparaison interannuelle
      parameters:
        - name: schoolYearId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Statistiques agrégées
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamStatistics' }

  /exams/export/ministerial:
    get:
      tags: [Exams]
      summary: Export Excel/CSV conforme au relevé IEF/IA
      parameters:
        - name: examSessionId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Fichier d'export (Content-Disposition attachment)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  /parent-summons:
    get:
      tags: [VieScolaire]
      summary: Liste des convocations de parent/tuteur (Directeur, Surveillant, SuperAdmin) — Volume 1 §18.2, Volume 4 §16
      description: >-
        Liste complète de l'établissement, toutes suites confondues — pas de pagination ni de filtre à
        ce jour. Les convocations SANS suite (`status: Scheduled`) remontent en tête, la plus ancienne
        d'abord : ce sont les seules sur lesquelles il reste quelque chose à faire ; un tri purement
        chronologique enterrerait une convocation oubliée d'octobre sous les entretiens déjà clos de
        juin.
      responses:
        '200':
          description: Liste des convocations
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ParentSummons' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [VieScolaire]
      summary: Convoquer un parent/tuteur (Directeur, Surveillant, SuperAdmin) — Volume 1 §18.2
      description: >-
        Motif libre, distinct d'une sanction disciplinaire (voir /discipline) : cette convocation ne
        crée aucun accès portail, elle n'est qu'un document interne imprimé ou envoyé (règle de non
        régression du §13, reporté en V3). La suite de l'entretien se consigne séparément, une fois
        celui-ci tenu, via `PATCH /parent-summons/{id}/outcome` — pas ici.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParentSummonsCreateRequest' }
      responses:
        '201':
          description: Convocation créée (identifiant)
          content:
            application/json:
              schema: { type: string, format: uuid }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Élève introuvable dans l'établissement courant }
        '422': { $ref: '#/components/responses/ValidationError' }

  /parent-summons/{id}/outcome:
    patch:
      tags: [VieScolaire]
      summary: Consigner la suite d'une convocation de parent (Directeur + Surveillant + SuperAdmin) — Volume 1 §18.2, Volume 4 §16
      description: >-
        Consigne l'issue de l'entretien : le parent s'est présenté (Honored), ne s'est pas présenté
        (Missed), ou l'entretien est reporté (Postponed). La suite se pose UNE SEULE FOIS, et
        seulement depuis l'état de départ Scheduled : une convocation déjà close repart en 422, jamais
        en écrasement silencieux. La correction consiste à émettre une NOUVELLE convocation, qui
        laisse les deux traces — le registre de la Vie scolaire vaut par son intégrité, exactement
        comme le registre disciplinaire (règle #6).
        outcomeNotes est OBLIGATOIRE pour Missed et Postponed (une absence ou un report appellent une
        suite écrite) et facultatif pour Honored : même arbitrage que discrepancyReason à la clôture
        de caisse, qui n'exige un motif que lorsqu'un écart existe réellement.
        L'avis PDF (/parent-summons/{id}/notice/pdf) reste le document remis AVANT l'entretien ; il ne
        porte donc jamais la suite, qui n'existe pas encore au moment où on l'imprime.
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant de la convocation — lu depuis la route, jamais depuis le corps.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParentSummonsOutcomeRequest' }
      responses:
        '200':
          description: Suite consignée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParentSummonsOutcomeResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Convocation introuvable dans cet établissement }
        '422':
          description: >-
            outcome vaut Scheduled (état de départ, pas une suite), outcomeNotes manque alors que la
            suite est Missed ou Postponed, ou la suite de cette convocation est déjà consignée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /parent-summons/{id}/notice:
    get:
      tags: [VieScolaire]
      summary: Avis de convocation — données (aperçu à l'écran avant impression) — Volume 4 §18, doc n°3
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Avis de convocation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParentNotice' }
        '404': { $ref: '#/components/responses/NotFound' }

  /parent-summons/{id}/notice/pdf:
    get:
      tags: [VieScolaire]
      summary: Avis de convocation — PDF officiel (en-tête M.E.N. + QR code) — Volume 4 §18, doc n°3
      description: >-
        Document remis AVANT l'entretien : il ne porte jamais la suite (Honored/Missed/Postponed), qui
        n'existe pas encore au moment où on l'imprime — voir PATCH /parent-summons/{id}/outcome.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Le PDF (Content-Disposition inline)
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { description: Convocation introuvable, ou PDF généré vide }

  /class-journal:
    get:
      tags: [ClassJournal]
      summary: Cahier de texte — liste paginée des entrées de journal (Directeur, Secrétariat, Surveillant, Enseignant) — ticket JGK-P04
      description: >-
        Document pédagogique PARTAGÉ, pas un carnet privé par enseignant : lecture ouverte sans
        restriction de périmètre à tout rôle listé, y compris l'Enseignant, qui voit les entrées de
        ses collègues. `canEdit` (par ligne) est calculé côté serveur (GetClassJournalQueryHandler) —
        l'écran s'en sert pour masquer Modifier/Supprimer, la vraie garde restant PUT/DELETE.
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: classroomId
          in: query
          schema: { type: string, format: uuid }
        - name: subjectId
          in: query
          schema: { type: string, format: uuid }
        - name: periodStart
          in: query
          schema: { type: string, format: date }
        - name: periodEnd
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Page d'entrées
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedClassJournalEntries' }
    post:
      tags: [ClassJournal]
      summary: Journaliser une séance (Enseignant seul, sur son propre créneau) — ticket JGK-P04
      description: >-
        L'auteur (`teacherId`) vient du compte courant, jamais du corps de la requête. Refusée en 409
        (code `SCHEDULE_SLOT_NOT_PLANNED`) si l'enseignant n'est pas affecté à cette classe/matière
        pour l'année active, OU si aucun `ScheduleSlot` n'existe pour ce jour de la semaine — les DEUX
        conditions sont vérifiées, `ScheduleSlot` ne portant aucune année scolaire (créneau
        hebdomadaire récurrent, jamais daté). `sessionDate` dans le futur est refusée en 422 : on
        journalise ce qui a été fait, jamais un programme prévisionnel.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassJournalEntryCreateRequest' }
      responses:
        '201':
          description: Entrée créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassJournalEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Aucune affectation ou aucun créneau planifié pour cette classe/matière/date (code `SCHEDULE_SLOT_NOT_PLANNED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /class-journal/{id}:
    put:
      tags: [ClassJournal]
      summary: Corriger une entrée — sujet/contenu/devoirs seulement (Enseignant, Directeur, Secrétariat) — ticket JGK-P04
      description: >-
        La classe, la matière et la date de séance ne sont jamais modifiables (une erreur sur ces
        champs se corrige en supprimant l'entrée puis en en créant une nouvelle). Librement
        modifiable par son auteur pendant 15 jours après `sessionDate` ; passé ce délai, seuls
        Directeur et Secrétariat peuvent corriger (403 sinon pour l'auteur, même esprit que la règle
        #4 Finance — AGENTS.md). La correction est HISTORISÉE (journal d'audit), qu'elle vienne de
        l'auteur ou d'un rôle élevé.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassJournalEntryUpdateRequest' }
      responses:
        '200':
          description: Entrée corrigée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassJournalEntry' }
        '403':
          description: >-
            Le délai de 15 jours est dépassé pour l'auteur, ou l'appelant n'est pas l'auteur de cette
            entrée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: RowVersion périmé (la fiche a été modifiée entre-temps) }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [ClassJournal]
      summary: Archiver une entrée (soft delete) — même garde des 15 jours qu'en modification — ticket JGK-P04
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: rowVersion
          in: query
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Entrée archivée }
        '403': { description: Délai de 15 jours dépassé, ou entrée d'un autre enseignant }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: RowVersion périmé }

  /quran/progress:
    get:
      tags: [Quran]
      summary: Historique de suivi de mémorisation d'un élève (Directeur, Enseignant, Secrétariat)
      description: >-
        Module Coran/Franco-Arabe — désactivé par défaut (403 `MODULE_DISABLED` tant que le Directeur
        n'a pas activé `isCoranModuleEnabled`).
      parameters:
        - name: studentId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Liste des observations
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/QuranProgress' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Quran]
      summary: Créer une observation de suivi coranique (Directeur, Enseignant)
      description: >-
        Aucune contrainte d'unicité : plusieurs observations pour le même élève/sourate sont
        légitimes au fil du temps. La commande est HISTORISÉE (journal d'audit).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuranProgressCreateRequest' }
      responses:
        '201':
          description: Observation créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuranProgress' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /quran/progress/classroom/{classroomId}:
    get:
      tags: [Quran]
      summary: Suivi coranique de tous les élèves d'une classe (Directeur, Enseignant, Secrétariat)
      parameters:
        - name: classroomId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Une ligne par élève, avec la liste de ses observations
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ClassQuranProgressRow' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /quran/progress/{id}:
    put:
      tags: [Quran]
      summary: Corriger une observation — statut/date/notes seulement (Directeur, Enseignant)
      description: >-
        Juz, Hizb, sourate et élève ne sont jamais modifiables (identité de la ligne, immuable).
        Correction HISTORISÉE (journal d'audit).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuranProgressUpdateRequest' }
      responses:
        '200':
          description: Observation corrigée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuranProgress' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: RowVersion périmé (la ligne a été modifiée entre-temps) }
        '422': { $ref: '#/components/responses/ValidationError' }

  /quran/evaluations:
    get:
      tags: [Quran]
      summary: Historique des évaluations orales d'un élève (Directeur, Enseignant, Secrétariat)
      parameters:
        - name: studentId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Liste des évaluations
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/QuranEvaluation' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Quran]
      summary: Enregistrer une évaluation orale de récitation (Directeur, Enseignant)
      description: Commande HISTORISÉE (journal d'audit), comme la saisie de notes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuranEvaluationCreateRequest' }
      responses:
        '201':
          description: Évaluation créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuranEvaluation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /quran/evaluations/classroom/{classroomId}:
    get:
      tags: [Quran]
      summary: Évaluations orales de tous les élèves d'une classe (Directeur, Enseignant, Secrétariat)
      parameters:
        - name: classroomId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Une ligne par élève, avec la liste de ses évaluations
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ClassQuranEvaluationRow' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /quran/evaluations/{id}:
    put:
      tags: [Quran]
      summary: Corriger une évaluation orale déjà saisie (Directeur, Enseignant)
      description: L'élève n'est jamais modifiable. Correction HISTORISÉE (journal d'audit).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuranEvaluationUpdateRequest' }
      responses:
        '200':
          description: Évaluation corrigée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuranEvaluation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: RowVersion périmé (la ligne a été modifiée entre-temps) }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageNumber:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    EntityId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: >
        Rôle insuffisant pour cette opération. Distinct de 401 (non authentifié) : le jeton est
        valide, mais le rôle qu'il porte n'ouvre pas cette route.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Erreur de validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Trop de requêtes (limitation de débit par IP)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    Role:
      type: string
      enum: [SuperAdmin, Directeur, Secretariat, Finance, Enseignant, Surveillant]

    ErrorResponse:
      type: object
      description: Format normalisé — voir docs/Volume_4_API_Design.md §0.4
      properties:
        code: { type: string, example: "VALIDATION_ERROR" }
        message: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              reason: { type: string }
        traceId: { type: string }

    AuthTokens:
      type: object
      description: >-
        Le refresh token ne figure PAS ici : il n'est délivré que dans le cookie HttpOnly
        `sama_ecole_refresh_token` (§1.1 du Volume 4). L'exposer aussi dans ce corps annulerait la
        protection — un script injecté (XSS) appellerait /auth/refresh, dont le cookie part
        automatiquement, et lirait le jeton dans la réponse.
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, example: 900 }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [Active, Suspended, Blocked] }
        schoolId: { type: string, format: uuid }

    UserCreateRequest:
      type: object
      required: [fullName, email, role, password]
      properties:
        fullName: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        password: { type: string, format: password }

    UserSummary:
      type: object
      description: Ligne de GET /users — isSelf est calculé côté serveur (confort d'affichage, l'API garde).
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [Active, Suspended, Blocked] }
        isSelf: { type: boolean }

    AuditLogEntry:
      type: object
      description: Ligne de GET /audit-logs (ticket JGK-H01).
      properties:
        id: { type: string, format: uuid }
        actorFullName: { type: string }
        module: { type: string, example: Finance }
        action: { type: string, example: RecordPayment }
        success: { type: boolean }
        failureReason: { type: string, nullable: true }
        ipAddress: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }

    PaginatedAuditLogs:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditLogEntry' } }
        totalCount: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    PlatformDashboardStats:
      type: object
      description: Ligne unique de la vue `v_platform_dashboard_stats` (GET /admin/platform/dashboard).
      properties:
        totalSchools: { type: integer }
        totalUsers: { type: integer }
        totalRevenue: { type: number, format: decimal, description: "Somme des paiements d'abonnement CONFIRMÉS uniquement (AGENTS.md règle #11)." }
        activeSubscriptions: { type: integer }
        mrr: { type: number, format: decimal, description: "Monthly Recurring Revenue — somme, sur les écoles à l'abonnement Active, du dernier paiement confirmé ramené à un équivalent mensuel (Yearly / 12)." }
        arr: { type: number, format: decimal, description: "Annual Recurring Revenue — MRR × 12." }
        forecastedRevenue30Days: { type: number, format: decimal, description: "Cashflow prévisionnel : somme des derniers paiements confirmés des écoles dont l'abonnement Active échoit dans les 30 prochains jours (ExpiresAt, pas un historique)." }
        arpu: { type: number, format: decimal, description: "Average Revenue Per User — MRR / nombre d'écoles à l'abonnement Active." }

    GlobalAuditLogItem:
      type: object
      description: Ligne de GET /admin/platform/activity — même nature que AuditLogEntry, avec l'établissement en plus.
      properties:
        id: { type: string, format: uuid }
        schoolId: { type: string, format: uuid }
        schoolName: { type: string }
        userId: { type: string, format: uuid }
        actorFullName: { type: string }
        module: { type: string, example: Finance }
        action: { type: string, example: RecordPayment }
        success: { type: boolean }
        failureReason: { type: string, nullable: true }
        ipAddress: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }

    PaginatedGlobalAuditLogs:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/GlobalAuditLogItem' } }
        totalCount: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    PlatformSubscription:
      type: object
      description: Ligne de GET /admin/platform/subscriptions — une école ayant un abonnement, avec son dernier paiement CONFIRMÉ le cas échéant.
      properties:
        schoolId: { type: string, format: uuid }
        schoolName: { type: string }
        plan: { type: string, enum: [Primaire, Standard, Premium] }
        status: { type: string, enum: [AwaitingPayment, Active, Suspended, ReadOnly] }
        expiresAt: { type: string, format: date, nullable: true }
        lastPaymentAmountXof: { type: number, format: decimal, nullable: true }
        lastPaymentAt: { type: string, format: date-time, nullable: true }
        lastPaymentBillingPeriod: { type: string, enum: [Monthly, Yearly], nullable: true, description: "Période de facturation du dernier paiement confirmé — alimente la colonne « Montant Contrat » de l'écran Abonnements & Facturation." }

    MonthlyRevenueProjection:
      type: object
      description: >-
        Un point de la courbe GET /admin/platform/revenue-projection : le cash attendu ce mois-là, basé
        sur les échéances RÉELLES des abonnements Active (pas une hypothèse de croissance).
      properties:
        month: { type: string, example: "2026-09", description: "Année-mois (yyyy-MM)." }
        projectedRevenue: { type: number, format: decimal }

    ImpersonateSchoolResult:
      type: object
      description: >-
        Même forme qu'AuthTokens à un champ près (expiresIn, pas de refresh token — voir la
        description de l'opération) : le client réutilise la même logique de session côté navigateur.
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: Durée de vie en secondes (~900, JwtOptions.AccessTokenMinutes). }
        schoolId: { type: string, format: uuid }
        schoolName: { type: string }

    SchoolCreateRequest:
      type: object
      required: [name, address, directorEmail]
      properties:
        name: { type: string }
        address: { type: string }
        phone: { type: string }
        directorEmail: { type: string, format: email }

    SchoolProfile:
      type: object
      description: >-
        Identité de l'établissement courant (nom, coordonnées, logo, mentions légales). Éditable par le
        Directeur, reprise dans l'en-tête du reçu d'inscription. `name` est obligatoire ; `logoUrl`,
        s'il est fourni, doit être une URL http(s).
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        address: { type: string, nullable: true, maxLength: 300 }
        phone: { type: string, nullable: true, maxLength: 30 }
        email: { type: string, nullable: true, format: email, maxLength: 150 }
        logoUrl: { type: string, nullable: true, format: uri, maxLength: 500 }
        ninea:
          type: string
          nullable: true
          maxLength: 50
          example: "005151978"
          description: >-
            Mention légale imprimée dans l'en-tête du reçu. Format LIBRE (la nomenclature officielle
            a déjà changé) : seule la longueur est bornée. Absent = la mention ne s'imprime pas.
        registreCommerce:
          type: string
          nullable: true
          maxLength: 50
          example: "SN DKR 2020 B 1234"
          description: 'RCCM — même usage et mêmes règles que `ninea`.'
        inspectionAcademie: { type: string, nullable: true, maxLength: 150 }
        inspectionEducationFormation: { type: string, nullable: true, maxLength: 150 }
        nomLycee:
          type: string
          nullable: true
          maxLength: 150
          description: Nom porté par l'en-tête du bulletin, SANS préfixe de cycle (ajouté à l'impression).
        isPubliclyListed: { type: boolean, default: false }
        city: { type: string, nullable: true, maxLength: 120 }
        region: { type: string, nullable: true, maxLength: 120 }
        publicDescription: { type: string, nullable: true, maxLength: 2000 }
        nationalSchoolCode:
          type: string
          nullable: true
          maxLength: 30
          description: >-
            Code établissement national (SIMEN, JGK-M05). Mis en majuscules à l'enregistrement,
            sans autre retouche. TANT QU'IL EST ABSENT, l'export Planète (GET
            /state-integration/planete/export) et la génération d'un IEN provisoire renvoient un 409.
        ministryAuthorizationNumber: { type: string, nullable: true, maxLength: 80 }
        schoolDistrictCode: { type: string, nullable: true, maxLength: 30 }
        gpsLatitude:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
          description: WGS84. À fournir AVEC gpsLongitude, ou pas du tout (422 sinon).
        gpsLongitude:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
        gpsCoordinates:
          type: string
          nullable: true
          readOnly: true
          example: "14.692800, -17.446700"
          description: >-
            Chaîne « lat, lon » calculée en culture invariante, pour l'affichage seul. Jamais
            persistée ni acceptée en écriture. Null si l'une des deux coordonnées manque.

    SchoolDataResetSummary:
      type: object
      description: >-
        Compte rendu d'une purge (POST /schools/current/reset-data) : ce qui a RÉELLEMENT été effacé,
        pour que le Directeur puisse le vérifier. Toutes les entrées sont renvoyées, y compris celles
        à zéro ligne.
      properties:
        totalRowsDeleted:
          type: integer
          example: 128
        entries:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
                description: Nom fonctionnel du domaine purgé.
                example: Élèves
              rowsDeleted:
                type: integer
                example: 42

    SchoolSettings:
      type: object
      description: >-
        Corps identique en GET et PUT /schools/current/settings. Les cinq champs `*SignatureUrl`/
        `officialStampUrl` (dont `surveillantSignatureUrl`) sont de simples URL (chaîne, 500
        caractères max) : le fichier lui-même transite par un endpoint de téléversement dédié
        (POST .../director-signature, etc.) qui renvoie l'URL à reporter ici.
      properties:
        gradingScale: { type: string, enum: ["10", "20"] }
        studentMatriculeFormat: { type: string, example: "ELEV-{YEAR}-{SEQ:4}" }
        teacherMatriculeFormat: { type: string, example: "ENS-{YEAR}-{SEQ:3}" }
        autoLogoutMinutes: { type: integer, default: 10 }
        dateFormat: { type: string, enum: ["dd/MM/yyyy", "dd MMMM yyyy"] }
        tuitionMonthsPerYear: { type: integer, default: 9, minimum: 1, maximum: 12, description: 'Mensualités facturées par an (JGK-E01).' }
        allowSecretaryToManageGrading:
          type: boolean
          default: false
          description: >-
            Délègue au Secrétariat la gestion du barème, des matières/coefficients et des mentions
            du bulletin (voir CanManageGradingScaleHandler). Fermé par défaut.
        allowFinanceToModifyFees:
          type: boolean
          default: false
          description: >-
            Délègue à la Finance le droit d'ajuster un montant de barème déjà défini
            (PUT /finance/fees/{id}), normalement réservé au Directeur (voir CanModifyFeesHandler).
            Fermé par défaut.
        allowFinanceToDeleteFees:
          type: boolean
          default: false
          description: >-
            Délègue à la Finance le droit de supprimer une catégorie de frais ou une ligne de
            barème (voir CanDeleteFeesHandler). Commutateur distinct du précédent : supprimer est un
            geste plus lourd de conséquences qu'ajuster un montant. Fermé par défaut.
        directorSignatureUrl:
          type: string
          nullable: true
          maxLength: 500
          description: Injectée sur le reçu d'inscription et le bulletin de notes.
        secretarySignatureUrl: { type: string, nullable: true, maxLength: 500 }
        cashierSignatureUrl:
          type: string
          nullable: true
          maxLength: 500
          description: Injectée sur le reçu d'inscription.
        officialStampUrl: { type: string, nullable: true, maxLength: 500 }
        surveillantSignatureUrl:
          type: string
          nullable: true
          maxLength: 500
          description: >-
            Injectée sur les documents de Vie Scolaire (billets d'entrée/sortie, fiches de
            discipline). Ajoutée par la migration AddSurveillantSignatureToSchoolSettings.
        typeEtablissement:
          type: string
          default: Prive
          description: "Format libre, aucune contrainte serveur au-delà de la longueur — imprimé sur les documents officiels."
        smsOnAttendanceAlert: { type: boolean, default: false, description: "Formule Premium (Feature.SmsNotifications)." }
        smsOnDuesReminder: { type: boolean, default: false }
        smsOnPaymentReceipt: { type: boolean, default: false }
        smsCreditBalance:
          type: integer
          default: 0
          readOnly: true
          description: >-
            Lecture seule — absent du corps envoyé en PUT (crédité uniquement par le Super Admin via
            POST /admin/platform/schools/{schoolId}/sms-credits).
        debtorReminderThresholdDays:
          type: integer
          default: 7
          description: Ancienneté minimale (jours) d'une créance avant qu'elle ne devienne relançable.
        gradeEditWindowDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 7
          description: >-
            Fenêtre de correction des notes par l'Enseignant, en jours depuis la saisie. Passé ce délai,
            seuls le Directeur et le Secrétariat corrigent (sans limite). Réglée par le Directeur seul.
        evaluationPeriodType:
          type: string
          enum: [Trimester, Semester, Custom]
          default: Trimester
          description: >-
            Découpage de l'année en périodes d'évaluation : 3 trimestres (défaut), 2 semestres, ou un
            nombre choisi (`customPeriodCount`). N'agit que sur les années créées ensuite ou rejouées via
            `POST /school-years/{id}/apply-evaluation-periods` — jamais sur une année déjà notée.
        customPeriodCount:
          type: integer
          minimum: 2
          maximum: 6
          default: 3
          description: Nombre de périodes quand `evaluationPeriodType` vaut `Custom` ; ignoré sinon.
        workingDays:
          type: array
          items: { type: string, enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday] }
          minItems: 1
          description: >-
            Jours OUVRÉS de l'établissement, dans l'ordre d'affichage (la semaine commence le lendemain du
            bloc de repos). Défaut : lundi → samedi. Absent ou `null` en PUT = inchangé. Les autres jours sont
            des jours de repos : appel des élèves, pointage des enseignants et créneaux d'emploi du temps y
            sont refusés (422) ; les données déjà enregistrées ne sont pas modifiées.

    SchoolYearCreateRequest:
      type: object
      description: >-
        Pas de champ `isActive` : créer une année ne fait jamais basculer l'établissement dessus
        (voir POST /school-years). Pas de `schoolId` non plus : il est déduit du JWT.
      required: [label, startDate, endDate]
      properties:
        label:
          type: string
          maxLength: 20
          example: "2026-2027"
          description: Libellé d'affichage, format libre. Unique au sein de l'établissement.
        startDate: { type: string, format: date }
        endDate:
          type: string
          format: date
          description: >-
            Postérieure à `startDate`, et comprise entre 3 et 18 mois après elle — de quoi
            intercepter la faute de frappe sur le millésime.

    SchoolYear:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string, example: "2026-2027" }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        isActive:
          type: boolean
          description: Une seule année active par établissement, garantie par un index PostgreSQL.
        isClosed:
          type: boolean
          description: >-
            Calculé à la lecture (`endDate` dépassée), jamais stocké. Une année close est en lecture
            seule : elle ne peut plus être activée.

    Classroom:
      type: object
      description: >-
        `schoolId` ne figure volontairement pas : il est déduit du JWT, jamais transmis ni accepté
        du client (AGENTS.md règle #10).
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "CM2 B" }
        level: { type: string, example: "Primaire" }
        cycle:
          type: string
          enum: [Primaire, College, Lycee]
          example: College
          description: >-
            Cycle d'enseignement STRUCTURÉ (distinct du `level` en texte libre). Pilote le barème de
            notation : `Primaire` est noté sur /10, `College` et `Lycee` sur /20. Lecture seule — non
            accepté à la création/mise à jour (défaut `College`).
        capacity: { type: integer, example: 40 }
        studentCount: { type: integer, example: 32, description: Effectif actuel, calculé côté base }
        isAccelerated:
          type: boolean
          default: false
          example: false
          description: >-
            Classe PASSERELLE / ACCÉLÉRÉE : l'année scolaire valide DEUX niveaux successifs
            (« CI-CP », « 6e-5e » — parcours d'intégration des élèves venus des écoles coraniques).
            Optionnelle : absente ou `false`, la classe se comporte exactement comme avant.
        targetLevel:
          type: string
          maxLength: 50
          nullable: true
          example: "CP"
          description: >-
            SECOND niveau validé en fin d'année par une classe accélérée. Null pour toute classe
            ordinaire. Ce n'est pas un identifiant : il n'existe aucune table de niveaux (voir la
            description de `level`) — c'est le libellé du niveau, dans la nomenclature du cycle
            (CI/CP/CE1… au Primaire, Sixième…Troisième au Collège, Seconde/Première/Terminale au Lycée).
        series:
          type: string
          nullable: true
          enum: [L1A, L1B, "L'1", L2, S1, S2, S3, S4, S5, STEG, T1, T2, STIDD, LA, S1A, S2A, L1, TECH]
          example: "S2"
          description: >-
            Série du LYCÉE (Évolution N°4) — catalogue fermé, voir `GET /coefficients/catalog`. Null pour toute
            classe sans série (Seconde commune, et TOUTE classe hors lycée). L'élève hérite la série de sa
            classe : c'est la clé des coefficients par série.
        rowVersion: { type: integer, format: int64, description: Jeton xmin — requis pour PUT/DELETE (verrou optimiste) }

    ClassroomUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ClassroomCreateRequest'
        - type: object
          required: [rowVersion]
          properties:
            rowVersion: { type: integer, format: int64 }

    ClassroomCreateRequest:
      type: object
      required: [name, level, capacity]
      description: >-
        La nomenclature est LIBRE : ni `name` ni `level` ne suivent une liste figée. Une école
        primaire, un collège et un lycée sénégalais ne nomment pas leurs classes de la même façon —
        toute énumération exclurait des établissements.
      properties:
        name: { type: string, maxLength: 50, example: "CM2 B" }
        level: { type: string, maxLength: 50, example: "Primaire" }
        capacity: { type: integer, minimum: 1, maximum: 200, example: 40 }
        isAccelerated:
          type: boolean
          default: false
          description: Classe passerelle / accélérée validant DEUX niveaux — voir `Classroom.isAccelerated`.
        targetLevel:
          type: string
          maxLength: 50
          nullable: true
          example: "CP"
          description: >-
            Second niveau validé. OBLIGATOIRE quand `isAccelerated` vaut `true`, et refusé en 422 s'il
            n'appartient pas au cycle de la classe ou s'il répète le niveau de départ. Ignoré (remis à
            null) quand `isAccelerated` vaut `false` : une classe ordinaire ne garde pas de niveau cible.
        series:
          type: string
          nullable: true
          enum: [L1A, L1B, "L'1", L2, S1, S2, S3, S4, S5, STEG, T1, T2, STIDD, LA, S1A, S2A, L1, TECH]
          description: >-
            Série du lycée (Évolution N°4), casse ignorée (`s2` devient `S2`). Refusée en 422 hors d'une classe
            de Lycée ou hors du catalogue. REMPLACEMENT COMPLET en PUT : une série absente est EFFACÉE — renvoyez
            la classe entière.

    CouncilRules:
      type: object
      description: >-
        Seuils du conseil de classe (Évolution N°7), sur /20, transposés au barème de la classe. Défauts : règles MEN.
      properties:
        felicitationsMin: { type: number, example: 14 }
        honorRollMin: { type: number, example: 12, description: "Tableau d'honneur — sans aucune note éliminatoire" }
        encouragementsMin: { type: number, example: 12 }
        eliminatoryGrade: { type: number, example: 5, description: Une moyenne de matière strictement inférieure est éliminatoire }
        promotionMin: { type: number, example: 10, description: Moyenne annuelle minimale proposée « Admis en classe supérieure » }
        repeatMin: { type: number, example: 8.5, description: Moyenne annuelle minimale proposée « Autorisé à redoubler » ; en dessous « Exclu » }

    SeriesItem:
      type: object
      properties:
        code: { type: string, enum: [L1A, L1B, "L'1", L2, S1, S2, S3, S4, S5, STEG, T1, T2, STIDD, LA, S1A, S2A, L1, TECH] }
        label: { type: string, example: "Série S2" }
        category:
          type: string
          enum: [Littéraire, Scientifique, Technique, Franco-Arabe]
          description: Famille de la série (Évolution N°6) — regroupe la liste déroulante.
        isLegacy:
          type: boolean
          description: Ancien code (L1, TECH) — accepté pour une classe qui le porte, jamais proposé pour une nouvelle classe.
        hasTemplate:
          type: boolean
          description: Un modèle national existe — la classe reçoit alors son programme et ses coefficients officiels à la création.

    ClassTemplateReport:
      type: object
      description: Ce que l'injection du modèle national d'une série a posé dans une classe (Évolution N°6).
      properties:
        series: { type: string, nullable: true }
        subjectsCreated: { type: integer, description: Matières créées dans l'établissement faute de correspondance }
        subjectsAdded: { type: integer }
        subjectsRestored: { type: integer }
        subjectsDeactivated: { type: integer }
        coefficientsSet: { type: integer, description: Surcharges de classe posées ou corrigées pour l'année active }
        coefficientsCleared: { type: integer }
        noActiveYear: { type: boolean, description: Aucune année active — programme posé, coefficients non posés }

    ClassSubjectRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        subjectName: { type: string, example: "Physique-Chimie" }
        level: { type: string }
        optionGroup: { type: string, nullable: true, example: "Option scientifique" }
        isCustom: { type: boolean }
        isActive: { type: boolean }
        displayOrder: { type: integer }
        rowVersion: { type: integer, format: int64, description: Jeton xmin de la ligne de programme }
        baseCoefficient: { type: number }
        effectiveCoefficient: { type: number }
        source: { type: string, enum: [Subject, Series, Classroom] }
        overrideId: { type: string, format: uuid, nullable: true, description: Surcharge de CLASSE de l'année active (à corriger via PUT /coefficients) }
        overrideCoefficient: { type: number, nullable: true }
        overrideRowVersion: { type: integer, format: int64, nullable: true }
        officialCoefficient: { type: number, nullable: true, description: Valeur du modèle national de la série ; null hors modèle }
        enrolledStudents: { type: integer, nullable: true, description: Matière optionnelle — élèves l'ayant choisie cette année }

    ClassSubjects:
      type: object
      properties:
        classroomId: { type: string, format: uuid }
        classroomName: { type: string }
        series: { type: string, nullable: true }
        seriesLabel: { type: string, nullable: true }
        hasTemplate: { type: boolean }
        schoolYearId: { type: string, format: uuid, nullable: true }
        schoolYearLabel: { type: string, nullable: true }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ClassSubjectRow' }
        optionGroups:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              defaultClassSubjectId: { type: string, format: uuid }
              studentsWithoutChoice: { type: integer }

    SubjectOptions:
      type: object
      properties:
        classroomId: { type: string, format: uuid, nullable: true }
        schoolYearId: { type: string, format: uuid, nullable: true }
        groups:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: "LV2" }
              defaultClassSubjectId:
                type: string
                format: uuid
                description: Option pré-cochée — la plus choisie dans l'établissement cette année, à défaut la première du groupe.
              selectedClassSubjectId: { type: string, format: uuid, nullable: true }
              options:
                type: array
                items:
                  type: object
                  properties:
                    classSubjectId: { type: string, format: uuid }
                    subjectId: { type: string, format: uuid }
                    subjectName: { type: string }

    CoefficientGrid:
      type: object
      properties:
        schoolYearId: { type: string, format: uuid }
        schoolYearLabel: { type: string, example: "2026-2027" }
        yearHasGrades:
          type: boolean
          description: >-
            Des notes existent déjà sur l'année : modifier un coefficient recalcule alors les moyennes et les
            bulletins de cette année (l'écran avertit).
        rows:
          type: array
          items: { $ref: '#/components/schemas/CoefficientGridRow' }

    CoefficientGridRow:
      type: object
      properties:
        subjectId: { type: string, format: uuid }
        subjectName: { type: string }
        level: { type: string }
        baseCoefficient: { type: number, description: "Coefficient de la matière (`Subject.coefficient`)" }
        overrideId: { type: string, format: uuid, nullable: true }
        overrideCoefficient: { type: number, nullable: true, description: Surcharge de LA portée demandée }
        rowVersion: { type: integer, format: int64, nullable: true, description: Jeton xmin de la surcharge }
        inheritedSeriesCoefficient:
          type: number
          nullable: true
          description: Portée « classe » seulement — la surcharge de la série de la classe, si elle existe.
        effectiveCoefficient: { type: number }
        source: { type: string, enum: [Subject, Series, Classroom] }

    UpsertCoefficientOverrideRequest:
      type: object
      required: [subjectId, coefficient]
      description: Exactement UNE portée — `series` OU `classroomId`.
      properties:
        subjectId: { type: string, format: uuid }
        coefficient: { type: number, exclusiveMinimum: 0, maximum: 20, example: 6 }
        series: { type: string, enum: [L1A, L1B, "L'1", L2, S1, S2, S3, S4, S5, STEG, T1, T2, STIDD, LA, S1A, S2A, L1, TECH], nullable: true }
        classroomId: { type: string, format: uuid, nullable: true }
        rowVersion: { type: integer, format: int64, nullable: true, description: Obligatoire pour corriger une ligne existante }

    CoefficientOverrideResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        series: { type: string, nullable: true }
        classroomId: { type: string, format: uuid, nullable: true }
        coefficient: { type: number }
        rowVersion: { type: integer, format: int64 }

    ApplySeriesTemplateRequest:
      type: object
      required: [series]
      properties:
        series: { type: string, enum: [L1A, L1B, "L'1", L2, S1, S2, S3, S4, S5, STEG, T1, T2, STIDD, LA, S1A, S2A, L1, TECH] }
        overwrite: { type: boolean, default: false }

    ApplyTemplateResult:
      type: object
      properties:
        applied: { type: integer, description: Surcharges créées }
        updated: { type: integer, description: Surcharges existantes remplacées (overwrite, valeur différente) }
        skippedExisting: { type: integer }
        unmatchedTemplateLines:
          type: array
          items: { type: string }
          description: Lignes du modèle qu'aucune matière de l'école ne reconnaît.
        uncoveredSubjects:
          type: array
          items: { type: string }
          description: Matières de l'école (hors primaire) qu'aucune ligne du modèle ne couvre.

    SubjectCreateRequest:
      type: object
      description: >-
        Pas de `schoolId` : il est déduit du JWT. Le `level` est un texte libre, aligné sur la
        nomenclature des classes de l'établissement (pas de liste figée).
      required: [name, coefficient, level]
      properties:
        name: { type: string, maxLength: 80, example: "Mathématiques" }
        coefficient:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          maximum: 20
          example: 4
        level: { type: string, maxLength: 50, example: "Primaire" }
        parentSubjectId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Domaine auquel rattacher cette ligne d'évaluation (grilles par compétences du primaire) :
            « Ressources » sous « Français », « P. Alphabétique » sous « Lang & Com. ». Absent ou null
            crée une matière de premier niveau — le cas de toute matière du secondaire.
            La hiérarchie compte DEUX niveaux au plus : viser une matière déjà rattachée à un domaine
            est refusé en 422, tout comme viser un domaine inexistant dans l'établissement.
            Une activité prend TOUJOURS le `level` de son domaine ; celui envoyé est ignoré.
        maxScore:
          type: number
          format: double
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          maximum: 100
          example: 40
          description: >-
            Barème propre à la ligne — la colonne « Sur » du bulletin (10, 16, 24, 40, 60…).
            Null (le défaut) suit le barème du CYCLE de la classe : Primaire /10, Collège & Lycée /20.
            C'est ce barème, et non celui du cycle, qui plafonne les notes saisies sur cette matière.
        displayOrder:
          type: integer
          minimum: 0
          maximum: 999
          default: 0
          description: >-
            Rang d'affichage dans sa fratrie — l'ordre d'une grille est pédagogique, pas alphabétique
            (« Ressources » précède « Compétences »). À égalité, le nom départage.
        column1Header:
          type: string
          maxLength: 40
          nullable: true
          example: "Domaines"
          description: >-
            Entête de la 1re colonne du tableau du bulletin. Réglage de GRILLE : porté par les domaines
            de premier niveau, ignoré (remis à null) sur une activité. Null → « Domaines ».
        column2Header:
          type: string
          maxLength: 40
          nullable: true
          example: "Activités"
          description: Entête de la 2e colonne. Même portée que `column1Header`. Null → « Activités ».

    Subject:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Mathématiques" }
        level: { type: string, example: "Primaire" }
        coefficient: { type: number, format: double, example: 4 }
        rowVersion: { type: integer, format: int64, description: Jeton xmin — requis pour PUT/DELETE (verrou optimiste) }
        parentSubjectId: { type: string, format: uuid, nullable: true }
        maxScore: { type: number, format: double, nullable: true, description: Null = barème du cycle de la classe }
        displayOrder: { type: integer, example: 0 }
        column1Header: { type: string, nullable: true }
        column2Header: { type: string, nullable: true }

    SubjectUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/SubjectCreateRequest'
        - type: object
          required: [rowVersion]
          properties:
            rowVersion: { type: integer, format: int64 }

    Student:
      type: object
      properties:
        id: { type: string, format: uuid }
        matricule: { type: string }
        fullName: { type: string }
        classroomId: { type: string, format: uuid }
        birthDate: { type: string, format: date }
        gender: { type: string, enum: [M, F] }
        rowVersion: { type: integer, format: int64, description: Jeton xmin — requis pour PUT/DELETE (verrou optimiste) }

    StudentUpdateRequest:
      type: object
      required: [fullName, birthDate, gender, classroomId, rowVersion]
      description: >-
        Le matricule n'est jamais modifiable (AGENTS.md règle #3) — absent de ce contrat.
      properties:
        fullName: { type: string, maxLength: 200 }
        birthDate: { type: string, format: date }
        birthPlace: { type: string, maxLength: 200 }
        gender: { type: string, enum: [M, F] }
        classroomId: { type: string, format: uuid }
        photoUrl: { type: string, format: uri }
        guardianName: { type: string, maxLength: 200 }
        guardianPhone: { type: string, maxLength: 30 }
        rowVersion: { type: integer, format: int64 }

    StudentProfile:
      allOf:
        - $ref: '#/components/schemas/Student'
        - type: object
          properties:
            enrollmentHistory: { type: array, items: { type: object } }
            grades: { type: array, items: { type: object } }
            payments: { type: array, items: { type: object } }

    StudentCreateRequest:
      type: object
      required: [fullName, birthDate, gender, classroomId]
      properties:
        fullName: { type: string }
        birthDate: { type: string, format: date }
        gender: { type: string, enum: [M, F] }
        classroomId: { type: string, format: uuid }
        guardianName: { type: string }
        guardianPhone: { type: string }

    PaginatedStudents:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Student' } }
        totalCount: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    TeacherStateducFields:
      type: object
      description: >-
        Champs alimentant le rapport annuel STATEDUC (JGK-M05). TOUS facultatifs. Les enums valent
        « NonRenseigne » par défaut : le rapport compte ces fiches dans une ligne « non renseigné »
        explicite, jamais imputées à une catégorie réelle.
      properties:
        gender:
          type: string
          enum: ["", M, F]
          nullable: true
          description: '« M » / « F » ; vide ou absent = non renseigné. Le serveur normalise.'
        academicQualification:
          type: string
          enum: [NonRenseigne, Aucun, BFEM, BAC, Licence, Master, Doctorat]
          default: NonRenseigne
        professionalQualification:
          type: string
          enum: [NonRenseigne, Aucun, CEAP, CAP, CAEM, CAES]
          default: NonRenseigne
          description: C'est CE diplôme qui compte l'enseignant comme « qualifié » au STATEDUC.
        civilServiceStatus:
          type: string
          enum: [NonRenseigne, Fonctionnaire, Contractuel, Vacataire, Volontaire, Benevole]
          default: NonRenseigne
        civilServiceMatricule:
          type: string
          nullable: true
          maxLength: 30
          description: Matricule de solde de la Fonction publique — personnels payés par l'État uniquement.
        firstAppointmentDate:
          type: string
          format: date
          nullable: true
          description: Première prise de service dans l'enseignement (toutes écoles), pas dans cet établissement.

    TeacherCreateRequest:
      allOf:
        - $ref: '#/components/schemas/TeacherStateducFields'
        - type: object
          required: [fullName, email, subjectIds]
          properties:
            fullName: { type: string }
            email: { type: string, format: email }
            phone: { type: string }
            subjectIds: { type: array, items: { type: string, format: uuid } }
            userId:
              type: string
              format: uuid
              description: >-
                Compte de connexion (rôle Enseignant, même école) à rattacher à la fiche (ticket
                JGK-D06). Optionnel ; requis pour que cet enseignant puisse faire l'appel de ses classes.

    TeacherResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        matricule: { type: string }

    Teacher:
      type: object
      properties:
        id: { type: string, format: uuid }
        matricule: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        status: { type: string, enum: [Active, Suspended, Blocked] }
        subjects: { type: array, items: { type: string } }
        rowVersion: { type: integer, format: int64, description: Jeton xmin — requis pour PUT/DELETE (verrou optimiste) }

    TeacherUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/TeacherStateducFields'
        - type: object
          required: [fullName, email, subjectIds, rowVersion]
          description: >-
            Le matricule et le rattachement d'un compte de connexion (userId) ne sont jamais
            modifiables ici — absents de ce contrat (voir TeacherCreateRequest pour la création initiale).
          properties:
            fullName: { type: string, maxLength: 200 }
            email: { type: string, format: email, maxLength: 255 }
            phone: { type: string, maxLength: 30 }
            birthPlace: { type: string, maxLength: 200 }
            photoUrl: { type: string, format: uri }
            subjectIds: { type: array, items: { type: string, format: uuid } }
            rowVersion: { type: integer, format: int64 }

    PaginatedTeachers:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Teacher' } }
        totalCount: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    TeacherAssignment:
      type: object
      properties:
        id: { type: string, format: uuid }
        classroomName: { type: string }
        subjectName: { type: string }
        schoolYearId: { type: string, format: uuid }
        schoolYearLabel: { type: string }
        isActiveSchoolYear: { type: boolean }

    TeacherProfile:
      allOf:
        - $ref: '#/components/schemas/Teacher'
        - $ref: '#/components/schemas/TeacherStateducFields'
        - type: object
          properties:
            assignments: { type: array, items: { $ref: '#/components/schemas/TeacherAssignment' } }

    TeacherAssignmentCreateRequest:
      type: object
      required: [classroomId, subjectId]
      properties:
        classroomId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }

    TeacherAssignmentResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        classroomId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        schoolYearId: { type: string, format: uuid }

    AttendanceStatus:
      type: string
      enum: [Present, JustifiedAbsence, UnjustifiedAbsence, Late]

    AttendanceRosterRow:
      type: object
      properties:
        studentId: { type: string, format: uuid }
        matricule: { type: string }
        fullName: { type: string }
        status:
          description: Statut déjà saisi si la fiche existe, sinon null.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/AttendanceStatus' }]
        lateMinutes: { type: integer }
        entryTicketId:
          type: string
          format: uuid
          nullable: true
          description: Billet d'entrée actif visant CE cours pour cet élève (Évolution N°5), sinon null.
        entryTicketNumber: { type: string, nullable: true, description: "« BILLET-XXXXXXXX »" }
        entryTicketStatus:
          type: string
          nullable: true
          enum: [Issued, Accepted]
          description: Un billet annulé n'apparaît plus sur la feuille.

    AttendanceSlot:
      type: object
      description: Un cours de l'emploi du temps proposé pour l'appel (Évolution N°5).
      properties:
        slotId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        subjectName: { type: string }
        teacherId: { type: string, format: uuid }
        teacherName: { type: string }
        start: { type: string, example: "08:00:00" }
        end: { type: string, example: "10:00:00" }
        label: { type: string, example: "08:00-10:00", description: Période dérivée du cours. }
        sheetId: { type: string, format: uuid, nullable: true, description: "Fiche d'appel déjà faite pour ce cours ce jour-là." }

    StudentSlot:
      type: object
      description: Un cours du jour de la classe d'un élève, pour viser un cours depuis un billet d'entrée (Évolution N°5).
      properties:
        slotId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        subjectName: { type: string }
        teacherName: { type: string }
        start: { type: string, example: "08:00:00" }
        end: { type: string, example: "10:00:00" }
        label: { type: string, example: "08:00-10:00" }
        isCurrent: { type: boolean, description: Le cours a lieu maintenant (date du jour uniquement). }
        isNext: { type: boolean, description: Premier cours à venir, quand aucun n'est en cours. }
        ticketStatus:
          type: string
          nullable: true
          enum: [Issued, Accepted]
          description: Billet actif déjà émis pour cet élève et ce cours ce jour-là.

    LateArrivalCreateRequest:
      type: object
      required: [studentId, date, minutes, reason]
      properties:
        studentId: { type: string, format: uuid }
        date: { type: string, format: date-time }
        minutes: { type: integer, minimum: 1, description: "Plafonné à 240 quand un cours est visé." }
        reason: { type: string }
        observations: { type: string, nullable: true }
        targetScheduleSlotId:
          type: string
          format: uuid
          nullable: true
          description: Cours visé par le billet d'entrée (Évolution N°5). Null = retard sans cours visé, comme avant.

    EntryTicketActionResult:
      type: object
      properties:
        ticketId: { type: string, format: uuid }
        status: { type: string, enum: [Issued, Accepted, Cancelled] }
        acceptedAt: { type: string, format: date-time, nullable: true }

    AttendanceRoster:
      type: object
      properties:
        classroomId: { type: string, format: uuid }
        classroomName: { type: string }
        subjectId: { type: string, format: uuid }
        subjectName: { type: string }
        date: { type: string, format: date }
        period: { type: string }
        alreadySubmitted: { type: boolean }
        students: { type: array, items: { $ref: '#/components/schemas/AttendanceRosterRow' } }

    AttendanceEntry:
      type: object
      required: [studentId, status]
      properties:
        studentId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        lateMinutes:
          type: integer
          description: Strictement positif si status = Late, sinon 0.

    AttendanceSubmitRequest:
      type: object
      required: [classroomId, subjectId, date, entries]
      description: >-
        `period` est obligatoire sans `scheduleSlotId` (appel libre) ; avec `scheduleSlotId` (Évolution N°5), la
        période est dérivée du cours et le champ est ignoré.
      properties:
        classroomId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        date: { type: string, format: date }
        period: { type: string }
        scheduleSlotId: { type: string, format: uuid, nullable: true }
        entries: { type: array, items: { $ref: '#/components/schemas/AttendanceEntry' } }

    AttendanceSubmitResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        studentCount: { type: integer }

    AttendanceLine:
      type: object
      properties:
        studentId: { type: string, format: uuid }
        matricule: { type: string }
        fullName: { type: string }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        lateMinutes: { type: integer }

    AttendanceSheet:
      type: object
      properties:
        id: { type: string, format: uuid }
        classroomId: { type: string, format: uuid }
        classroomName: { type: string }
        subjectId: { type: string, format: uuid }
        subjectName: { type: string }
        schoolYearId: { type: string, format: uuid }
        schoolYearLabel: { type: string }
        date: { type: string, format: date }
        period: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/AttendanceLine' } }

    EnrollmentCreateRequest:
      type: object
      description: >-
        Deux modes selon `type`. NewEnrollment : l'élève est CRÉÉ dans le flux (fullName, birthDate,
        gender requis) et son matricule généré. ReEnrollment : `studentId` d'un élève existant.
        Ni `schoolYearId` ni `totalDue` : l'année ACTIVE est résolue serveur, et le montant est
        CALCULÉ à partir du barème de la classe — jamais fourni par le client (règles #4 et #10).

        L'inscription FIGE LA DETTE et n'encaisse rien : aucun versement, aucun mode de règlement ne
        se transmet ici (le secrétariat n'encaisse pas). Tout règlement, y compris le premier, se
        fait à la Caisse via POST /finance/payments.
      required: [type, classroomId]
      properties:
        type: { type: string, enum: [NewEnrollment, ReEnrollment] }
        classroomId: { type: string, format: uuid }
        studentId:
          type: string
          format: uuid
          description: Requis pour ReEnrollment ; ignoré pour NewEnrollment.
        fullName: { type: string, maxLength: 200, description: NewEnrollment uniquement }
        birthDate: { type: string, format: date, description: NewEnrollment uniquement }
        gender: { type: string, enum: [M, F], description: NewEnrollment uniquement }
        guardianName: { type: string }
        guardianPhone: { type: string }
        subjectOptionIds:
          type: array
          nullable: true
          items: { type: string, format: uuid }
          description: >-
            Évolution N°6 — options retenues (matières de classe d'un groupe d'options, au plus une par groupe).
            Un groupe sans choix reçoit l'option par défaut (la plus fréquente de l'établissement) ; absent :
            toutes les options par défaut. Enregistrées dans la même transaction ; 422 pour une option hors
            classe ou deux options d'un même groupe.

    EnrollmentReceipt:
      type: object
      description: >-
        Attestation d'inscription (JGK-E01/E02), imprimée en A5 paysage. Le détail des frais est figé
        à l'inscription.

        REFONTE DU 25/08/2026 — le document imprimé n'affiche PLUS le cumul annuel : ni `totalDue`,
        ni `remainingBalance`, ni « × N mois ». Il porte l'engagement initial
        (`initialSettlementTotal`) puis les tarifs mensuels unitaires (`monthlyLines`,
        `monthlyTotal`). Ces champs restent tous exposés ici pour la Finance et pour que le front
        rende les mêmes blocs que le PDF sans réimplémenter la règle.
        Voir docs/design-references/README.md §1.
      properties:
        enrollmentId: { type: string, format: uuid }
        receiptNumber: { type: string, description: 'Numéro officiel unique du reçu d''inscription (JGK-E02), ex. « REC-2025-0002 ».' }
        schoolName: { type: string }
        schoolAddress: { type: string, nullable: true }
        schoolPhone: { type: string, nullable: true }
        schoolEmail: { type: string, nullable: true }
        schoolNinea: { type: string, nullable: true, description: 'Mention légale de l''en-tête ; absente si non saisie.' }
        schoolRegistreCommerce: { type: string, nullable: true, description: 'RCCM — idem.' }
        schoolCity: { type: string, nullable: true, description: 'Ville du bas de reçu (« Fait à … »), dérivée de l''adresse de l''école.' }
        matricule: { type: string }
        studentFullName: { type: string }
        classroomName: { type: string }
        classroomLevel: { type: string }
        schoolYearLabel: { type: string }
        guardianName: { type: string, nullable: true }
        guardianPhone: { type: string, nullable: true }
        type: { type: string, enum: [NewEnrollment, ReEnrollment] }
        status: { type: string, enum: [Pending, Confirmed, Cancelled, DroppedOut, Transferred] }
        enrolledAt: { type: string, format: date-time }
        totalDue: { type: number, description: 'Dû ANNUEL figé à l''inscription. USAGE INTERNE Finance — n''est plus imprimé sur aucune pièce remise au tuteur (refonte du 25/08/2026).' }
        lines:
          type: array
          description: Détail du dû annuel, figé à l'inscription.
          items:
            type: object
            properties:
              designation: { type: string }
              isRecurring: { type: boolean }
              unitAmount: { type: number }
              months: { type: integer }
              lineTotal: { type: number }
        collectedLines:
          type: array
          description: >-
            TOUJOURS VIDE pour une inscription : le secrétariat n'encaisse rien (règle #4). Champ
            conservé pour la stabilité de forme et la relecture d'un reçu historique dont un versement
            portait le même numéro. Le vrai constat d'encaissement est le reçu de caisse
            (`/finance/payments/{id}/receipt`).
          items:
            type: object
            properties:
              designation: { type: string }
              isRecurring: { type: boolean }
              months: { type: integer, description: 'Mois couverts pour une mensualité ; 1 pour un frais ponctuel.' }
              amount: { type: number }
        totalCollected: { type: number, description: 'TOUJOURS 0 pour une inscription — le règlement se fait à la Caisse. Conservé pour la stabilité de forme / la relecture historique.' }
        remainingBalance: { type: number, description: 'totalDue − totalCollected (donc = totalDue à l''inscription). USAGE INTERNE Finance — jamais imprimé (refonte du 25/08/2026).' }
        initialSettlementTotal:
          type: number
          description: >-
            Engagement initial à régler auprès de la comptabilité le jour de l'inscription : somme des
            `lines[].unitAmount`, soit le frais ponctuel entier ou UNE SEULE mensualité par ligne
            récurrente. Calculé, jamais stocké. Hypothèse : un mois d'avance.
        monthlyLines:
          type: array
          description: >-
            Échéancier mensuel : les seules lignes récurrentes de `lines`, à leur tarif UNITAIRE. Les
            frais ponctuels en sont exclus — ils ne se répètent pas.
          items:
            type: object
            properties:
              designation: { type: string }
              isRecurring: { type: boolean }
              unitAmount: { type: number }
              months: { type: integer }
              lineTotal: { type: number }
        monthlyTotal:
          type: number
          description: >-
            Total à prévoir chaque mois — somme des mensualités UNITAIRES, jamais multipliée par le
            nombre de mois. C'est le chiffre qui remplace le cumul annuel sur le document.
        paymentMethod:
          type: string
          nullable: true
          enum: [Cash, Cheque, Transfer, MobileMoney]
          description: 'TOUJOURS null pour une inscription (aucun encaissement). Renseigné seulement à la relecture d''un reçu historique.'

    ChangeEnrollmentStatusRequest:
      type: object
      required: [newStatus, rowVersion]
      description: >-
        Déclare un abandon ou un transfert en cours d'année (voir POST /enrollments/{id}/status).
        Seuls DroppedOut et Transferred sont acceptés ici — Cancelled passe par
        DELETE /enrollments/{id}, réservé aux inscriptions jamais encaissées.
      properties:
        newStatus: { type: string, enum: [DroppedOut, Transferred] }
        rowVersion: { type: integer, format: int64 }

    GradeCreateRequest:
      type: object
      required: [studentId, subjectId, termId, evaluationType, value]
      properties:
        studentId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        termId: { type: string, format: uuid }
        evaluationType: { type: string, enum: [Devoir1, Devoir2, Composition] }
        value:
          type: number
          minimum: 0
          description: Sur le barème de l'école (SchoolSettings.GradingScale, 10 ou 20).

    GradeUpdateRequest:
      type: object
      required: [value, rowVersion]
      properties:
        value:
          type: number
          minimum: 0
          description: Sur le barème de l'école (SchoolSettings.GradingScale, 10 ou 20).
        rowVersion:
          type: integer
          format: int64
          description: Jeton xmin renvoyé par la dernière lecture — verrouillage optimiste.

    GradeCell:
      type: object
      properties:
        id: { type: string, format: uuid }
        value: { type: number }
        rowVersion: { type: integer }
        canEdit:
          type: boolean
          description: L'appelant peut-il corriger cette note ? (voir GET /grades) — vrai pour Directeur et Secrétariat.

    StudentGradeRow:
      type: object
      description: Une ligne de la grille ; une épreuve sans note vaut null.
      properties:
        studentId: { type: string, format: uuid }
        matricule: { type: string }
        fullName: { type: string }
        devoir1: { $ref: '#/components/schemas/GradeCell', nullable: true }
        devoir2: { $ref: '#/components/schemas/GradeCell', nullable: true }
        composition: { $ref: '#/components/schemas/GradeCell', nullable: true }

    GradeSaved:
      type: object
      properties:
        id: { type: string, format: uuid }
        value: { type: number }
        rowVersion:
          type: integer
          format: int64
          description: Nouveau jeton xmin — à renvoyer pour la prochaine correction.

    GradeImportResult:
      type: object
      properties:
        studentsMatched: { type: integer, description: Élèves reconnus par matricule dans le fichier. }
        created: { type: integer, description: Notes créées (élève sans note préalable pour cette clé). }
        updated: { type: integer, description: Notes corrigées (valeur différente de l'existante). }
        unchanged: { type: integer, description: Lignes dont la valeur importée égalait déjà la note existante. }

    Term:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string, example: "1er trimestre", description: "« 1er trimestre », « 1er semestre » ou « 1re période » selon le découpage de l'école ; imprimé tel quel sur les documents." }
        order: { type: integer, example: 1 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }

    SubjectGrade:
      type: object
      description: >-
        `devoir1`/`devoir2`/`composition` sont null si ce type d'évaluation n'a pas encore été saisi.
        `devoirAverage` est la moyenne de devoir1/devoir2 (null si aucun des deux n'est saisi) — c'est
        elle qui s'imprime dans la colonne « Devoir » du bulletin. `average` moyenne devoirAverage et
        composition — la moyenne se calcule sur ce qui existe, sans exiger que les trois soient saisis.
      properties:
        subjectId: { type: string, format: uuid }
        subjectName: { type: string }
        devoir1: { type: number, nullable: true }
        devoir2: { type: number, nullable: true }
        composition: { type: number, nullable: true }
        devoirAverage: { type: number, nullable: true }
        average: { type: number }
        coefficient: { type: number }
        weightedPoints: { type: number, description: "average × coefficient" }

    GradeSummary:
      type: object
      properties:
        studentId: { type: string, format: uuid }
        termId: { type: string, format: uuid }
        subjects:
          type: array
          items: { $ref: '#/components/schemas/SubjectGrade' }
        totalCoefficients: { type: number }
        totalPoints: { type: number }
        generalAverage: { type: number }
        mention:
          type: string
          nullable: true
          description: Null tant qu'aucune matière n'est notée, ou sous le seuil de la mention la plus basse.

    Mention:
      type: object
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: Null pour une mention par défaut, non encore stockée.
        label: { type: string, example: "Excellent" }
        minAverage:
          type: number
          description: Moyenne minimale (incluse) pour obtenir cette mention, sur le barème de l'école.

    MentionCreateRequest:
      type: object
      required: [label, minAverage]
      properties:
        label: { type: string, maxLength: 40, example: "Excellent" }
        minAverage: { type: number, minimum: 0 }

    FeeCategoryCreateRequest:
      type: object
      description: "Pas de `schoolId` : il est déduit du JWT. La liste est libre (Volume 1 §7.1)."
      required: [name]
      properties:
        name: { type: string, maxLength: 60, example: "Mensualité" }
        isRecurring:
          type: boolean
          description: Vrai pour une mensualité (due chaque mois), faux pour un frais ponctuel.

    FeeCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Mensualité" }
        isRecurring: { type: boolean }
        isBoardingFee:
          type: boolean
          description: >-
            Module Internat : catégorie incluable automatiquement sur l'inscription d'un élève
            Interne/Demi-pensionnaire, en plus du barème ordinaire.

    ClassFee:
      type: object
      properties:
        id: { type: string, format: uuid }
        feeCategoryId: { type: string, format: uuid }
        feeCategoryName: { type: string, example: "Mensualité" }
        classroomId: { type: string, format: uuid }
        classroomName: { type: string, example: "CM2 A" }
        level: { type: string, example: "Primaire" }
        amount: { type: number, example: 15000 }
        rowVersion:
          type: integer
          format: int64
          description: Jeton de concurrence optimiste (xmin) à renvoyer lors d'une modification.

    ApplyStandardFeeRequest:
      type: object
      required: [feeCategoryId, amount]
      properties:
        feeCategoryId: { type: string, format: uuid }
        amount: { type: number, minimum: 0, example: 15000 }
        level:
          type: string
          maxLength: 50
          nullable: true
          example: Collège
          description: >-
            Périmètre d'application. Absent, vide ou null : toutes les classes de l'établissement.
            Renseigné : seules les classes de ce niveau sont touchées, les autres cycles gardent leur
            montant même avec overwriteExisting. Nomenclature libre (même champ que Classroom.level),
            comparée sans tenir compte de la casse. Un niveau ne correspondant à aucune classe → 422.
        overwriteExisting:
          type: boolean
          default: false
          description: >-
            false : ne remplit que les classes vierges et préserve les exceptions. true : réaligne
            sur le montant standard toutes les classes du périmètre.

    ApplyStandardFeeResult:
      type: object
      properties:
        created: { type: integer, description: Classes pour lesquelles une ligne a été créée. }
        updated: { type: integer, description: Classes réalignées sur le standard (overwrite). }
        skipped: { type: integer, description: Classes laissées telles quelles (exception préservée ou déjà au montant). }

    UpdateFeeResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        amount: { type: number }
        rowVersion:
          type: integer
          format: int64
          description: Nouveau jeton après écriture, pour enchaîner une modification sans recharger.

    FeeHistoryEntry:
      type: object
      properties:
        oldAmount:
          type: number
          nullable: true
          description: Montant avant le changement. Null pour la définition initiale.
        newAmount: { type: number }
        changedByUserId: { type: string, format: uuid }
        changedByName: { type: string, example: "Fatou Ndiaye" }
        changedAt: { type: string, format: date-time }

    StudentBalance:
      type: object
      description: Solde à encaisser pour un élève, sur son inscription de l'année scolaire active.
      properties:
        enrollmentId: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        matricule: { type: string }
        studentFullName: { type: string }
        classroomName: { type: string }
        schoolYearLabel: { type: string }
        totalDue: { type: number }
        amountPaid: { type: number }
        remainingBalance: { type: number }
        status: { type: string, enum: [Paid, Partial] }

    PaymentCreateRequest:
      type: object
      description: >-
        Encaissement contre une INSCRIPTION (c'est là que vit le solde), pas contre un élève : un élève
        peut avoir plusieurs inscriptions au fil des années, chacune avec son propre solde.
      required: [enrollmentId, amount, method]
      properties:
        enrollmentId: { type: string, format: uuid }
        amount: { type: number, description: "FCFA, strictement positif, jamais supérieur au solde restant." }
        method: { type: string, enum: [Cash, Cheque, Transfer, MobileMoney] }
        idempotencyKey:
          type: string
          format: uuid
          nullable: true
          description: >-
            Généré côté client à l'ouverture du formulaire de caisse (ticket JGK-L01), jamais régénéré
            à chaque tentative. Un retry après coupure réseau avec la MÊME clé rejoue le résultat déjà
            produit (même paymentId/receiptNumber) au lieu de créer un second encaissement.

    PaymentResult:
      type: object
      description: Résultat d'un encaissement — de quoi confirmer à la caisse et imprimer le reçu.
      properties:
        paymentId: { type: string, format: uuid }
        receiptNumber: { type: string, example: "REC-2025-0007" }
        amount: { type: number }
        totalDue: { type: number }
        amountPaid: { type: number, description: "Cumul encaissé après ce versement." }
        remainingBalance: { type: number }
        status: { type: string, enum: [Paid, Partial] }

    CurrentCashierSession:
      type: object
      nullable: true
      description: Session de caisse ouverte de l'utilisateur courant, ou null s'il n'en a aucune.
      properties:
        sessionId: { type: string, format: uuid }
        openingBalance: { type: number, description: "Fonds de caisse déclaré à l'ouverture." }
        openedAt: { type: string, format: date-time }
        totalCollected: { type: number, description: "Somme des encaissements non annulés de la session, en temps réel." }
        paymentsCount: { type: integer }

    CashierSessionClosingResult:
      type: object
      properties:
        sessionId: { type: string, format: uuid }
        openingBalance: { type: number }
        totalCollected: { type: number, description: "Toutes méthodes de paiement confondues." }
        expectedClosingBalance: { type: number, description: "Solde théorique = openingBalance + totalCollected (toutes méthodes)." }
        expectedCashAmount: { type: number, description: "Espèces attendues dans le tiroir-caisse = openingBalance + encaissements EN ESPÈCES uniquement (JGK-F09)." }
        actualCashAmount: { type: number, description: "Espèces réellement comptées, telles que déclarées à la clôture." }
        discrepancyAmount: { type: number, description: "actualCashAmount − expectedCashAmount. Zéro si la caisse tombe juste." }
        discrepancyReason: { type: string, nullable: true }

    PaymentReceipt:
      type: object
      description: Données du reçu de paiement, montants figés à l'instant de l'encaissement.
      properties:
        receiptNumber: { type: string }
        schoolName: { type: string }
        schoolPhone: { type: string, nullable: true }
        schoolCity: { type: string, nullable: true }
        schoolLogoUrl: { type: string, nullable: true }
        matricule: { type: string }
        studentFullName: { type: string }
        classroomName: { type: string }
        schoolYearLabel: { type: string }
        method: { type: string, enum: [Cash, Cheque, Transfer, MobileMoney] }
        amount: { type: number }
        totalDue: { type: number }
        alreadyPaid: { type: number }
        remainingBalance: { type: number }
        paidAt: { type: string, format: date-time }

    ExpenseCreateRequest:
      type: object
      required: [label, amount, category, date]
      properties:
        label: { type: string }
        amount: { type: number }
        category: { type: string }
        date: { type: string, format: date }

    FinanceDashboard:
      type: object
      properties:
        collectedToday: { type: number }
        collectedThisMonth: { type: number }
        totalOutstanding: { type: number }
        recoveryRate: { type: number, description: "Pourcentage, 0-100" }

    DirectorDashboard:
      type: object
      description: Tableau de bord analytique du Directeur (ticket JGK-R01).
      properties:
        enrollments:
          type: object
          properties:
            total: { type: integer }
            boys: { type: integer }
            girls: { type: integer }
        activeTeachers: { type: integer }
        attendanceRate:
          type: number
          nullable: true
          description: "Taux 0-1 = (Présents + Retards) / total des appels du mois. Null si aucun appel ce mois."
        subscription:
          type: object
          nullable: true
          description: "Résumé de l'abonnement de l'école. Null pour un Super Admin sans établissement."
          properties:
            plan: { type: string, enum: [Primaire, Standard, Premium] }
            status: { type: string, enum: [AwaitingPayment, Active, Suspended, ReadOnly] }
            expiresAt: { type: string, format: date, nullable: true }
            daysRemaining:
              type: integer
              nullable: true
              description: "Jours avant échéance. Négatif si expiré, null si aucune date d'échéance."

    StudentAttendanceReportRow:
      type: object
      properties:
        studentId: { type: string, format: uuid }
        matricule: { type: string }
        fullName: { type: string }
        classroomId: { type: string, format: uuid }
        classroomName: { type: string }
        totalCalls: { type: integer }
        present: { type: integer }
        late: { type: integer }
        justifiedAbsences: { type: integer }
        unjustifiedAbsences: { type: integer }
        totalLateMinutes: { type: integer }
        attendanceRate: { type: number, description: "Taux 0-1 = (Présents + Retards) / total de ses appels." }
        daysRecorded:
          type: integer
          description: Jours où au moins une séance a été appelée pour l'élève (Évolution N°5) — le dénominateur des deux nombres suivants.
        fullAbsenceDays: { type: integer, description: "Jours où l'élève a été absent à TOUTES les séances appelées." }
        partialAbsenceDays: { type: integer, description: "Jours où il a manqué au moins une séance mais assisté (présent ou en retard) à une autre. Calcul, pas un statut : le taux n'en dépend pas." }

    SubjectAttendanceReportRow:
      type: object
      properties:
        subjectId: { type: string, format: uuid }
        subjectName: { type: string }
        sessions: { type: integer, description: Séances appelées sur la période. }
        lines: { type: integer, description: Lignes d'appel (élève × séance). }
        presents: { type: integer }
        lates: { type: integer }
        justifiedAbsences: { type: integer }
        unjustifiedAbsences: { type: integer }
        attendanceRate: { type: number, description: "Taux 0-1 = (Présents + Retards) / lignes d'appel." }

    AttendanceReport:
      type: object
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        classId: { type: string, format: uuid, nullable: true }
        averageAttendanceRate:
          type: number
          nullable: true
          description: "Taux moyen 0-1 sur la période (global ou pour la classe). Null si aucun appel."
        students: { type: array, items: { $ref: '#/components/schemas/StudentAttendanceReportRow' } }
        totalCount: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    SubscriptionUpdateRequest:
      type: object
      properties:
        plan: { type: string, enum: [Primaire, Standard, Premium] }
        expiresAt: { type: string, format: date }
        status: { type: string, enum: [AwaitingPayment, Active, Suspended, ReadOnly] }

    RegistrationRequestCreate:
      type: object
      required: [directorFullName, directorEmail, directorPhone, directorPassword, schoolName, requestedPlan]
      properties:
        directorFullName: { type: string, maxLength: 200 }
        directorEmail: { type: string, format: email, maxLength: 200 }
        directorPhone: { type: string, maxLength: 30 }
        directorPassword: { type: string, format: password, minLength: 12, maxLength: 128, description: "Choisi par le Directeur ; haché immédiatement côté serveur, jamais journalisé ni renvoyé" }
        schoolName: { type: string, maxLength: 200 }
        schoolAddress: { type: string, maxLength: 300 }
        city: { type: string, maxLength: 100 }
        region: { type: string, maxLength: 100 }
        estimatedStudentCount: { type: integer, minimum: 1 }
        requestedPlan: { type: string, enum: [Primaire, Standard, Premium] }
        website: { type: string, description: "Honeypot anti-spam : champ leurre, DOIT rester vide. Rempli, la soumission est ignorée sans être enregistrée." }

    RegistrationRequestCreated:
      type: object
      properties:
        trackingReference: { type: string, example: "REG-7QK3M9PZ" }

    RegistrationRequestStatus:
      type: object
      description: >-
        Strict minimum public (ticket JGK-I02) : ni e-mail, ni téléphone, ni adresse, ni effectif, ni
        plan souhaité, ni identité du Super Admin ayant statué.
      properties:
        trackingReference: { type: string, example: "REG-7QK3M9PZ" }
        schoolName: { type: string }
        status: { type: string, enum: [Pending, Approved, Rejected] }
        submittedAt: { type: string, format: date-time }
        rejectionReason: { type: string, nullable: true, description: "Renseigné uniquement si status = Rejected (motif obligatoire côté Super Admin, ticket JGK-I03)" }

    PublicSchool:
      type: object
      description: >-
        Fiche telle que servie à un visiteur ANONYME. Contrat volontairement plus pauvre que celui du
        Directeur sur son propre établissement (SchoolProfile) : ni NINEA, ni RCCM, ni statut, ni
        en-têtes administratifs (IA/IEF), ni champs d'audit. Cette restriction n'est pas seulement
        contractuelle — la vue SQL `public_school_directory` qui alimente cette réponse ne projette
        physiquement pas ces colonnes.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "École Primaire Les Baobabs" }
        city: { type: string, nullable: true, example: "Dakar" }
        region: { type: string, nullable: true, example: "Dakar" }
        description:
          type: string
          nullable: true
          description: Présentation rédigée par le Directeur. N'apparaît sur aucun document officiel.
        logoUrl: { type: string, nullable: true }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        cycles:
          type: array
          description: >-
            Cycles réellement proposés, en libellés lisibles et dans l'ordre pédagogique — DÉRIVÉS des
            classes ouvertes par l'établissement, jamais d'une liste déclarative qui deviendrait fausse
            dès la rentrée suivante. Vide tant qu'aucune classe n'existe.
          items: { type: string, example: "Primaire" }

    PaginatedPublicSchools:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicSchool' }
        totalCount: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    RegistrationRequestListItem:
      type: object
      description: >-
        Vue de revue Super Admin (ticket JGK-I03). Inclut les coordonnées du Directeur (nécessaires à
        l'arbitrage) mais JAMAIS le hash du mot de passe.
      properties:
        id: { type: string, format: uuid }
        trackingReference: { type: string, example: "REG-7QK3M9PZ" }
        schoolName: { type: string }
        schoolAddress: { type: string, nullable: true }
        city: { type: string, nullable: true }
        region: { type: string, nullable: true }
        estimatedStudentCount: { type: integer, nullable: true }
        requestedPlan: { type: string, enum: [Primaire, Standard, Premium] }
        directorFullName: { type: string }
        directorEmail: { type: string, format: email }
        directorPhone: { type: string }
        status: { type: string, enum: [Pending, Approved, Rejected] }
        submittedAt: { type: string, format: date-time }
        reviewedAt: { type: string, format: date-time, nullable: true }
        rejectionReason: { type: string, nullable: true }
        createdSchoolId: { type: string, format: uuid, nullable: true, description: "École née de l'approbation ; null tant que la demande n'est pas approuvée" }

    RegistrationApprovalResult:
      type: object
      properties:
        schoolId: { type: string, format: uuid }
        directorUserId: { type: string, format: uuid }
        subscriptionId: { type: string, format: uuid }
        subscriptionStatus: { type: string, enum: [AwaitingPayment] }

    SubscriptionPaymentInitiateRequest:
      type: object
      required: [method, billingPeriod]
      properties:
        method: { type: string, enum: [MobileMoney, BankTransfer, Card] }
        billingPeriod: { type: string, enum: [Monthly, Yearly] }
        promoCode:
          type: string
          nullable: true
          maxLength: 32
          description: Revalidé côté serveur, indépendamment d'un éventuel appel préalable à POST /subscriptions/validate-promo.

    SubscriptionPaymentInitiateResult:
      type: object
      description: >-
        Si le code promo couvre l'intégralité (discountType FreeTrialMonths/FullDiscount),
        l'abonnement est activé IMMÉDIATEMENT sans appel agrégateur : paymentId/redirectUrl/status
        sont alors null et activatedWithoutPayment vaut true.
      properties:
        paymentId: { type: string, format: uuid, nullable: true }
        redirectUrl: { type: string, format: uri, nullable: true, description: "URL de la page de paiement hébergée par l'agrégateur (PayDunya/CinetPay)" }
        status: { type: string, enum: [Initiated, Confirmed, Failed], nullable: true }
        activatedWithoutPayment:
          type: boolean
          default: false
          description: Vrai lorsque le code promo a intégralement couvert l'abonnement — aucun paiement n'a eu lieu.

    SubscriptionPaymentHistoryItem:
      type: object
      description: Ligne de GET /subscriptions/{schoolId}/payments (ticket JGK-I07).
      properties:
        id: { type: string, format: uuid }
        initiatedAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time, nullable: true }
        amount: { type: number }
        currency: { type: string, example: XOF }
        billingPeriod: { type: string, enum: [Monthly, Yearly] }
        method: { type: string, enum: [MobileMoney, BankTransfer, Card] }
        status: { type: string, enum: [Initiated, Confirmed, Failed] }
        providerTransactionRef: { type: string, nullable: true }

    PaginatedSubscriptionPayments:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SubscriptionPaymentHistoryItem' } }
        totalCount: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        subscriptionStatus: { type: string, enum: [AwaitingPayment, Active, Suspended, ReadOnly] }
        subscriptionPlan: { type: string, enum: [Primaire, Standard, Premium] }
        subscriptionExpiresAt: { type: string, format: date, nullable: true }

    ChangeSchoolStatusRequest:
      type: object
      required: [status, reason]
      properties:
        status: { type: string, enum: [Active, Suspended, Blocked] }
        reason: { type: string, minLength: 5, maxLength: 500 }

    ChangeSchoolStatusResult:
      type: object
      properties:
        schoolId: { type: string, format: uuid }
        previousStatus: { type: string, enum: [Active, Suspended, Blocked] }
        newStatus: { type: string, enum: [Active, Suspended, Blocked] }
        revokedSessions:
          type: integer
          description: Nombre de refresh tokens révoqués par ce changement (0 lors d'une réactivation).

    PromoCode:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: "RENTREE2026" }
        discountType: { type: string, enum: [Percentage, FixedAmount, FreeTrialMonths, FullDiscount] }
        discountValue: { type: number }
        durationMonths: { type: integer, nullable: true }
        maxUses: { type: integer, nullable: true }
        currentUses: { type: integer }
        startDateUtc: { type: string, format: date-time }
        endDateUtc: { type: string, format: date-time }
        isActive: { type: boolean }
        beneficiarySchoolNames:
          type: array
          items: { type: string }
          description: Écoles ayant déjà consommé ce code.

    PromoCodeCreateRequest:
      type: object
      required: [code, discountType, startDateUtc, endDateUtc]
      properties:
        code:
          type: string
          maxLength: 32
          pattern: '^[A-Za-z0-9_-]+$'
          description: Normalisé en MAJUSCULES côté serveur avant stockage/vérification d'unicité.
        discountType: { type: string, enum: [Percentage, FixedAmount, FreeTrialMonths, FullDiscount] }
        discountValue:
          type: number
          description: "0,01 à 100 pour Percentage ; > 0 pour FixedAmount ; ignoré pour FreeTrialMonths/FullDiscount."
        durationMonths:
          type: integer
          nullable: true
          minimum: 1
          description: Obligatoire et > 0 pour FreeTrialMonths et FullDiscount.
        maxUses: { type: integer, nullable: true, minimum: 1 }
        startDateUtc: { type: string, format: date-time }
        endDateUtc: { type: string, format: date-time, description: Doit être postérieure à startDateUtc. }

    PromoCodeCreateResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }

    GrantComplimentaryAccessRequest:
      type: object
      required: [plan, durationMonths]
      properties:
        plan: { type: string, enum: [Primaire, Standard, Premium] }
        durationMonths: { type: integer, minimum: 1, maximum: 60 }

    TopUpSmsCreditsRequest:
      type: object
      required: [segments]
      properties:
        segments: { type: integer, minimum: 1, maximum: 1000000 }

    AttachSchoolRequest:
      type: object
      required: [schoolId]
      properties:
        schoolId: { type: string, format: uuid }

    ValidatePromoCodeRequest:
      type: object
      required: [code, billingPeriod]
      properties:
        code: { type: string, maxLength: 32 }
        billingPeriod: { type: string, enum: [Monthly, Yearly] }

    ValidatePromoCodeResult:
      type: object
      properties:
        isValid: { type: boolean }
        message:
          type: string
          nullable: true
          description: "Motif d'invalidité (code inconnu, expiré, épuisé…) — présent seulement si isValid=false."
        baseAmount: { type: number, nullable: true }
        discountedAmount: { type: number, nullable: true }
        requiresPayment:
          type: boolean
          description: Faux pour FreeTrialMonths/FullDiscount — le paiement peut être sauté entièrement.

    PayoutMethod:
      type: string
      enum: [Cash, BankTransfer, Wave, OrangeMoney]
      description: >-
        Moyen de règlement du salaire (ticket JGK-K02) — distinct du PaymentMethod du module Finance
        élèves, un domaine différent qui ne doit jamais partager cette énumération.

    EmployeeContract:
      type: object
      description: Ligne de GET /finance/employee-contracts (Volume 1 §14.1).
      properties:
        id: { type: string, format: uuid }
        teacherId: { type: string, format: uuid, nullable: true }
        userId: { type: string, format: uuid, nullable: true }
        employeeFullName: { type: string }
        employeeRole: { type: string, example: Enseignant }
        type: { type: string, enum: [Permanent, Vacataire] }
        baseSalary: { type: number }
        hourlyRate: { type: number }
        transportAllowance: { type: number }
        payoutMethod: { $ref: '#/components/schemas/PayoutMethod' }
        payoutAccountReference:
          type: string
          nullable: true
          description: RIB/IBAN pour BankTransfer, numéro de téléphone pour Wave/OrangeMoney. Jamais journalisé en clair (Volume 7).
        endDate:
          type: string
          format: date
          nullable: true
          description: Null tant que le contrat est actif ; posé par POST .../close.
        rowVersion:
          type: integer
          format: int64
          description: Jeton de concurrence (xmin) à renvoyer sur PATCH/close.

    EmployeeContractCreateRequest:
      type: object
      description: Lié à teacherId OU userId, jamais les deux ni aucun.
      required: [type, baseSalary, hourlyRate, transportAllowance]
      properties:
        teacherId: { type: string, format: uuid, nullable: true }
        userId: { type: string, format: uuid, nullable: true }
        type: { type: string, enum: [Permanent, Vacataire] }
        baseSalary: { type: number, minimum: 0, description: "Obligatoire (> 0) si type=Permanent." }
        hourlyRate: { type: number, minimum: 0, description: "Obligatoire (> 0) si type=Vacataire." }
        transportAllowance: { type: number, minimum: 0 }
        payoutMethod: { allOf: [{ $ref: '#/components/schemas/PayoutMethod' }], default: Cash }
        payoutAccountReference: { type: string, nullable: true, maxLength: 50 }

    UpdateEmployeeContractRequest:
      type: object
      required: [baseSalary, hourlyRate, transportAllowance, reason, rowVersion]
      properties:
        baseSalary: { type: number, minimum: 0 }
        hourlyRate: { type: number, minimum: 0 }
        transportAllowance: { type: number, minimum: 0 }
        payoutMethod: { allOf: [{ $ref: '#/components/schemas/PayoutMethod' }], default: Cash }
        payoutAccountReference: { type: string, nullable: true, maxLength: 50 }
        reason: { type: string, minLength: 5, maxLength: 500 }
        rowVersion:
          type: integer
          format: int64
          description: Jeton de concurrence (xmin) renvoyé par le dernier GET /finance/employee-contracts.

    UpdateEmployeeContractResult:
      type: object
      properties:
        contractId: { type: string, format: uuid }
        baseSalary: { type: number }
        hourlyRate: { type: number }
        transportAllowance: { type: number }
        payoutMethod: { $ref: '#/components/schemas/PayoutMethod' }
        payoutAccountReference: { type: string, nullable: true }
        rowVersion:
          type: integer
          format: int64
          description: Nouveau jeton après écriture, pour enchaîner une modification sans recharger.

    CloseEmployeeContractRequest:
      type: object
      required: [endDate, reason, rowVersion]
      properties:
        endDate: { type: string, format: date }
        reason: { type: string, minLength: 5, maxLength: 500 }
        rowVersion:
          type: integer
          format: int64
          description: Jeton de concurrence (xmin) renvoyé par le dernier GET /finance/employee-contracts.

    CloseEmployeeContractResult:
      type: object
      description: Pas de rowVersion en retour — la clôture est terminale, aucune modification ultérieure n'est attendue.
      properties:
        contractId: { type: string, format: uuid }
        endDate: { type: string, format: date }

    SignatureUploadResult:
      type: object
      properties:
        url:
          type: string
          description: >-
            URL relative du fichier enregistré, à reporter dans le champ *SignatureUrl/officialStampUrl
            correspondant via PUT /schools/current/settings.

    PaginatedSmsHistory:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SmsHistoryItem' } }
        totalCount: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        creditBalance: { type: integer }
        pendingCount: { type: integer }

    SmsHistoryItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        sentAt: { type: string, format: date-time }
        recipient: { type: string }
        body: { type: string }
        trigger: { type: string, enum: [AttendanceAlert, DuesReminder, PaymentReceipt, ReportCard, Manual] }
        status: { type: string, enum: [Pending, Sent, Delivered, Failed, InsufficientCredit] }
        segmentCount: { type: integer }
        failureReason: { type: string, nullable: true }

    SendDuesRemindersRequest:
      type: object
      properties:
        classroomId: { type: string, format: uuid, nullable: true, description: Omis = tout l'établissement. }

    DuesReminderSmsResult:
      type: object
      properties:
        queuedCount: { type: integer }
        skippedCount: { type: integer }
        firstSkipReason: { type: string, nullable: true }

    SmsDeliveryReceiptResult:
      type: object
      properties:
        appliedCount: { type: integer }
        ignoredCount: { type: integer }

    # ---------------------------------------------------------------- Module Inventaire

    ItemCondition:
      type: string
      description: >-
        État DOMINANT d'un lot, pas une répartition : une école qui veut distinguer « 120 tables-bancs
        en bon état » de « 50 à réparer » crée deux lots et transfère les quantités par un ajustement.
      enum: [Neuf, Bon, AReparer, HorsService]

    StockMovementType:
      type: string
      description: >-
        Nature d'une ligne du journal, telle qu'elle est ÉCRITE. Plus large que ce qu'un utilisateur
        peut saisir (voir StockMovementCreateRequest.type) : les mouvements de prêt sont produits
        exclusivement par les endpoints d'affectation. La quantité d'un mouvement est TOUJOURS
        strictement positive — le sens vient du type, jamais du signe.


        Effet sur le couple (total, disponible) : `Entree`/`AjustementPositif` +q/+q ;
        `Sortie`/`AjustementNegatif`/`MiseAuRebut` −q/−q ; `Attribution` 0/−q (le bien prêté reste au
        patrimoine) ; `Restitution` 0/+q ; `PerteSurPret` −q/0 (ces unités étaient déjà hors du
        disponible depuis l'attribution).
      enum:
        - Entree
        - Sortie
        - AjustementPositif
        - AjustementNegatif
        - Attribution
        - Restitution
        - MiseAuRebut
        - PerteSurPret

    AssignmentBeneficiaryType:
      type: string
      enum: [Eleve, Enseignant, Personnel]

    AssignmentStatus:
      type: string
      enum: [EnCours, Restitue, PartiellementRestitue, Perdu]

    InventoryCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        description: { type: string, nullable: true, maxLength: 300 }
        itemCount: { type: integer }
        totalQuantity: { type: integer }
        rowVersion: { type: integer, format: int64, description: Jeton xmin pour la modification/suppression. }

    InventoryCategoryCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100, example: Manuels scolaires }
        description: { type: string, nullable: true, maxLength: 300 }

    InventoryCategoryUpdateRequest:
      type: object
      required: [name, rowVersion]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, nullable: true, maxLength: 300 }
        rowVersion: { type: integer, format: int64 }

    InventoryItemCreateRequest:
      type: object
      required: [name, categoryId]
      properties:
        name: { type: string, maxLength: 150, example: Manuel de mathématiques CM2 }
        code:
          type: string
          nullable: true
          maxLength: 50
          description: >-
            Code d'inventaire ou code-barres, en saisie LIBRE et facultative : les écoles publiques
            réutilisent le numéro d'immatriculation posé sur le bien par la mairie ou l'État, qu'aucune
            numérotation générée par la plateforme ne doit écraser. Unique par école s'il est renseigné.
        categoryId: { type: string, format: uuid }
        initialQuantity:
          type: integer
          minimum: 0
          default: 0
          description: Traduite par le serveur en un mouvement d'entrée. Zéro est licite (bien attendu, pas encore livré).
        condition: { $ref: '#/components/schemas/ItemCondition' }
        roomId:
          type: string
          format: uuid
          nullable: true
          description: Salle d'entreposage (module Infrastructures), quand l'école a saisi ses bâtiments.
        locationLabel:
          type: string
          nullable: true
          maxLength: 100
          description: Emplacement en texte libre, pour un local qui n'est pas une salle (« Réserve A »).
        unitPrice:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: Prix unitaire INDICATIF en FCFA, sans portée comptable ni amortissement.
        isConsumable:
          type: boolean
          default: false
          description: Un consommable se distribue et ne revient jamais — il ne peut pas faire l'objet d'un prêt.
        notes: { type: string, nullable: true, maxLength: 500 }

    InventoryItemUpdateRequest:
      type: object
      required: [name, categoryId, rowVersion]
      description: Aucune quantité ici — voir la description de PUT /inventory/items/{id}.
      properties:
        name: { type: string, maxLength: 150 }
        code: { type: string, nullable: true, maxLength: 50 }
        categoryId: { type: string, format: uuid }
        condition: { $ref: '#/components/schemas/ItemCondition' }
        roomId: { type: string, format: uuid, nullable: true }
        locationLabel: { type: string, nullable: true, maxLength: 100 }
        unitPrice: { type: number, format: double, nullable: true, minimum: 0 }
        isConsumable: { type: boolean }
        notes: { type: string, nullable: true, maxLength: 500 }
        rowVersion: { type: integer, format: int64 }

    InventoryItemResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string, nullable: true }
        categoryId: { type: string, format: uuid }
        quantityTotal: { type: integer }
        quantityAvailable: { type: integer }
        condition: { $ref: '#/components/schemas/ItemCondition' }
        roomId: { type: string, format: uuid, nullable: true }
        locationLabel: { type: string, nullable: true }
        unitPrice: { type: number, format: double, nullable: true }
        isConsumable: { type: boolean }
        rowVersion: { type: integer, format: int64 }

    InventoryItemListItem:
      allOf:
        - $ref: '#/components/schemas/InventoryItemResult'
        - type: object
          properties:
            categoryName: { type: string }
            roomName: { type: string, nullable: true }
            onLoanQuantity: { type: integer, description: 'Calculé : total − disponible.' }

    PaginatedInventoryItems:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InventoryItemListItem' }
        totalCount: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    InventoryItemDetail:
      allOf:
        - $ref: '#/components/schemas/InventoryItemListItem'
        - type: object
          properties:
            notes: { type: string, nullable: true }
            recentMovements:
              type: array
              description: Les 20 derniers mouvements, du plus récent au plus ancien.
              items: { $ref: '#/components/schemas/InventoryItemMovement' }
            openAssignments:
              type: array
              items: { $ref: '#/components/schemas/InventoryItemOpenAssignment' }

    InventoryItemMovement:
      type: object
      properties:
        id: { type: string, format: uuid }
