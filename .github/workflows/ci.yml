name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sama_ecole_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: sama_ecole_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sama_ecole_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Tests JS (node:test, ni navigateur ni dépendance externe). Ils portent notamment les
      # GARDE-FOUS de non-régression de wwwroot/js — plafond pageSize, synchronisation du calendrier
      # avec son Tag Helper, cliquet sur les chargements qui échouent en silence. Placés AVANT le
      # build .NET : ils tournent en quelques secondes, ne dépendent ni de PostgreSQL ni de Docker,
      # et attrapent en amont exactement le genre de défaut qui n'était jusqu'ici trouvé qu'en
      # production, par un utilisateur (« la liste des élèves ne charge pas »).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/SamaEcole.Web/package-lock.json

      - name: Installer les dépendances front
        run: npm ci --prefix src/SamaEcole.Web

      - name: Tests JS (garde-fous de non-régression)
        run: npm test --prefix src/SamaEcole.Web

      - name: Restore
        run: dotnet restore SamaEcole.sln

      - name: Build
        run: dotnet build SamaEcole.sln --no-restore --configuration Release

      # Rôle applicatif : NOSUPERUSER + NOBYPASSRLS, propriétaire d'aucune table. C'est lui qui doit
      # subir les policies RLS (ticket JGK-A03). Le service postgres de GitHub n'exécute pas les
      # scripts docker-entrypoint-initdb.d, on le crée donc explicitement.
      - name: Créer le rôle applicatif (non-superuser, sans BYPASSRLS)
        env:
          PGPASSWORD: test_password
        run: |
          psql -h localhost -U sama_ecole_test -d sama_ecole_test -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE sama_ecole_app LOGIN PASSWORD 'test_app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;"
          psql -h localhost -U sama_ecole_test -d sama_ecole_test -v ON_ERROR_STOP=1 -c \
            "GRANT CONNECT ON DATABASE sama_ecole_test TO sama_ecole_app; GRANT USAGE ON SCHEMA public TO sama_ecole_app;"

      # Applique les migrations avec le rôle PROPRIÉTAIRE : valide en CI que le SQL de la migration
      # RLS (ALTER TABLE / CREATE POLICY / GRANT) passe réellement sur un PostgreSQL neuf.
      - name: Appliquer les migrations (rôle propriétaire)
        env:
          ConnectionStrings__Migrations: "Host=localhost;Port=5432;Database=sama_ecole_test;Username=sama_ecole_test;Password=test_password"
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef database update -p src/SamaEcole.Persistence -s src/SamaEcole.Web --configuration Release --no-build

      # Prouve que le rôle applicatif ne peut PAS contourner la RLS. Si quelqu'un lui redonne
      # SUPERUSER ou BYPASSRLS un jour, la CI casse ici plutôt qu'en production.
      - name: Vérifier que le rôle applicatif ne contourne pas la RLS
        env:
          PGPASSWORD: test_password
        run: |
          UNSAFE=$(psql -h localhost -U sama_ecole_test -d sama_ecole_test -tAc \
            "SELECT count(*) FROM pg_roles WHERE rolname = 'sama_ecole_app' AND (rolsuper OR rolbypassrls);")
          if [ "$UNSAFE" != "0" ]; then
            echo "::error::Le rôle sama_ecole_app est superutilisateur ou porte BYPASSRLS : l'isolation multi-tenant serait inopérante."
            exit 1
          fi

      - name: Run unit tests
        run: dotnet test tests/SamaEcole.UnitTests --no-build --configuration Release --logger "trx;LogFileName=unit.trx"

      # Les tests d'intégration démarrent leur propre PostgreSQL via Testcontainers (Docker est
      # disponible sur ubuntu-latest) : ils créent le rôle applicatif et posent la RLS eux-mêmes.
      - name: Run integration tests (incl. isolation multi-tenant)
        run: dotnet test tests/SamaEcole.IntegrationTests --no-build --configuration Release --logger "trx;LogFileName=integration.trx"

      # Les tests fonctionnels ne tournaient PAS en CI : les critères d'acceptation de JGK-A04
      # (token expiré → 401, refresh token révoqué après logout, refresh token jamais exposé hors du
      # cookie HttpOnly) n'étaient donc vérifiés que sur le poste du développeur qui y pensait.
      # Comme les tests d'intégration, ils démarrent leur propre PostgreSQL via Testcontainers.
      - name: Run functional tests (parcours HTTP réels, authentification)
        run: dotnet test tests/SamaEcole.FunctionalTests --no-build --configuration Release --logger "trx;LogFileName=functional.trx"

      # Le test d'isolation est le garde-fou n°1 du multi-tenant : il doit RÉELLEMENT s'exécuter.
      # Un test ignoré (Skip) compte comme "réussi" pour dotnet test — on refuse donc explicitement
      # un run où aucun test MultiTenant n'a été exécuté.
      - name: Vérifier que le test d'isolation multi-tenant s'exécute vraiment
        run: |
          OUTPUT=$(dotnet test tests/SamaEcole.IntegrationTests --filter Category=MultiTenant \
            --no-build --configuration Release)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qiE 'Passed!.*Failed:\s*0.*Passed:\s*[1-9]'; then
            echo "Test d'isolation multi-tenant exécuté et réussi."
          else
            echo "::error::Aucun test Category=MultiTenant n'a été réellement exécuté (ignoré ou absent)."
            exit 1
          fi

      - name: Publier les résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write # requis par google-github-actions/auth (Workload Identity Federation)
    env:
      REGION: europe-west1
      WEB_IMAGE: europe-west1-docker.pkg.dev/sama-ecole-prod/sama-ecole-repo/sama-ecole-web
      TOOLS_IMAGE: europe-west1-docker.pkg.dev/sama-ecole-prod/sama-ecole-repo/sama-ecole-tools
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fédération d'identité de charge de travail : aucune clé de service account stockée dans
      # GitHub. github-deployer@sama-ecole-prod n'est autorisé qu'à agir depuis CE dépôt (attribute
      # condition posée côté GCP sur github-provider) — voir docs/Volume_9_Deployment_Operations.md §4.
      - name: Authentification GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/403364907293/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@sama-ecole-prod.iam.gserviceaccount.com

      - name: Configurer gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Authentifier Docker sur Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Construire et pousser l'image web
        run: |
          docker build -f Dockerfile -t "$WEB_IMAGE:${{ github.sha }}" -t "$WEB_IMAGE:latest" .
          docker push "$WEB_IMAGE:${{ github.sha }}"
          docker push "$WEB_IMAGE:latest"

      # Image séparée (rôle propriétaire, jamais applicatif) pour le Job de migration — voir
      # tools/SamaEcole.Tools/Dockerfile et AGENTS.md règle #2.
      - name: Construire et pousser l'image des outils (migrations)
        run: |
          docker build -f tools/SamaEcole.Tools/Dockerfile -t "$TOOLS_IMAGE:${{ github.sha }}" -t "$TOOLS_IMAGE:latest" .
          docker push "$TOOLS_IMAGE:${{ github.sha }}"
          docker push "$TOOLS_IMAGE:latest"

      # `jobs update` ne touche qu'à l'image : --set-cloudsql-instances, les variables d'environnement
      # et le mot de passe du rôle propriétaire déjà posés sur le Job restent intacts.
      - name: Mettre à jour l'image du Job de migration
        run: |
          gcloud run jobs update sama-ecole-migrate \
            --region="$REGION" \
            --image="$TOOLS_IMAGE:${{ github.sha }}"

      # Bloque le déploiement du service si une migration échoue : le code neuf n'est jamais servi
      # sur un schéma qui ne correspond pas. Rejouer sur une base à jour est sans danger (voir doc).
      - name: Exécuter les migrations EF Core
        run: gcloud run jobs execute sama-ecole-migrate --region="$REGION" --wait

      # Volontairement SANS --set-env-vars/--update-env-vars : gcloud run deploy reprend automatiquement
      # les variables d'environnement et secrets de la révision précédente quand on ne les repasse pas.
      - name: Déployer le service Cloud Run
        run: |
          gcloud run deploy sama-ecole-web \
            --image="$WEB_IMAGE:${{ github.sha }}" \
            --region="$REGION" \
            --platform=managed \
            --quiet

      - name: Vérifier la santé du service déployé
        run: |
          URL=$(gcloud run services describe sama-ecole-web --region="$REGION" --format="value(status.url)")
          curl -fsS "$URL/health/live"
          curl -fsS "$URL/health/ready"
